# Parity inventory — area "account" (Intră, Completează profilul, Profil, Pescar, Conexiuni,
# Sugestii, Notificări, Setări notificări, Concursuri urmărite, Setări, Editează profilul,
# Onboarding, Setări de confidențialitate).
# Extracted from fish (read-only) on 2026-10-04. Line refs are fish file:line at that date.
# Web sign-in lives at /intra and takes `?next=<path>` (app/(site)/intra/SignIn.tsx#safeNext) where fish
# used `redirectTo`. The Home suggestions rail and CompleteProfileSheet are inventoried as screens in
# home.yml; here they appear only as behaviours that link into this area.
area: account
screens:
  - id: account.sign-in
    title: Intră în Bluvi
    fish:
      - app/sign-in.tsx
      - features/onboarding/useWelcomeSignIn.ts
      - features/onboarding/WelcomeControls.tsx
      - features/onboarding/WelcomeBackdrop.tsx
      - features/onboarding/welcomeTheme.ts
      - contexts/auth/AuthContext.tsx
      - services/api/profile.ts
      - common/utils/constants.ts
    web_route: /intra
    template: T6
    milestone: M2
    roles: [guest]
    core: [social.getProfile, social.getFirebaseToken]
    states:
      - idle
      - provider pending (one button spinning, everything else disabled)
      - Apple unavailable (button hidden)
      - provider cancelled (silent, back to idle)
      - error generic
      - error Facebook without email
      - legal link failed to open
      - profile incomplete after sign-in (goes to complete profile)
      - next/redirectTo present and safe
      - next/redirectTo unsafe (ignored)
    criteria:
      - id: account.sign-in.c1
        text: "The page shows the eyebrow „MAI APROAPE DE CE IUBEȘTI”, the heading „Hai la pescuit.” (a real heading) and the line „Locurile tale. Capturile tale. Comunitatea ta.”."
        fish_ref: "app/sign-in.tsx:88-96"
      - id: account.sign-in.c2
        text: "A „Continuă cu Apple” button is shown only when Apple sign-in is available (fish: iOS with AppleAuthentication available; web: Apple Services ID configured); otherwise it is absent, not disabled."
        fish_ref: "app/sign-in.tsx:40-45,99-111"
      - id: account.sign-in.c3
        text: "„Continuă cu Google” and „Continuă cu Facebook” buttons are always shown, in that order after Apple, each with its provider mark."
        fish_ref: "app/sign-in.tsx:112-133"
      - id: account.sign-in.c4
        text: "While any provider is pending, all provider buttons and „Explorează fără cont” are disabled and only the pressed provider shows a loading state."
        fish_ref: "app/sign-in.tsx:36,100-104,141"
      - id: account.sign-in.c5
        text: "A second sign-in attempt while one is in flight is ignored (no second request)."
        fish_ref: "features/onboarding/useWelcomeSignIn.ts:38-40"
      - id: account.sign-in.c6
        text: "A provider cancellation (AUTH_CANCELLED, ERR_REQUEST_CANCELED, SIGN_IN_CANCELLED, 12501, or the Facebook dialog cancelled) shows no error."
        fish_ref: "features/onboarding/useWelcomeSignIn.ts:15-17,45,71"
      - id: account.sign-in.c7
        text: "When Facebook gives no email (declined permission or CMS bluCode AUTH:EMAIL_REQUIRED) the error reads „Facebook nu ne-a dat adresa ta de email. Permite accesul la email în fereastra Facebook sau intră cu Google ori Apple.”."
        fish_ref: "features/onboarding/useWelcomeSignIn.ts:22-28,72; contexts/auth/AuthContext.tsx:163-165"
      - id: account.sign-in.c8
        text: "Any other failure shows „Autentificarea nu a reușit. Te rugăm să încerci din nou.”."
        fish_ref: "features/onboarding/useWelcomeSignIn.ts:26,72"
      - id: account.sign-in.c9
        text: "The error is rendered under the provider buttons with an alert role and is cleared when a new attempt starts."
        fish_ref: "app/sign-in.tsx:134-138; features/onboarding/useWelcomeSignIn.ts:41"
      - id: account.sign-in.c10
        text: "Google posts {accessToken, idToken} to /auth/google; Facebook posts {userData:{email,name,imageURL,accessToken}, accessToken} to /auth/facebook with permissions public_profile + email; Apple posts {identityToken, authorizationCode, fullName, email} to /auth/apple."
        fish_ref: "contexts/auth/AuthContext.tsx:185-198,216-219,237-248; features/onboarding/useWelcomeSignIn.ts:44"
      - id: account.sign-in.c11
        text: "A non-OK /auth/* response surfaces the CMS bluCode (error.details.bluCode) as the error code, so the missing-email case is recognised."
        fish_ref: "contexts/auth/AuthContext.tsx:28-38"
      - id: account.sign-in.c12
        text: "The returned jwt must be a three-part JWT whose decoded payload is valid and has a user id; otherwise the attempt fails with the generic error and nothing is stored."
        fish_ref: "contexts/auth/AuthContext.tsx:136-143"
      - id: account.sign-in.c13
        text: "After the session is stored the Firebase session is bridged with the returned firebaseToken (needed for chat and live partide); a Firebase failure does not fail the sign-in."
        fish_ref: "contexts/auth/AuthContext.tsx:147-148"
      - id: account.sign-in.c14
        text: "After a successful sign-in the active-partidă probe runs once (fire-and-forget) so a session still running server-side is restored."
        fish_ref: "contexts/auth/AuthContext.tsx:149-154"
      - id: account.sign-in.c15
        text: "After the session is stored GET /user/profile is fetched; if it fails the attempt shows the generic error."
        fish_ref: "features/onboarding/useWelcomeSignIn.ts:52-53"
      - id: account.sign-in.c16
        text: "If profile.isProfileComplete is false the user is sent (replace) to the complete-profile screen, before any redirect target."
        fish_ref: "features/onboarding/useWelcomeSignIn.ts:61-62"
      - id: account.sign-in.c17
        text: "Otherwise, a redirect target (fish redirectTo, web next) is honoured only if it starts with a single slash and contains no backslash or whitespace (web additionally rejects /intra); else the user goes back, or to home when there is no history."
        fish_ref: "features/onboarding/useWelcomeSignIn.ts:63-69"
      - id: account.sign-in.c18
        text: "„Explorează fără cont” goes back when there is history, otherwise to home; it does nothing while a sign-in is pending."
        fish_ref: "app/sign-in.tsx:140-144; features/onboarding/useWelcomeSignIn.ts:81-85"
      - id: account.sign-in.c19
        text: "The legal caption reads „Continuând, accepți Termenii și condițiile. Află cum îți prelucrăm datele în Politica de confidențialitate.” followed by the links „Termeni și condiții” and „Confidențialitate” (Termly URLs), each at least 44px tall."
        fish_ref: "app/sign-in.tsx:145-168,185; common/utils/constants.ts:30-33"
      - id: account.sign-in.c20
        text: "If a legal link cannot be opened the page shows „Nu am putut deschide pagina. Încearcă din nou.” in the same alert slot."
        fish_ref: "app/sign-in.tsx:61-68,134-137"
      - id: account.sign-in.c21
        text: "A sign_in analytics event with the provider is logged after success and never blocks or fails navigation."
        fish_ref: "features/onboarding/useWelcomeSignIn.ts:55-60"
      - id: account.sign-in.c22
        text: "Motion on the backdrop respects reduced motion and stops while a sign-in is pending."
        fish_ref: "app/sign-in.tsx:31,73"
    mobile_only: false
    status: todo

  - id: account.complete-profile
    title: Completează profilul
    fish:
      - app/(app)/complete-profile.tsx
      - components/EditProfileScreen.tsx
      - schemas/userProfile.schema.ts
      - schemas/phone.schema.ts
      - helpers/buildAvatarUrl.ts
      - services/mutations/useUpdateProfile.ts
      - services/mutations/useUploadProfilePicture.ts
      - services/queries/useProfile.ts
    web_route: /profil/completeaza
    template: T6
    milestone: M2
    roles: [angler, organizer, referee, operator]
    core: [social.profileQuery, social.updateProfileMutation, social.uploadProfilePictureMutation, social.domain.profilePictureFilename]
    states:
      - signed-out (redirect to /intra)
      - loading profile
      - profile error (retry)
      - no avatar yet (generated avatar, dirty)
      - validation errors
      - username taken / phone taken / bio too long (server)
      - uploading avatar + saving
    criteria:
      - id: account.complete-profile.c1
        text: "The screen is titled „Completează profilul” and has no back control."
        fish_ref: "app/(app)/complete-profile.tsx:10-11"
      - id: account.complete-profile.c2
        text: "„Finalizează” is enabled even when nothing was changed (unlike edit profile), so a user can accept the prefilled values."
        fish_ref: "app/(app)/complete-profile.tsx:15; components/EditProfileScreen.tsx:405"
      - id: account.complete-profile.c3
        text: "On success the user is sent (replace) to home, with no toast."
        fish_ref: "app/(app)/complete-profile.tsx:12-14"
      - id: account.complete-profile.c4
        text: "The form is prefilled from the profile; when the profile has no avatar a random generated avatar (DiceBear personas URL) is set and marked changed, so it is uploaded on submit."
        fish_ref: "components/EditProfileScreen.tsx:87-100; helpers/buildAvatarUrl.ts:30-43"
      - id: account.complete-profile.c5
        text: "Fields, validation, server errors and the save sequence are those of account.edit-profile c3–c14."
        fish_ref: "components/EditProfileScreen.tsx:102-158,293-410"
      - id: account.complete-profile.c6
        text: "The user arrives here right after sign-in when profile.isProfileComplete is false (replace, so Back does not return to sign-in)."
        fish_ref: "features/onboarding/useWelcomeSignIn.ts:61-62"
    mobile_only: false
    status: todo

  - id: account.edit-profile
    title: Editează profilul
    fish:
      - app/(app)/edit-profile.tsx
      - components/EditProfileScreen.tsx
      - components/ScrollScreen.tsx
      - schemas/userProfile.schema.ts
      - schemas/phone.schema.ts
      - helpers/buildAvatarUrl.ts
      - hooks/useCamera.ts
      - services/api/profile.ts
      - services/api/media.ts
      - services/mutations/useUpdateProfile.ts
      - services/mutations/useUploadProfilePicture.ts
      - services/queries/useProfile.ts
    web_route: /setari/profil
    template: T6
    milestone: M2
    roles: [angler, organizer, referee, operator]
    core: [social.profileQuery, social.updateProfileMutation, social.uploadProfilePictureMutation, social.domain.uploadImageTarget, social.domain.profilePictureFilename]
    states:
      - signed-out (redirect to /intra)
      - loading profile
      - profile error (retry)
      - pristine (submit disabled)
      - dirty
      - validation errors (username length, phone format, bio length)
      - server errors (USERNAME_ALREADY_IN_USE, PHONE_NUMBER_ALREADY_IN_USE, UPDATE_PROFILE:BIO_TOO_LONG, other)
      - uploading avatar
      - saving
    criteria:
      - id: account.edit-profile.c1
        text: "The screen is titled „Editează profilul” and has a back control."
        fish_ref: "app/(app)/edit-profile.tsx:11; components/EditProfileScreen.tsx:294"
      - id: account.edit-profile.c2
        text: "While the profile loads a full loading state is shown; on error an error state with a retry that refetches the profile."
        fish_ref: "components/EditProfileScreen.tsx:171-173"
      - id: account.edit-profile.c3
        text: "The current avatar is shown as a 150px circle with a camera badge; activating it opens the image picker."
        fish_ref: "components/EditProfileScreen.tsx:296-322"
      - id: account.edit-profile.c4
        text: "Under the avatar: „Regenerează avatar” · „sau” · „Încarcă fotografie”; regenerate sets a new random generated avatar, upload opens the image picker; both mark the avatar changed."
        fish_ref: "components/EditProfileScreen.tsx:160-169,324-336"
      - id: account.edit-profile.c5
        text: "Field „Nume utilizator*” is required, 3–20 characters, with errors „Numele de utilizator trebuie să conțină minim 3 caractere” / „Numele de utilizator poate conține maximum 20 de caractere”."
        fish_ref: "schemas/userProfile.schema.ts:5-8; components/EditProfileScreen.tsx:340-354"
      - id: account.edit-profile.c6
        text: "Field „Telefon (optional)” accepts empty, otherwise an optional leading + and 7–15 digits, error „Numărul de telefon trebuie să aibă între 7 și 15 cifre”; typed input is sanitised to digits plus one leading + (as the sheet variant does)."
        fish_ref: "schemas/phone.schema.ts:9-17,23-26; components/EditProfileScreen.tsx:247-249,357-371"
      - id: account.edit-profile.c7
        text: "Field „Biografie” is a 3-line textarea limited to 200 characters, error „Biografia poate conține maximum 200 de caractere”."
        fish_ref: "schemas/userProfile.schema.ts:11; components/EditProfileScreen.tsx:374-390"
      - id: account.edit-profile.c8
        text: "Below the fields the text „Autentificat cu: {provider}” is shown, „-” when unknown."
        fish_ref: "components/EditProfileScreen.tsx:393-395"
      - id: account.edit-profile.c9
        text: "„Finalizează” is disabled until the form is changed and shows loading while the upload or the update is pending."
        fish_ref: "components/EditProfileScreen.tsx:397-408"
      - id: account.edit-profile.c10
        text: "When the avatar changed, the image is uploaded first (filename profile_id_{id}_{timestamp}.jpg) and then PATCH /user/profile is sent with {avatar: uploadedId, username, phone, bio}."
        fish_ref: "components/EditProfileScreen.tsx:108-139"
      - id: account.edit-profile.c11
        text: "When the avatar did not change, PATCH /user/profile is sent with {username, phone, bio} only."
        fish_ref: "components/EditProfileScreen.tsx:141-157"
      - id: account.edit-profile.c12
        text: "An empty phone is sent as null and a blank (whitespace-only) bio is sent as null."
        fish_ref: "components/EditProfileScreen.tsx:126-127,145-146"
      - id: account.edit-profile.c13
        text: "Server bluCode USERNAME_ALREADY_IN_USE puts the server message on the username field, PHONE_NUMBER_ALREADY_IN_USE on phone, UPDATE_PROFILE:BIO_TOO_LONG on bio."
        fish_ref: "components/EditProfileScreen.tsx:69-85"
      - id: account.edit-profile.c14
        text: "Any update failure also shows an error toast with the server message."
        fish_ref: "components/EditProfileScreen.tsx:133-135,152-154"
      - id: account.edit-profile.c15
        text: "On success the screen closes and a success toast „Profilul a fost actualizat cu succes” is shown."
        fish_ref: "app/(app)/edit-profile.tsx:12-15"
      - id: account.edit-profile.c16
        text: "After the update (success or error) the own profile query and every angler query are invalidated, so the profile page, settings card and top-bar avatar show the new name, bio and avatar."
        fish_ref: "services/mutations/useUpdateProfile.ts:12-17"
      - id: account.edit-profile.c17
        text: "Entry points: the profile card on Settings and „Editează profil” in the organizer-request phone alert."
        fish_ref: "app/(app)/settings.tsx:116,174"
    mobile_only: false
    status: todo

  - id: account.own-profile
    title: Profilul meu
    fish:
      - app/(app)/(tabs)/profile.tsx
      - app/(app)/(tabs)/_layout.tsx
      - components/profile/AnglerProfileScreen.tsx
      - components/profile/ProfileHeader.tsx
      - components/profile/ProfileSkeleton.tsx
      - services/queries/useProfile.ts
      - services/mutations/useUpdateProfile.ts
      - components/errors/RouteErrorBoundary.tsx
    web_route: /profil
    template: T3
    milestone: M2
    roles: [angler, organizer, referee, operator]
    core: [social.profileQuery, social.anglerProfileQuery, social.anglerCatchesInfiniteQuery, social.anglerSessionsInfiniteQuery, social.anglerCompetitionsInfiniteQuery, social.userReputationQuery]
    states:
      - signed-out (redirect to /intra?next=/profil)
      - profile not loaded yet
      - all states of account.angler-profile
      - render error (route error boundary with retry)
    criteria:
      - id: account.own-profile.c1
        text: "Signed out, the profile entry is not offered (tab hidden) and the route renders nothing; on web the route redirects to /intra?next=/profil."
        fish_ref: "app/(app)/(tabs)/profile.tsx:10-15; app/(app)/(tabs)/_layout.tsx:99"
      - id: account.own-profile.c2
        text: "Signed in, the page renders the angler profile of profile.documentId in own mode; every criterion of account.angler-profile c2–c37 applies."
        fish_ref: "app/(app)/(tabs)/profile.tsx:17"
      - id: account.own-profile.c3
        text: "Own mode shows a settings (cog) control at the top right that opens /setari, and no back control."
        fish_ref: "components/profile/AnglerProfileScreen.tsx:324-339"
      - id: account.own-profile.c4
        text: "Own mode shows no follow button (profile.isSelf) and its header skeleton has no follow-button placeholder."
        fish_ref: "components/profile/ProfileHeader.tsx:115-119; components/profile/ProfileSkeleton.tsx:33-37"
      - id: account.own-profile.c5
        text: "The navigation entry for the profile shows the user's avatar thumbnail (Bluvi logo when none) with an accent ring when the profile is the current page."
        fish_ref: "app/(app)/(tabs)/_layout.tsx:96-126"
      - id: account.own-profile.c6
        text: "Changes saved in edit profile appear here without a manual refresh (all angler queries invalidated)."
        fish_ref: "services/mutations/useUpdateProfile.ts:14-17"
      - id: account.own-profile.c7
        text: "If the page throws while rendering, a route-level error with retry is shown and the rest of the app keeps working."
        fish_ref: "app/(app)/(tabs)/profile.tsx:20-22"
      - id: account.own-profile.c8
        text: "The Home profile card opens /profil when signed in and /intra („Conectează-te”) when signed out."
        fish_ref: "app/(app)/(tabs)/index.tsx:270-276,343-345"
    mobile_only: false
    status: todo

  - id: account.angler-profile
    title: Profil pescar
    fish:
      - app/(app)/anglers/[documentId]/index.tsx
      - app/(app)/anglers/_layout.tsx
      - components/profile/AnglerProfileScreen.tsx
      - components/profile/ProfileHeader.tsx
      - components/profile/StatStrip.tsx
      - components/profile/TrophyRow.tsx
      - components/profile/BioText.tsx
      - components/profile/FollowButton.tsx
      - components/profile/FilterChips.tsx
      - components/profile/SessionHistoryCard.tsx
      - components/profile/CompetitionHistoryCard.tsx
      - components/profile/CatchDetailFooter.tsx
      - components/profile/ProfileSkeleton.tsx
      - components/InitialsAvatar.tsx
      - components/ImageLightbox.tsx
      - components/BackButton.tsx
      - features/partide/components/ShareCatchSheet.tsx
      - features/partide/components/card/cardModel.ts
      - features/reputation/ReputationBlock.tsx
      - helpers/groupSessionsByMonth.ts
      - helpers/fmtCompetitionRange.ts
      - helpers/dedupeByKey.ts
      - helpers/chunkIntoRows.ts
      - helpers/anglerCatchToShareEvent.ts
      - services/api/anglers.ts
      - services/api/reviews.ts
      - services/queries/useAnglerProfile.ts
      - services/queries/useAnglerHistory.ts
      - services/queries/useUserReputation.ts
      - services/mutations/useFollowAngler.ts
    web_route: /pescari/[id]
    template: T3
    milestone: M2
    roles: [angler, organizer, referee, operator]
    core:
      - social.anglerProfileQuery
      - social.anglerCatchesInfiniteQuery (cursor, pageSize 20)
      - social.anglerSessionsInfiniteQuery (pageSize 10)
      - social.anglerCompetitionsInfiniteQuery (filter, year; keepPreviousData)
      - social.userReputationQuery
      - social.followAnglerMutation
      - social.domain.anglerReviewOverall
      - social.domain.anglerReviewTagLabels
      - social.domain.anglerReviewSubtitle
      - social.domain.ratingCountLabel
      - social.domain.noShowLabel
      - "to port: helpers/groupSessionsByMonth (PublicSession), fmtCompetitionRange, dedupeByKey, partide card fmtSpan/fmtRange/venueSubtitle"
    states:
      - signed-out (redirect to /intra?next=/pescari/[id])
      - header loading (skeleton)
      - tab loading (skeleton per tab)
      - tab empty (per tab)
      - loading next page
      - "self (isSelf: no follow button)"
      - followed / not followed / follow pending
      - no avatar (initials)
      - no ratings (rating pill hidden)
      - no podiums (trophy row hidden)
      - no bio
      - no biggest catch („–”)
      - live session card
      - finished session without endedAt
      - competitions filter with no results
      - legacy three-score review / unknown review tag
      - catch lightbox open
      - reputation panel open
    criteria:
      - id: account.angler-profile.c1
        text: "Signed out, the route sends the visitor to sign-in (the profile endpoints require auth); on web /intra?next=/pescari/[id]."
        fish_ref: "app/(app)/anglers/[documentId]/index.tsx:9-11"
      - id: account.angler-profile.c2
        text: "The header loads GET /feed/anglers/{id} (authenticated)."
        fish_ref: "services/api/anglers.ts:16-17; services/queries/useAnglerProfile.ts:6-12"
      - id: account.angler-profile.c3
        text: "Until the profile arrives a header skeleton mirrors the layout: 100px avatar circle, name bar, followers bar, four stat columns and (other mode) a follow pill."
        fish_ref: "components/profile/ProfileSkeleton.tsx:14-40"
      - id: account.angler-profile.c4
        text: "The avatar is a 100px circle (initials avatar when there is no photo); when there is a photo, activating it opens it full screen."
        fish_ref: "components/profile/ProfileHeader.tsx:36-55,123-129"
      - id: account.angler-profile.c5
        text: "When the angler has operator ratings, a pill on the avatar's lower right shows a star and avgStars with one decimal; activating it opens the reputation panel. With no ratings the pill is absent."
        fish_ref: "components/profile/ProfileHeader.tsx:28-32,56-84,131-144"
      - id: account.angler-profile.c6
        text: "The username is the page title."
        fish_ref: "components/profile/ProfileHeader.tsx:86-88"
      - id: account.angler-profile.c7
        text: "Under the name: „{followers} urmăritori · {following} urmărește”; each part opens /pescari/[id]/conexiuni on the matching tab (followers / following)."
        fish_ref: "components/profile/ProfileHeader.tsx:90-110; components/profile/AnglerProfileScreen.tsx:165-169,183-184"
      - id: account.angler-profile.c8
        text: "A trophy row shows 🥇 🥈 🥉 with their counts, only for tiers above zero; the row is absent when all three are zero."
        fish_ref: "components/profile/TrophyRow.tsx:5-26"
      - id: account.angler-profile.c9
