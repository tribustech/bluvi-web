  - id: account.b.notification-route-map
    text: "Notification → route: registration/pending/modified/start → competition; END, ROUND_END, FOLLOW_COMPETITION_END/PODIUM → competition ranking tab; NEW_REGISTRATION_ORGANIZER → participants tab filtered pending; ALLOCATION, ROUND_START, CANCELLATION/MODIFIED_ORGANIZER, FOLLOW_COMPETITION_REGISTERED/DIGEST → participants tab; WEIGHING_MODIFIED/END (needs sector, stand, standId, weighingId) → competition with that weighing open; EXTRA_WEIGHT_REQUEST → extra-scales tab; CHAT_MESSAGE → competition chat (tab from tab/chatRoom, default general; name passed); PENALTY → penalties; POLL_* → current poll; NEWS → news item; NEW_LAKES → lakes; NEW_FOLLOWER → /pescari/{followerDocumentId}; PARTIDA_INVITE → join with code; PARTIDA_FINISHED/AUTO_CLOSE_WARN → own partidă; PARTIDA_CATCH, PARTIDA_FINISHED_FOLLOWED, FOLLOW_PARTIDA_START/FIRST_CATCH → community partidă; FOLLOW_RECORD_PERSONAL/LAKE → community catches; FOLLOW_LAKE_REVIEW → lake reviews; COMPETITION_AUTO_CANCELLED_ORGANIZER → organizer panel; booking angler types → booking detail; operator booking types → operator bookings with status pending/rejected/cancelled; NEW_COMPETITIONS → competition or competitions list; COMPETITIONS_DIGEST → competitions list; SCHEDULED_NOTIFICATION, COMPETITION_CANCELLED_USER and unknown → no route. Missing required ids → no route. Ported as core social.domain.getRedirectLocationForNotification."
    fish_ref: "helpers/getRedirectLocationForNotification.ts:30-193"
    status: passing
    web_note: "Ported as core social getRedirectLocationForNotification / getRouteForNotificationItem (route descriptors) + lib/notification-href.ts (web paths, global.b.notification-routes-web). COMPETITION_ROUND_END / ROUND_START (fish 70b62908) were missing from core NotificationTypes until 2026-10-07 (they fell to «no route»); now ROUND_END → clasament, ROUND_START → participanți. tests/unit/notification-href.test.ts and core/social/domain/notificationRoute.test.ts cover every type (both assert Object.values(NotificationTypes) is fully covered) and every missing-id case."
