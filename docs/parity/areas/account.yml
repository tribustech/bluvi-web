behaviours:
  - id: account.b.signed-out-gate
    text: "Angler profile, connections, suggested anglers, notifications, settings, notification settings/preferences and edit profile require a session; signed-out visitors are sent to /intra?next=<current path> (fish: Redirect to /sign-in or a skipped query that renders nothing)."
    fish_ref: "app/(app)/anglers/[documentId]/index.tsx:11; app/(app)/anglers/[documentId]/connections.tsx:21; app/(app)/anglers/suggested.tsx:45; app/(app)/(tabs)/profile.tsx:15; services/queries/useNotificationsForLoggedUser.ts:11-13; services/queries/useProfile.ts:15-22"
    web_note: "Mechanism (M2-B1): lib/server/require-viewer.ts requireViewer(next) awaited inside the page's Suspense boundary, on the shell's three-state session read (getViewerState): redirect only on a definite signed-out (no cookie, or the CMS 401s); an unknown session (CMS down, slow, contract break) throws SessionUnknownError to the route's error.tsx (the screen frame + T4Gate danger «Serverul nu răspunde» + «Încearcă din nou», model app/(site)/setari/profil/error.tsx) — a signed-in user is never sent to /intra by a CMS blip (unit lib/server/require-viewer.test.ts, incl. the CMS-down case), plus proxy.ts answering a request with no session cookie with a real 307 to /intra?next=<path+query> before rendering. e2e tests/e2e/setari-profil.spec.ts «account.b.signed-out-gate» (307 without a cookie; a dead cookie also lands on /intra). Each later page adds its matcher + requireViewer and its own e2e."
  - id: account.b.guest-follow
    text: "The follow button is visible to guests wherever it appears; pressing it while signed out opens sign-in instead of following, and onPressed analytics never fire for that tap."
    fish_ref: "components/profile/FollowButton.tsx:23-56"
    status: passing
    web_note: "Guest press → router.replace(routes.signIn(current path + query)) — replace so that after sign-in the page is in history once — no POST, no onPressed. On the guest profile the follow button is the hint's only CTA. e2e tests/e2e/pescar.spec.ts «account.b.guest-follow», «c35: guest → sign in → back leaves the profile»."
  - id: account.b.sign-in-redirect
    text: "Sign-in returns to the page that asked for it only through a safe relative redirect (fish redirectTo, used by polls; web next, which also refuses /intra). Without one it returns to the previous page, else home. Incomplete profiles always go to complete profile first."
    fish_ref: "features/onboarding/useWelcomeSignIn.ts:61-69; app/(app)/polls/current.tsx:103; components/PollCard.tsx:38"
    status: passing
    web_note: "app/(site)/intra/logic.ts safeNext + SignIn.tsx finish: incomplete profile → /profil/completeaza (replace) first; else a safe next (replace); else back when the previous history entry is this site's (Navigation API canGoBack), re-rendered signed in; else home. e2e tests/e2e/intra.spec.ts «c16 …», «c17 c21 …», «unsafe next is ignored»; unit logic.test.ts."
  - id: account.b.sign-out
    text: "Sign-out unsubscribes the push token, clears recently viewed lakes, resets the live partidă store, signs out of Google/Facebook, discards the chat outbox, cancels and clears the whole query cache, signs out of Firebase, clears the session and goes to sign-in. If any step throws, the session is still cleared and a toast says „A aparut o problema. Te rugăm să încerci mai târziu.”."
    fish_ref: "contexts/auth/AuthContext.tsx:257-296"
  - id: account.b.session-expired
    text: "The first 401 from the API while signed in drops the stored token and triggers one forced sign-out with the toast „Sesiunea ta a expirat. Te rugăm să te autentifici din nou.”; further 401/403s in the same burst are swallowed until the next sign-in re-arms the guard. The JWT has no refresh (1-year expiry)."
    fish_ref: "services/api/api.ts:55-102; contexts/auth/AuthContext.tsx:144-146,285-290,298-307"
    status: passing
    web_note: "Built 2026-10-07 (M2-B3 sign-in fixes); e2e tests/e2e/intra.spec.ts «global.b.session-expired account.b.session-expired — a burst…» and «… from a public page…». The first SESSION_DEAD claims a 60 s module latch (lib/client/session-expired.ts), clears the query cache, shows the danger toast «Sesiunea ta a expirat. Te rugăm să te autentifici din nou.», signs Firebase Auth out (signOutFirebaseQuietly, fish signOut → signOutOfFirebase: the next person on the browser is never Firestore-authenticated as the dead angler), POSTs /api/auth/logout, then router.replace(/intra?next=<path+search>) + refresh; the rest of the burst is swallowed; a successful sign-in re-arms the latch (SignIn.tsx). Detail: global.b.session-expired."
  - id: account.b.complete-profile-gate
    text: "A signed-in user whose profile is incomplete (no username, username „null null”, or isProfileComplete false) is asked to complete it: right after sign-in via the complete-profile screen, and on Home via a non-dismissable sheet opened 1.1s after load while online."
    fish_ref: "features/onboarding/useWelcomeSignIn.ts:61-62; components/CompleteProfileSheet.tsx:22-33,40-47"
    status: passing
    web_note: "Both halves built. After sign-in: account.sign-in.c16 — SignIn.tsx finish sends !isProfileComplete to /profil/completeaza (router.replace, before any next; Back skips /intra), e2e tests/e2e/intra.spec.ts «c16»; the screen is account.complete-profile. On Acasă: app/(site)/_home/CompleteProfileSheet.tsx — signed in only (guest / unknown session: nothing, the profile never read), opens 1.1s after GET /user/profile says incomplete (no username, «null null», isProfileComplete false) while navigator.onLine (live), non-dismissable (ResponsiveSurface decision: sheet <768 with one 90% snap and no handle button or drag, as fish; alertdialog ≥768; no close control; Escape and the backdrop do nothing; native modal keeps focus, which starts on the title), closes on save + router.refresh() (and whenever a fresher profile is complete), never arms its timer while a stale cached profile is being refetched, and — as fish, whose present() effect depends on the profile object — opens again 1.1s after the refetch when the profile is still incomplete (a pristine «null null»: the CMS sets isProfileComplete on every PATCH, the username check is client-side); every opening remounts the form (fish's modal unmounts its content on dismiss), so a re-opened form starts from the refetched profile (an avatar saved by the first opening is not generated and uploaded again). The sheet <dialog> is overflow-clip (showModal's focus can no longer scroll it off its dock); ≥768 the dialog fits the viewport with a scrolling body and «Finalizează» pinned (ResponsiveSurface pinnedActions → Dialog scrollBody). e2e tests/e2e/profil-completeaza.spec.ts «home.acasa.c57 …»."
  - id: account.b.profile-cache
    text: "The own profile (GET /user/profile) is cached for 24h (staleTime and gcTime) and refetched after profile update, delete, organizer request and notification toggle; signed out it is disabled, not just skipped."
