        fish_ref: "components/profile/BioText.tsx:4-23; components/profile/ProfileHeader.tsx:121"
      - id: account.angler-profile.c15
        text: "Three tabs „Capturi | Sesiuni | Concursuri”, Capturi selected by default; the selected tab is underlined in the accent colour."
        fish_ref: "components/profile/AnglerProfileScreen.tsx:52-84,90"
      - id: account.angler-profile.c16
        text: "Only the selected tab's data is requested; switching tabs loads the other list lazily."
        fish_ref: "components/profile/AnglerProfileScreen.tsx:105-110"
