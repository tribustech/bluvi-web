behaviours:
  - id: account.b.signed-out-gate
    text: "Angler profile, connections, suggested anglers, notifications, settings, notification settings/preferences and edit profile require a session; signed-out visitors are sent to /intra?next=<current path> (fish: Redirect to /sign-in or a skipped query that renders nothing)."
    fish_ref: "app/(app)/anglers/[documentId]/index.tsx:11; app/(app)/anglers/[documentId]/connections.tsx:21; app/(app)/anglers/suggested.tsx:45; app/(app)/(tabs)/profile.tsx:15; services/queries/useNotificationsForLoggedUser.ts:11-13; services/queries/useProfile.ts:15-22"
  - id: account.b.guest-follow
    text: "The follow button is visible to guests wherever it appears; pressing it while signed out opens sign-in instead of following, and onPressed analytics never fire for that tap."
    fish_ref: "components/profile/FollowButton.tsx:23-56"
  - id: account.b.sign-in-redirect
    text: "Sign-in returns to the page that asked for it only through a safe relative redirect (fish redirectTo, used by polls; web next, which also refuses /intra). Without one it returns to the previous page, else home. Incomplete profiles always go to complete profile first."
    fish_ref: "features/onboarding/useWelcomeSignIn.ts:61-69; app/(app)/polls/current.tsx:103; components/PollCard.tsx:38"
  - id: account.b.sign-out
    text: "Sign-out unsubscribes the push token, clears recently viewed lakes, resets the live partidă store, signs out of Google/Facebook, discards the chat outbox, cancels and clears the whole query cache, signs out of Firebase, clears the session and goes to sign-in. If any step throws, the session is still cleared and a toast says „A aparut o problema. Te rugăm să încerci mai târziu.”."
    fish_ref: "contexts/auth/AuthContext.tsx:257-296"
  - id: account.b.session-expired
    text: "The first 401 from the API while signed in drops the stored token and triggers one forced sign-out with the toast „Sesiunea ta a expirat. Te rugăm să te autentifici din nou.”; further 401/403s in the same burst are swallowed until the next sign-in re-arms the guard. The JWT has no refresh (1-year expiry)."
    fish_ref: "services/api/api.ts:55-102; contexts/auth/AuthContext.tsx:144-146,285-290,298-307"
  - id: account.b.complete-profile-gate
    text: "A signed-in user whose profile is incomplete (no username, username „null null”, or isProfileComplete false) is asked to complete it: right after sign-in via the complete-profile screen, and on Home via a non-dismissable sheet opened 1.1s after load while online."
    fish_ref: "features/onboarding/useWelcomeSignIn.ts:61-62; components/CompleteProfileSheet.tsx:22-33,40-47"
  - id: account.b.profile-cache
    text: "The own profile (GET /user/profile) is cached for 24h (staleTime and gcTime) and refetched after profile update, delete, organizer request and notification toggle; signed out it is disabled, not just skipped."
    fish_ref: "services/queries/useProfile.ts:8-27; services/mutations/useUpdateProfile.ts:12-13; services/mutations/useRequestOrganizerRole.ts:17-19; services/mutations/useToggleNotifications.ts:32-34; services/mutations/useDeleteProfile.ts:14-16"
  - id: account.b.unread-badge
    text: "The notifications entry (fish: bell on Home; web: top bar) shows an unread dot when GET /notification-users/unread returns count > 0 (signed in only; staleTime Infinity); it is recounted whenever a notification query is invalidated (mark read, mark all read, incoming push)."
    fish_ref: "app/(app)/(tabs)/index.tsx:180-184,392-404; services/queries/notifications.ts:6-15; services/api/notifications.ts:21-30"
  - id: account.b.notification-route-map
    text: "Notification → route: registration/pending/modified/start → competition; END, ROUND_END, FOLLOW_COMPETITION_END/PODIUM → competition ranking tab; NEW_REGISTRATION_ORGANIZER → participants tab filtered pending; ALLOCATION, ROUND_START, CANCELLATION/MODIFIED_ORGANIZER, FOLLOW_COMPETITION_REGISTERED/DIGEST → participants tab; WEIGHING_MODIFIED/END (needs sector, stand, standId, weighingId) → competition with that weighing open; EXTRA_WEIGHT_REQUEST → extra-scales tab; CHAT_MESSAGE → competition chat (tab from tab/chatRoom, default general; name passed); PENALTY → penalties; POLL_* → current poll; NEWS → news item; NEW_LAKES → lakes; NEW_FOLLOWER → /pescari/{followerDocumentId}; PARTIDA_INVITE → join with code; PARTIDA_FINISHED/AUTO_CLOSE_WARN → own partidă; PARTIDA_CATCH, PARTIDA_FINISHED_FOLLOWED, FOLLOW_PARTIDA_START/FIRST_CATCH → community partidă; FOLLOW_RECORD_PERSONAL/LAKE → community catches; FOLLOW_LAKE_REVIEW → lake reviews; COMPETITION_AUTO_CANCELLED_ORGANIZER → organizer panel; booking angler types → booking detail; operator booking types → operator bookings with status pending/rejected/cancelled; NEW_COMPETITIONS → competition or competitions list; COMPETITIONS_DIGEST → competitions list; SCHEDULED_NOTIFICATION, COMPETITION_CANCELLED_USER and unknown → no route. Missing required ids → no route. Ported as core social.domain.getRedirectLocationForNotification."
    fish_ref: "helpers/getRedirectLocationForNotification.ts:30-193"
  - id: account.b.push-tap
    text: "A push tap (mobile only; web has in-app notifications) dedupes double delivery, routes like the list, opens the weighing in place when already on that competition, switches chat tab in place when already in that chat, invalidates news/competition caches by type and marks the notification read (except chat). Web keeps only the in-app equivalents: list tap routing and mark-as-read."
    fish_ref: "contexts/NotificationsContextProvider.tsx:147-244"
  - id: account.b.foreground-refresh
    text: "When the app returns to the foreground every query is invalidated; an incoming push invalidates notification queries (and competitions/rankings or news by type). Web equivalent: refetch on window focus, and refetch the unread count on focus."
    fish_ref: "app/_layout.tsx:58-64; contexts/NotificationsContextProvider.tsx:254-268"
  - id: account.b.suggested-rail
    text: "Home shows the rail „Pescari pe care îi poți urmări” only to signed-in users, built from page 1 of suggested-home minus dismissed cards, hidden while loading, on error, or with fewer than 3 visible cards (no skeleton); „Vezi toate” opens /pescari/sugerati. Inventoried as part of home.acasa."
    fish_ref: "features/anglers/components/SuggestedAnglersRail.tsx:13-53; app/(app)/(tabs)/index.tsx:504; components/SeeAllTitle.tsx:30"
  - id: account.b.suggestion-dismissals
    text: "Dismissed suggestions are held in memory for the app session only (not persisted), shared by the Home rail and /pescari/sugerati."
    fish_ref: "features/anglers/state/dismissedSuggestionsAtom.ts:3-15"
  - id: account.b.follow-celebrate
    text: "Following a competition opens the same preferences panel in celebrate mode („Te-ai abonat 🎉”, competition name, „Alege ce notificări vrei să primești.”) with preferences prefetched; inventoried with the competition screen, it reuses account.notification-preferences c6–c16."
    fish_ref: "features/notifications/components/FollowNotificationsSheet.tsx:43-45,106-126; services/queries/useCompetitionNotificationPreferences.ts:16-29"
  - id: account.b.profile-entry
    text: "The top bar's avatar opens /profil when signed in (avatar thumb, Bluvi logo fallback); signed out it offers „Intră” (fish: profile tab hidden, Home card „Conectează-te” → sign-in)."
    fish_ref: "app/(app)/(tabs)/_layout.tsx:96-126; app/(app)/(tabs)/index.tsx:270-276,343-345,420-445"
  - id: account.b.deep-link-angler
    text: "/anglers/{documentId} links (NEW_FOLLOWER) must resolve on web to /pescari/{documentId}; an unknown documentId must render a not-found state, not a blank page."
    fish_ref: "helpers/getRedirectLocationForNotification.ts:101-103"
