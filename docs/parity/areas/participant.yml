  # ---------------------------------------------------------------------------------------------
  - id: participant.team-disclaimer
    title: Câteva lucruri de menționat (concurs pe echipe)
    fish:
      - "app/(app)/register/team-competition-disclaimer.tsx"
      - "components/NormalUserSheetItems.tsx"
    web_route: /concursuri/[id]/inscriere/echipa
    template: T4
    milestone: M5
    roles: [angler, organizer]
    core: [competitions.competitionQuery, competitions.registrationAction]
    states:
      - default
      - loading (session gate / competition read — the page's skeleton, the copy is never flashed)
      - signed-out (proxy 307 to /intra?next= this page)
      - dead session cookie (the sign-in gate in the page's frame, back to this page)
      - session unknown (CMS did not answer /users/me — «Serverul nu răspunde» + retry)
      - competition read error (retry) / unknown competition (404)
      - redirected (single competition, or the viewer already has a pending / approved entry)
      - closed (rejected, deadline passed, limit reached, started / draft / completed / cancelled — the reason + «Înapoi la concurs», no copy)
    criteria:
      - id: participant.team-disclaimer.c1
        text: "The page has a back control, the fisherman illustration and the title „Câteva lucruri de menționat”."
        fish_ref: "app/(app)/register/team-competition-disclaimer.tsx:28-46"
        status: passing
        web_note: "The title is the T4 header's h1 with the competition's name as its eyebrow. From 768 the body is on the header's axis (cards on the back control's edge), from 1280 under the title text with a «Despre concurs» fact card (lake, dates, team size — only what is known) on the right and «Am înțeles» docked under it (T4Frame aside; e2e checks the axis and the docking at 768/1024/1280/1440/1920). Back (components/nav/useBack): back when the page before is the site's, else the competition page (e2e). FishermanArt is a static SVG stand-in for fish's Lottie."
      - id: participant.team-disclaimer.c2
        text: "Intro: „Acesta este un concurs pe echipe, astfel vă rugăm să luați în considerare următoarele:” with „echipe” highlighted."
        fish_ref: "app/(app)/register/team-competition-disclaimer.tsx:49-55"
        status: passing
        web_note: "Highlighted by accent ink AND semibold (never colour alone); e2e checks weight and colour."
      - id: participant.team-disclaimer.c3
        text: "Card „Înscrierea în concurs”: „Doar o singură persoană din echipă trebuie să facă înregistrarea în concurs și să adauge toți coechipierii. Aceștia vor fi înregistrați și notificați automat.” with „o singură persoană din echipă” emphasised."
        fish_ref: "app/(app)/register/team-competition-disclaimer.tsx:59-71"
        status: passing
        web_note: "fish DisclaimerItem's look: 2px accent outline + accent-filled icon disc (theme tokens, dark mode follows); e2e checks the 2px border and that the disc has the border's colour. Same for c4."
      - id: participant.team-disclaimer.c4
        text: "Card „Modificări”: „Datele înscrierii pot fi modificate doar până când organizatorul competiției acceptă înscrierea. După ce înscrierea a fost aprobată, nicio modificare nu mai este permisă.” with the last sentence emphasised."
        fish_ref: "app/(app)/register/team-competition-disclaimer.tsx:72-84"
        status: passing
        web_note: "Copy kept from fish although it contradicts the behaviour — see participant.b.disclaimer-copy-mismatch."
      - id: participant.team-disclaimer.c5
        text: "„Am înțeles” opens the registration page of the same competition (one navigation even on double click)."
        fish_ref: "app/(app)/register/team-competition-disclaimer.tsx:17-19,87-89"
        status: passing
        web_note: "A link to routes.competitionRegister(id); the shell's NavigationGuard drops the second activation (e2e: double click, then Back returns to the disclaimer). Below 1280: in the bar on the bottom edge; from 1280 docked under the fact card in the right column. Keyboard: Tab + Enter (e2e)."
      - id: participant.team-disclaimer.c6
        text: "It is shown only on the way to a NEW registration in a team competition; single competitions and users already pending/registered go straight to the registration page."
        fish_ref: "components/NormalUserSheetItems.tsx:24-35,38-61,74-95"
        status: passing
        web_note: "Also guards a typed / old link / Back after the button turned disabled (_components/access.ts, unit access.test.ts): registrationAction(...).disabled — or a draft / completed / cancelled competition — → a T4Gate «Înscrierea nu este disponibilă» («…nu mai poate fi modificată» for an entry being edited) with fish's reason and «Înapoi la concurs», never the copy or «Am înțeles»; otherwise target !== 'teamDisclaimer' → router.replace to /inscriere. The skeleton stands until the competition and /my-status are read, so nothing flashes (e2e: single, pending, approved → form; rejected, deadline passed, limit reached, cancelled → the reason, the copy never rendered, URL unchanged — mocked competition / my-status). The registration form itself (/inscriere, participant.register) must apply the same rule for a direct link."
    mobile_only: false
    status: passing

  # ---------------------------------------------------------------------------------------------
  - id: participant.register-guests
    title: Adaugă participanți fără cont
    fish:
      - "app/(app)/register/register-guests.tsx"
      - "app/(app)/register/team-competition-disclaimer.tsx"
      - "services/mutations/useRegistrationGuest.ts"
      - "services/mutations/useUpdateRegistrationGuest.ts"
      - "services/api/registrations.ts"
      - "components/CollapsableActions.tsx"
      - "components/competition/CompetitionRanking.tsx"
    web_route: "/concursuri/[id]/inscriere/fara-cont?inscriere=[registrationId]&doarEchipa=1"
    template: T4
    milestone: M5
    roles: [organizer]
    core:
      - competitions.competitionQuery
      - competitions.registrationGuestMutation
      - competitions.updateRegistrationGuestMutation
    states:
      - loading
      - error (retry)
      - add, single competition
      - add, team competition
      - edit guest names (+ team name for teams)
      - edit team name only (membersOnly)
      - validation errors
      - submit pending / success / error
      - dirty form on leave
