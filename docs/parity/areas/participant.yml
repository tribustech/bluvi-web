        fish_ref: "app/(app)/register/register-guests.tsx:142-148"
      - id: participant.register-guests.c2
        text: "Title „Adaugă participanți fără cont” (edit mode, i.e. with registrationId: „Editează participanți”); submit button „Finalizează” (edit: „Salvează”) with a loading state while saving."
        fish_ref: "app/(app)/register/register-guests.tsx:150-160"
      - id: participant.register-guests.c3
        text: "Add mode only: a notice „⚠️ Observații importante” with 1. „{Echipa adăugată|Pescarul adăugat} aici va fi înregistrat{ă} automat cu statusul „Aprobat” în lista de participanți.” and 2. „Dacă {un membru al echipei|pescarul} dorește să participe folosind contul personal Bluvi®, poți folosi butonul „Elimină” din pagina de participanți pentru a elimina {echipa|participantul} adăugat{ă} manual înainte să înceapă concursul.”"
        fish_ref: "app/(app)/register/register-guests.tsx:162-188"
      - id: participant.register-guests.c4
        text: "Single competition: one field „Pescar” (placeholder „Introdu numele pescarului”, helper „Poți scrie numele pescarului așa cum vrei să apară în clasament”)."
        fish_ref: "app/(app)/register/register-guests.tsx:257-283"
      - id: participant.register-guests.c5
        text: "Team competition: one field per member labelled „Participant {n}”; a remove control appears only while there is more than one field; „Adaugă participant” is shown while fields < teamParticipants; caption „Maxim {N} participanți/echipă” when teamParticipants is set."
        fish_ref: "app/(app)/register/register-guests.tsx:190-256"
      - id: participant.register-guests.c6
        text: "Each name is required („Acest câmp este obligatoriu”) and may contain only letters (Romanian diacritics included), digits, spaces and hyphens („Numele poate conține doar litere, cifre și cratime”); typing strips leading spaces and collapses repeated spaces."
        fish_ref: "app/(app)/register/register-guests.tsx:20-21,195-217,268-279"
      - id: participant.register-guests.c7
        text: "Team only: optional „Numele echipei” (helper „Numele echipei este opțional”), max 30 („Numele echipei poate conține maximum 30 de caractere.”), same character rule („Numele echipei poate conține doar litere, cifre și cratime”)."
        fish_ref: "app/(app)/register/register-guests.tsx:285-314"
      - id: participant.register-guests.c8
        text: "Edit mode prefills the members by splitting guestName on „, ” and the team name from the teamName parameter."
        fish_ref: "app/(app)/register/register-guests.tsx:60-77"
      - id: participant.register-guests.c9
        text: "With membersOnly=true the name fields are hidden and only the team name is saved (guestName is not sent)."
        fish_ref: "app/(app)/register/register-guests.tsx:47,100,109,190"
      - id: participant.register-guests.c10
        text: "On submit names are trimmed, empty ones dropped and joined with „, ”; with no name left (not membersOnly) a toast says „Trebuie să adaugi cel puțin un participant” and nothing is sent."
        fish_ref: "app/(app)/register/register-guests.tsx:94-103"
      - id: participant.register-guests.c11
        text: "Add sends POST /registrations/guests {data:{competitionId, guestName, teamName}}; success toast „Înregistrarea a fost adăugată cu succes!” and back to the previous page; error toast with the message."
        fish_ref: "app/(app)/register/register-guests.tsx:122-139; services/api/registrations.ts:59-73"
      - id: participant.register-guests.c12
        text: "Edit sends PUT /registrations/guests/{registrationId} {data:{guestName?, teamName}}; success toast „Înregistrarea a fost actualizată cu succes!” and back; error toast with the message."
        fish_ref: "app/(app)/register/register-guests.tsx:105-121; services/api/registrations.ts:75-92"
      - id: participant.register-guests.c13
        text: "Add and edit both invalidate competitions.all and competitions.my."
        fish_ref: "services/mutations/useRegistrationGuest.ts:10-13; services/mutations/useUpdateRegistrationGuest.ts:10-13"
      - id: participant.register-guests.c14
        text: "Leaving with unsaved changes asks „Ești sigur că vrei să renunți la modificările făcute?” / „Toate schimbările făcute vor fi pierdute.” („Închide” / „Renunță”)."
        fish_ref: "app/(app)/register/register-guests.tsx:88-92,153"
      - id: participant.register-guests.c15
        text: "Reached by the organizer only: from the organizer menu „Adaugă participanți fără cont” (hidden once the participants limit is reached), or from „Editează” on a guest registration in the participants list (passes registrationId, guestName and, for teams, teamName)."
        fish_ref: "components/competition/CompetitionRanking.tsx:593-603; components/CollapsableActions.tsx:38-64"
    mobile_only: false
    status: todo

