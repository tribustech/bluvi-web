    criteria:
      - id: participant.team-disclaimer.c1
        text: "The page has a back control, the fisherman illustration and the title „Câteva lucruri de menționat”."
        fish_ref: "app/(app)/register/team-competition-disclaimer.tsx:28-46"
      - id: participant.team-disclaimer.c2
        text: "Intro: „Acesta este un concurs pe echipe, astfel vă rugăm să luați în considerare următoarele:” with „echipe” highlighted."
        fish_ref: "app/(app)/register/team-competition-disclaimer.tsx:49-55"
      - id: participant.team-disclaimer.c3
        text: "Card „Înscrierea în concurs”: „Doar o singură persoană din echipă trebuie să facă înregistrarea în concurs și să adauge toți coechipierii. Aceștia vor fi înregistrați și notificați automat.” with „o singură persoană din echipă” emphasised."
        fish_ref: "app/(app)/register/team-competition-disclaimer.tsx:59-71"
