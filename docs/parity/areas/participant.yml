    web_route: "/concursuri/[id]/chat?tab=general|participanti"
    template: none
    milestone: M5
    roles: [angler, organizer, referee]
    core:
      - realtime.firebase (createChatAuth, ensureSignedIn, withAuthRetry, refreshFirebaseAuth)
      - realtime.chat.room (subscribeChatRoom, loadMoreMessages, loadUntilMessage, readCachedLatestMessages, CHAT_PAGE_SIZE)
      - realtime.chat.messages (sendChatMessage, editChatMessage, deleteChatMessage, canDeleteChatMessage, buildOutboxEntry)
      - realtime.chat.receipts (subscribeReceipts, createReadMarker, subscribeReactions, toggleReaction)
      - realtime.chat.status (subscribeChatMeta, needsRulesAcknowledgement, acknowledgeRules)
      - realtime.chat.typing (createTypingWriter, subscribeTypingNames, typingLabel)
      - realtime.chat.unread (subscribeRoomUnreadCount, formatUnread, subscribeCompetitionChatBadge)
      - realtime.chat.listItems (buildChatListItems, collapseSystemRuns, latestLeaderMessageId, systemGroupBreakdown)
      - realtime.chat.systemMessages
      - realtime.chat.domain (chatMembershipOf, resolveChatClosing, shouldShowConversationStart, splitHiddenNewest, summarizeReactions, buildRoomGallery)
      - realtime.chat.format / linkify / transforms / paths
      - realtime.chat.outbox (createOutboxWorker, afterFailure, RETRY_DELAYS_MS)
      - competitions.competitionQuery
      - competitions.userStatuteForCompetitionQuery
      - competitions.followCompetitionMutation
      - competitions.competitionNotificationPreferencesQuery + updateCompetitionNotificationPreferencesMutation
      - competitions.competitionFollowersQuery
      - organizer.allocatedParticipantsQuery + weighingByIdQuery
    states:
      - "signed-out (fish shows „Nu am putut autentifica chat-ul…” over an empty room; web: sign-in gate)"
      - header loading (no name handed over yet)
      - room loading (bubble skeleton)
      - rules not yet acknowledged (blocking dialog)
      - follower / spectator (General only, no switcher)
      - member (Participanți + General)
      - not following (follow prompt)
      - empty room (with / without greeting)
      - history loading older pages / whole history loaded (conversation start)
      - unread history (Mesaje noi divider)
      - new messages while scrolled up (pill with count)
      - someone typing
      - composing / replying / editing / attachments (up to 10, full)
      - pending message / failed message (retry or delete)
      - deleted message (by sender / by organizer)
      - message actions menu open
      - media viewer open
      - reactions list open
      - mute confirm open
      - weighing detail open
      - chat closed (read-only notice)
      - offline (sends queued)
