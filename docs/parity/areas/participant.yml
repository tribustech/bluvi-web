# Parity inventory — area "participant" (Înscriere, Despre concursurile pe echipe, Participanți fără cont,
# Chat concurs + decupare poză, Sondaj curent, Sondaje anterioare, Tombolă: intro, încărcare bon,
# confirmare, bon încărcat, șansele mele, câștigători).
# Extracted from fish (read-only) on 2026-10-04. Line refs are fish file:line at that date.
# Web sign-in is /intra?next=<path> (fish: /sign-in + redirectTo). The poll and raffle cards on Acasă are
# inventoried in home.yml; the registration entry button on the competition page belongs to the competition
# screen and appears here only as behaviours.
# Web route conventions used here: /concursuri/[id]/inscriere[/echipa|/fara-cont], /concursuri/[id]/chat[/foto],
# /sondaje[/anterioare] (home.yml already uses /sondaje), /tombola[/...].
area: participant
screens:
  # ---------------------------------------------------------------------------------------------
  - id: participant.register
    title: Înscriere
    fish:
      - "app/(app)/register/[competitionId].tsx"
      - "components/RegistrationStatusModalSheet.tsx"
      - "components/EmptyTeamMembersSheet.tsx"
      - "components/competition/CompetitionParticipantsSelect.tsx"
      - "services/mutations/useCreateCompetitionRegistration.ts"
      - "services/mutations/useUpdateCompetitionRegistration.ts"
      - "services/mutations/useLeaveCompetition.ts"
      - "services/api/registrations.ts"
      - "services/queries/useUsers.ts"
      - "services/api/users.ts"
      - "services/queries/useCompetition.ts"
      - "services/queries/useProfile.ts"
    web_route: "/concursuri/[id]/inscriere?organizator=1&inscriere=[registrationId]"
    template: T4
    milestone: M5
    roles: [guest, angler, organizer]
    core:
      - competitions.competitionQuery
      - competitions.competitionMyStatusQuery
      - social.profileQuery
      - social.paginatedUsersInfiniteQuery
      - competitions.createCompetitionRegistrationMutation
      - competitions.updateCompetitionRegistrationMutation (CDN_PURGE_SETTLE_MS)
      - competitions.leaveCompetitionMutation
      - competitions.competitionKeys
    states:
      - loading (profile or competition)
      - signed-out (sign-in gate)
      - new registration, single competition
      - new registration, team competition
      - existing pending registration (editable, can leave)
      - existing approved registration, team, competition notStarted (editable, cannot leave)
      - existing registration after start (locked, contact organizer)
      - organizer mode (edits another team's registration, never locked by status)
      - phone already on profile (read-only) / phone missing (required)
      - team with zero teammates (confirm dialog)
      - team at max size (add teammates disabled)
      - teammate search loading / error / no results / next page loading
      - submit pending / success (auto-close, back to competition) / error
      - leave confirm / pending / success / error
      - dirty form on leave (discard confirm)
    criteria:
      - id: participant.register.c1
        text: "While the profile or the competition is loading, a full-page loading state is shown instead of the form."
        fish_ref: "app/(app)/register/[competitionId].tsx:288-298"
      - id: participant.register.c2
        text: "Signed out, the page titled „Înscriere” shows the fisherman illustration, the heading „Înscrie-te la competiție”, the text „Autentifică-te pentru a putea participa la competiție. După ce te conectezi, revino aici pentru a-ți finaliza înscrierea.” and a „Intră în cont” button that opens sign-in (web: /intra?next=<this page>)."
        fish_ref: "app/(app)/register/[competitionId].tsx:300-334"
      - id: participant.register.c3
        text: "The registration being edited is, in normal mode, the competition registration with status registered or pending whose participants include the viewer's documentId; in organizer mode (asOrganizer=1) it is the registration whose documentId is registrationId. No match = new registration."
        fish_ref: "app/(app)/register/[competitionId].tsx:52-66"
      - id: participant.register.c4
        text: "A read-only field „Nume utilizator*” shows the viewer's username (organizer mode: the registration author's username)."
        fish_ref: "app/(app)/register/[competitionId].tsx:385-392"
      - id: participant.register.c5
        text: "The phone field „Număr de telefon*” (placeholder „Introdu numărul de telefon”, numeric keyboard) appears only for a new registration; it is prefilled from profile.phone and read-only when the profile already has one; it is required („Acest câmp este obligatoriu”) and must be 7–15 characters („Numărul de telefon trebuie să conțină minim 7 și maximum 15 caractere”)."
        fish_ref: "app/(app)/register/[competitionId].tsx:394-419"
      - id: participant.register.c6
        text: "Team competitions only: an optional „Numele echipei” field (placeholder „Introdu numele echipei”, helper „Numele echipei este opțional și poate fi adăugat ulterior”) limited to 30 characters („Numele echipei poate conține maximum 30 de caractere.”)."
        fish_ref: "app/(app)/register/[competitionId].tsx:421-444"
      - id: participant.register.c7
        text: "Team competitions only: a „Coechipieri” section; when teamParticipants is set, the caption „Această competiție permite înscrierea unui număr maxim de {N} participanți/echipă. Vă rugăm să adăugați un număr maxim de {N-1} coechipieri.” is shown."
        fish_ref: "app/(app)/register/[competitionId].tsx:446-454"
      - id: participant.register.c8
        text: "The „Adaugă coechipieri” control is disabled once teammates + 1 (the viewer) reaches teamParticipants."
        fish_ref: "app/(app)/register/[competitionId].tsx:455-473"
      - id: participant.register.c9
        text: "The teammate picker has a search field „Introdu numele” and lists users from GET /user/all?page&pageSize=20&search (infinite, next page at the end of the list with a „Se încarcă...” footer); each row shows the thumb avatar (fallback disc), the username and „#{username}{id}”; users already added are disabled and dimmed; states „Se încarcă...”, „Eroare la încărcarea datelor”, „Nu s-au găsit rezultate”; closing the picker clears the search. The viewer is not filtered out of the results."
        fish_ref: "components/competition/CompetitionParticipantsSelect.tsx:40-212; services/queries/useUsers.ts:5-20; services/api/users.ts:5-20"
      - id: participant.register.c10
        text: "Choosing a user appends them to the team; each chosen teammate is listed with their username and a remove (X) control that drops them from the form."
        fish_ref: "components/competition/CompetitionParticipantsSelect.tsx:93-95; app/(app)/register/[competitionId].tsx:474-497"
      - id: participant.register.c11
        text: "The form is seeded with the registration's participants minus the viewer (organizer mode: minus the author), its team name and the profile phone, and re-seeded whenever that server data changes unless the user has already edited the form."
        fish_ref: "app/(app)/register/[competitionId].tsx:96-151"
      - id: participant.register.c12
        text: "Footer: no registration → „Finalizează”; registration in normal mode with competitionStatus other than notStarted → only the text „Nu poți face modificări. Contactează organizatorul.”; otherwise „Salvează modificările” (disabled until the form changes) plus, in normal mode with status pending, a red „Părăsește concursul”."
        fish_ref: "app/(app)/register/[competitionId].tsx:341-383"
      - id: participant.register.c13
        text: "For a team competition with zero teammates, „Finalizează” and „Salvează modificările” first open a non-dismissable confirmation „Nu ați adăugat niciun coechipier. Sunteți sigur că doriți să înregistrați echipa fără coechipieri?” with „Sunt sigur” (continues the submit) and „Închide” (cancels)."
        fish_ref: "app/(app)/register/[competitionId].tsx:155-164; components/EmptyTeamMembersSheet.tsx:22-70"
      - id: participant.register.c14
        text: "Create sends POST /registrations {data:{competition, teamName, registrationStatus, participants:[...teammate documentIds, viewer documentId], phone}} where phone is null when the profile already has one."
        fish_ref: "app/(app)/register/[competitionId].tsx:166-180; services/api/registrations.ts:4-11"
      - id: participant.register.c15
        text: "After create, the competition (byId), competitions.all, competitions.my, competitionCards root and profile.my are invalidated; analytics event competition_registration_created {competition_id, participants}."
        fish_ref: "app/(app)/register/[competitionId].tsx:182-205; services/mutations/useCreateCompetitionRegistration.ts:16-24"
      - id: participant.register.c16
        text: "Submitting opens a status dialog: pending „Înscriere în curs...”; success „Felicitări!” / „Solicitarea ta a fost înregistrată cu succes.” / „Vei fi contactat în cel mai scurt timp pentru confirmarea locului.”, closing itself after 3 s and returning to the competition page; error shows the server message (fallback „A apărut o problemă în cadrul solicitării, te rugăm să încerci mai târziu.”) and „Închide”. It cannot be dismissed while pending."
        fish_ref: "components/RegistrationStatusModalSheet.tsx:63-160"
      - id: participant.register.c17
        text: "Update sends PUT /registrations/{registrationId} {data:{competition, participants:[...teammates, anchor], teamName}} where anchor is the viewer, or the registration author in organizer mode; a missing registration fails with „Nu s-a găsit înscrierea!”."
        fish_ref: "app/(app)/register/[competitionId].tsx:209-230; services/api/registrations.ts:13-26"
      - id: participant.register.c18
        text: "After a successful update the saved values become the form baseline; the competition (byId) is marked stale at once and refetched 2000 ms later (after the edge purge); competitions.my is invalidated; the dialog shows „Modificare în curs...” then „Felicitări!” / „Înregistrarea ta a fost modificată cu succes.”; analytics competition_registration_updated."
        fish_ref: "app/(app)/register/[competitionId].tsx:232-245; services/mutations/useUpdateCompetitionRegistration.ts:13-39; components/RegistrationStatusModalSheet.tsx:162-191"
      - id: participant.register.c19
        text: "„Părăsește concursul” asks „Ești sigur că dorești să părăsești concursul?” („Închide” / destructive „Părăsește concursul”), then sends PATCH /registrations/{id}/leave; the dialog shows „Modificare în curs...” then „Ai părăsit competiția.”; an error shows the message as a toast; competition byId, competitions.all, my and competitionCards are invalidated."
        fish_ref: "app/(app)/register/[competitionId].tsx:253-286; services/mutations/useLeaveCompetition.ts:6-19; components/RegistrationStatusModalSheet.tsx:193-221"
      - id: participant.register.c20
        text: "Leaving with unsaved changes asks „Ești sigur că vrei să renunți la modificările făcute?” / „Toate schimbările făcute vor fi pierdute.” with „Închide” and destructive „Renunță” (web: also on browser back/unload)."
        fish_ref: "app/(app)/register/[competitionId].tsx:270-277,340"
      - id: participant.register.c21
        text: "In organizer mode the save button stays available whatever the competition status and the leave button is never shown."
        fish_ref: "app/(app)/register/[competitionId].tsx:345,363"
      - id: participant.register.c22
        text: "Leaving the page drops the cached user-search pages (users.paginated)."
        fish_ref: "app/(app)/register/[competitionId].tsx:290-294"
    mobile_only: false
    status: todo

