      - id: participant.register.c12
        text: "Footer: no registration → „Finalizează”; registration in normal mode with competitionStatus other than notStarted → only the text „Nu poți face modificări. Contactează organizatorul.”; otherwise „Salvează modificările” (disabled until the form changes) plus, in normal mode with status pending, a red „Părăsește concursul”."
        fish_ref: "app/(app)/register/[competitionId].tsx:341-383"
        status: passing
        web_note: "model.ts footerState (unit). Phone: the T4 action bar pinned to the viewport bottom; from 1024 the same actions inside the sticky summary card. Web addition: under «Nu poți face modificări…» the team name is read-only and the teammate controls are hidden (fish leaves them editable with nothing to save them). e2e tests/e2e/concurs-inscriere.spec.ts «c12 — approved …», «pending team …». Locked: also no team-name helper, no limit caption, no «Adaugă coechipieri»; the team as plain read-only rows (e2e)."
      - id: participant.register.c13
        text: "For a team competition with zero teammates, „Finalizează” and „Salvează modificările” first open a non-dismissable confirmation „Nu ați adăugat niciun coechipier. Sunteți sigur că doriți să înregistrați echipa fără coechipieri?” with „Sunt sigur” (continues the submit) and „Închide” (cancels)."
        fish_ref: "app/(app)/register/[competitionId].tsx:155-164; components/EmptyTeamMembersSheet.tsx:22-70"
