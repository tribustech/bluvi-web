behaviours:
  - id: participant.b.register-entry
    text: "Competition page „Înscrie-te”: users already pending/registered and single competitions go to the registration page; a new team registration goes through the team disclaimer first. Signed-out users see the sign-in gate (web: /intra?next=…)."
    fish_ref: "components/NormalUserSheetItems.tsx:38-61; components/competition/CompetitionRanking.tsx:481-494"
  - id: participant.b.register-entry-disabled
    text: "The registration button is disabled when the user was rejected, is a non-author teammate of a pending team, is approved (unless team competition still notStarted), or — for new/pending — when the competition has started or the registration deadline has passed, or the participants limit (registered count = participantsLimit) is reached."
    fish_ref: "components/competition/CompetitionRanking.tsx:453-480; components/NormalUserSheetItems.tsx:30-36"
  - id: participant.b.disclaimer-copy-mismatch
    text: "Flag to owner: the team disclaimer says no change is allowed after approval, but an approved team registration stays editable while the competition is notStarted (fish behaviour wins until decided)."
    fish_ref: "app/(app)/register/team-competition-disclaimer.tsx:72-83; components/competition/CompetitionRanking.tsx:476"
  - id: participant.b.organizer-edit-registration
    text: "Organizer „Editează” on a participant row (hidden for rejected rows and cancelled/completed competitions): guest registrations open the guests form with registrationId/guestName/teamName; account registrations open the registration page in organizer mode (asOrganizer=1, registrationId)."
    fish_ref: "components/CollapsableActions.tsx:38-80,160-167"
  - id: participant.b.chat-entry
    text: "The chat entry on the competition page exists only for signed-in users; it opens the last room used in that competition (if any) and passes the competition name so the header is titled immediately."
    fish_ref: "components/competition/CompetitionRanking.tsx:352-365,1234,1961; features/chat/domain/lastTab.ts:7-10"
  - id: participant.b.chat-badge
    text: "Chat entry badge: total unread across readable rooms (General; Participanți for members), „99+” cap, alert tone; „Nou” (info tone) when the account never opened this chat (no receipt in any readable room) and it has messages; nothing when 0; unreadable receipt never claims „Nou”."
    fish_ref: "features/chat/hooks/useCompetitionChatBadge.ts:10-79"
  - id: participant.b.chat-notification-route
    text: "CHAT_MESSAGE notification → /competitions/{competitionId}/chat?tab={tab|chatRoom|general}&name={competitionName} (web: /concursuri/{id}/chat?tab=…); no competitionId → no route; opening it does not mark the notification read differently from the list rules in account.yml."
    fish_ref: "helpers/getRedirectLocationForNotification.ts:82-88"
  - id: participant.b.chat-open-room-push
    text: "Mobile only: while a room is open its own foreground pushes are suppressed and already-presented ones cleared. Web equivalent: do not raise an in-app toast for messages of the room on screen."
    fish_ref: "features/chat/activeChatRoom.ts:10-40; features/chat/domain/notificationRoom.ts:3-21"
  - id: participant.b.chat-signed-out
    text: "fish has no auth gate on the chat route (a signed-out deep link shows the auth error toast over an empty room); web shows the sign-in gate and returns to the chat after sign-in."
    fish_ref: "features/chat/hooks/useChatRoom.ts:188-196; app/(app)/_layout.tsx:44-47"
  - id: participant.b.chat-realtime
    text: "Chat is Firestore realtime (messages, reactions, receipts, typing, meta), signed in with the CMS-minted Firebase custom token; one shared Firebase project across envs with env-prefixed paths; never write to Partide collections."
    fish_ref: "features/chat/domain/chatPaths.ts:1-85; features/chat/hooks/useChatAuth.ts:12-28"
  - id: participant.b.chat-outbox
    text: "Sends survive reloads: queued rows are kept locally (fish SQLite; web: IndexedDB/localStorage via core outbox storage) and drained at app start and when the network returns; a row already written is never re-dated."
    fish_ref: "features/chat/outbox/worker.ts:169-229; features/chat/outbox/ChatOutboxMount.tsx:1-32"
  - id: participant.b.poll-notification-route
    text: "POLL_OPENED, POLL_CLOSED and POLL_SUGGESTION_APPROVED notifications open the current poll (web /sondaje)."
    fish_ref: "helpers/getRedirectLocationForNotification.ts:92-95"
  - id: participant.b.poll-deeplink
    text: "Universal links cover /polls/*; the shared poll URL is {WEB_DOMAIN}/polls/current, so the web must answer /polls/current (and /polls/past) with a redirect to /sondaje (/sondaje/anterioare)."
    fish_ref: "helpers/sharePoll.ts:4-6; features/partide/helpers/deepLinks.ts:15"
  - id: participant.b.poll-signin-redirect
    text: "Voting or suggesting signed out goes to sign-in with redirectTo=/polls/current (web next=/sondaje) and comes back to the poll."
    fish_ref: "app/(app)/polls/current.tsx:102-104,163-165; components/PollCard.tsx:38"
  - id: participant.b.raffle-entry
    text: "Acasă raffle card: ended → winners page if it has winners, else nothing; signed out → sign-in; joined → confirmation; otherwise → raffle intro."
    fish_ref: "components/raffle/RaffleDashboardCard.tsx:247-261"
  - id: participant.b.raffle-data
    text: "Active session GET /raffle-sessions/active (public; 404 → no session) and participation GET /raffle-sessions/participation (only signed in with an active session; 401 → none), both stale after 2 minutes; relative media URLs are made absolute; prizes accept items or subItems."
    fish_ref: "services/queries/useRaffleActive.ts:9-15; services/queries/useRaffleParticipation.ts:11-22; services/api/raffle.ts:5-183"
  - id: participant.b.raffle-orphans
    text: "fish declares raffle/upload-receipt, raffle/receipt-submitted and raffle/status but nothing navigates to them (the upload became a dialog, „my chances” became the confirmation page). Port them for parity but flag to the owner whether to keep them."
    fish_ref: "app/(app)/raffle/_layout.tsx:12-17; components/raffle/RaffleDashboardCard.tsx:259"
