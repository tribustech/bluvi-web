# Parity inventory — area "competitions-list" (tab Competiții: Descoperă/Viitoare/Live/Rezultate/Ale mele/Urmărite,
# bento, search, filters, results; legacy status lists global + per lake).
# Extracted from fish (read-only) on 2026-10-04. Line refs are fish file:line at that date.
# Note: search, filters, results and cards are parts of the (tabs)/competitions screen split out for batching.
# The three per-lake status lists (*-balta) have no page of their own on web: they are merged_into
# lakes.competitions (/balti/[id]/concursuri?tab=…). Where they conflict with it (header title, page size,
# card layout) lakes.competitions wins; their states and card criteria apply to that page.
area: competitions-list
screens:
  - id: competitions-list.index
    title: Competiții (Concursuri)
    fish:
      - app/(app)/(tabs)/competitions/index.tsx
      - app/(app)/(tabs)/competitions/_layout.tsx
      - app/(app)/(tabs)/_layout.tsx
      - features/competitions/components/CompetitionsHeader.tsx
      - features/competitions/components/CompetitionsStatusControl.tsx
      - features/competitions/components/cards/preview/CompetitionDensityPreviewToggle.tsx
      - features/competitions/hooks/useCompetitionCardDensity.ts
      - features/competitions/models/competition-filters.types.ts
      - features/competitions/models/competitions-search.types.ts
      - services/queries/useCompetitionCards.ts
      - services/api/competitionCards.ts
      - models/competition-card.type.ts
      - components/ErrorScreen.tsx
      - components/CompetitionsListSkeleton.tsx
      - components/ListLodingStateFooter.tsx
      - components/errors/RouteErrorBoundary.tsx
      - features/chat/components/viewer/MediaViewer.tsx
      - features/competitions/components/cards/CompetitionPhotoCaption.tsx
      - features/competitions/helpers/competitionsAnalytics.ts
      - hooks/useNavigationGuard.ts
    web_route: /concursuri
    template: T1
    milestone: M1
    roles: &a1
      - guest
      - angler
      - organizer
      - referee
      - operator
    core:
      - core/competitions/queries.ts#competitionCardsInfiniteQuery
      - core/competitions/queries.ts#selectCompetitionCards
      - core/competitions/queries.ts#competitionCardsKeys
      - core/competitions/api.ts#getCompetitionCards
      - core/competitions/api.ts#buildCompetitionCardsQuery
      - core/competitions/domain/filters.ts (DEFAULT_COMPETITION_FILTERS, countActiveFilters, hasActiveFilters, CompetitionCardsScope)
    states:
      - "signed-out: Descoperă lists load (public endpoint); Ale mele tab hidden; Urmărite (eye) shows the sign-in prompt instead of a list"
      - "loading (first page): heading count is a skeleton bar, list area shows CompetitionsListSkeleton"
      - "error: ErrorScreen inline under the heading (no back button), retry / sign-out per describeError"
      - "empty: Descoperă tab with no competitions"
      - "empty: Urmărite scope with no followed competitions"
      - "loading next page: spinner footer"
      - pull-to-refresh in progress (spinner only for the gesture, never for a tab switch)
      - "tab switch: previous list stays on screen until the new one lands (keepPreviousData)"
      - status = Viitoare (default) with the bento above the list
      - status = Live, polling every 60s while visible; red pulse dot on the tab when counts.started > 0
      - status = Rezultate (completed)
      - "scope = Ale mele (registered): mixed statuses, no status tab underlined, badge with competitions still ahead"
      - "Ale mele tab with registrations that are all finished: tab shown without a number"
      - scope = Urmărite (followed), eye button active
      - density = Listă (compact, default) vs Afiș (expanded)
      - arrived with ?status= from Acasă (param consumed and removed)
      - "chrome state: search row visible vs scrolled away (magnifier + filter icons fade into the title row)"
      - photo viewer open over the list
      - render error caught by the route error boundary (retry card)
    criteria:
      - id: competitions-list.index.c1
        text: A fixed chrome holds the title "Concursuri" and the status tab row; the list scrolls underneath it and fades into it through a short gradient instead of a hard edge.
        fish_ref: features/competitions/components/CompetitionsHeader.tsx:84
      - id: competitions-list.index.c2
        text: Status tabs are, in order, "Viitoare" (notStarted), "Live" (started), "Rezultate" (completed), styled as underline tabs with the active label and a 2.5 underline in indigo; Viitoare is selected on first open.
        fish_ref: features/competitions/components/CompetitionsStatusControl.tsx:29
      - id: competitions-list.index.c3
        text: The Live tab is prefixed by the pulsing red live dot only when the current list response reports counts.started > 0.
        fish_ref: features/competitions/components/CompetitionsStatusControl.tsx:81
      - id: competitions-list.index.c4
        text: A fourth tab "Ale mele" appears only when the signed-in user has at least one registration in any status (sum of counts of the registered scope > 0); it carries a badge with notStarted + started registrations (no badge at 0, "99+" above 99) and its accessible name is "Ale mele, N".
        fish_ref: app/(app)/(tabs)/competitions/index.tsx:245
      - id: competitions-list.index.c5
        text: Selecting a status tab sets that status, leaves "Ale mele" if it was active (scope registered → all) and logs competitions_status_changed {status, scope}.
        fish_ref: app/(app)/(tabs)/competitions/index.tsx:332
      - id: competitions-list.index.c6
        text: Selecting "Ale mele" toggles scope registered ↔ all; while active the list is requested without any status (one mixed list, server order live → soonest → finished) and no status tab is shown as selected.
        fish_ref: app/(app)/(tabs)/competitions/index.tsx:378
      - id: competitions-list.index.c7
        text: The eye button in the title row toggles scope followed ↔ all; it is tinted indigo when active and is labelled "Concursuri urmărite" (inactive) / "Toate concursurile" (active).
        fish_ref: features/competitions/components/CompetitionsHeader.tsx:106
      - id: competitions-list.index.c8
        text: 'The list header starts with a search row: a pill "Concurs, baltă sau organizator" (accessible name "Caută un concurs, o baltă sau un organizator") that opens the search, and a round filters button that opens the filters sheet; with active filters the button is filled indigo and labelled "Filtre, N active".'
        fish_ref: features/competitions/components/CompetitionsHeader.tsx:134
      - id: competitions-list.index.c9
        text: When the search row has scrolled under the chrome, a magnifier ("Caută concursuri") and a filters icon button fade into the title row; the two pairs are never interactive at the same time.
        fish_ref: features/competitions/components/CompetitionsHeader.tsx:42
      - id: competitions-list.index.c10
        text: 'List heading (not results mode): Viitoare "Alege următorul start", Live "Live acum", Rezultate "După ultima cântărire"; scope registered "Înscrierile mele", scope followed "Urmărite", scope organized "Organizate de mine".'
        fish_ref: app/(app)/(tabs)/competitions/index.tsx:62
      - id: competitions-list.index.c11
        text: 'Under the heading a count line uses meta.pagination.total with Romanian agreement: "1 concurs viitor" / "N concursuri viitoare", "… în desfășurare", "1 concurs încheiat" / "N concursuri încheiate"; in Ale mele it is "1 concurs" / "N concursuri".'
        fish_ref: app/(app)/(tabs)/competitions/index.tsx:69
      - id: competitions-list.index.c12
        text: While the first page loads the count line is a skeleton bar, never "0 concursuri".
        fish_ref: app/(app)/(tabs)/competitions/index.tsx:523
      - id: competitions-list.index.c13
        text: A two-segment control "Listă" / "Afiș" sits right of the heading; tapping the active segment does nothing; the choice is one value for the whole tab, persisted across sessions (storage key COMPETITION_CARD_DENSITY_V1), compact until storage answers and for anyone who never chose.
        fish_ref: features/competitions/components/cards/preview/CompetitionDensityPreviewToggle.tsx:58
      - id: competitions-list.index.c14
        text: The gap between cards is larger in Afiș (expanded) than in Listă (compact) (16 vs 10 in fish).
        fish_ref: app/(app)/(tabs)/competitions/index.tsx:573
      - id: competitions-list.index.c15
        text: Scope "all" reads the public GET /feed/competition-cards; registered / followed / organized read GET /feed/my-competition-cards; page size 20, sort=date, status from the tab; default values are omitted from the query string so identical lists share one URL.
        fish_ref: services/api/competitionCards.ts:41
      - id: competitions-list.index.c16
        text: Scrolling near the end (FlashList threshold 0.6) loads the next page when hasNextPage and not already fetching; a spinner footer shows while it loads.
        fish_ref: app/(app)/(tabs)/competitions/index.tsx:282
      - id: competitions-list.index.c17
        text: Pull-to-refresh refetches the visible list, re-draws the pulse person and the featured hero, and invalidates every competition-cards list; its spinner is bound to the gesture only, so a tab switch never shows it.
        fish_ref: app/(app)/(tabs)/competitions/index.tsx:308
      - id: competitions-list.index.c18
        text: The Live tab refetches every 60s, only while the screen is visible, status is Live and Ale mele is not active; Viitoare, Rezultate, Ale mele and results never poll.
        fish_ref: app/(app)/(tabs)/competitions/index.tsx:211
      - id: competitions-list.index.c19
        text: Switching tabs keeps the previous list on screen while the new list loads (placeholder = previous data) instead of flashing an empty state.
        fish_ref: services/queries/useCompetitionCards.ts:71
      - id: competitions-list.index.c20
        text: Each tab/scope list remembers its scroll offset when you leave it and is restored when you come back; a list not opened yet starts at the top.
        fish_ref: app/(app)/(tabs)/competitions/index.tsx:365
      - id: competitions-list.index.c21
        text: 'Signed out with a personal scope (Urmărite): no request is made and the list area shows "🔑 Intră în cont ca să vezi concursurile tale." with an outlined "Intră în cont" button that goes to sign-in.'
        fish_ref: app/(app)/(tabs)/competitions/index.tsx:446
      - id: competitions-list.index.c22
        text: 'A failed list request shows the shared error screen inside the list (no back button): title and message from describeError, "Încearcă din nou" refetches, "Deconectează-te" only for a dead session.'
        fish_ref: app/(app)/(tabs)/competitions/index.tsx:457
      - id: competitions-list.index.c23
        text: First-page loading shows the competitions list skeleton under the heading.
        fish_ref: app/(app)/(tabs)/competitions/index.tsx:458
      - id: competitions-list.index.c24
        text: 'Empty list outside results mode: followed scope → "Niciun concurs urmărit aici" + "Salvează concursurile care te interesează sau verifică celelalte taburi."; otherwise "Niciun concurs găsit" + "Schimbă tabul pentru a vedea alte concursuri."'
        fish_ref: app/(app)/(tabs)/competitions/index.tsx:594
      - id: competitions-list.index.c25
        text: Tapping a card opens the competition page (/concursuri/[id]); rapid double taps navigate once (navigation guard, 800ms window).
        fish_ref: features/competitions/components/cards/preview/CompetitionCardPreview.tsx:97
      - id: competitions-list.index.c26
        text: Tapping a card poster opens the photo full screen over the page with the competition caption, the competition name as sender and its dateLabel as time, and an action "Vezi concursul" that closes the viewer and opens the competition; closing returns to the list unchanged.
        fish_ref: app/(app)/(tabs)/competitions/index.tsx:667
      - id: competitions-list.index.c27
        text: A ?status=started|notStarted|completed parameter (used by Acasă "Vezi toate") clears search and filters, switches to that tab, and is then removed so a later visit does not snap back to it; any other value is ignored.
        fish_ref: app/(app)/(tabs)/competitions/index.tsx:350
      - id: competitions-list.index.c28
        text: The Descoperă bento (competitions-list.pulse) is rendered above the heading only on Viitoare, scope all, outside results mode.
        fish_ref: app/(app)/(tabs)/competitions/index.tsx:279
      - id: competitions-list.index.c29
        text: A render error in this route shows a retry card for this route only (route error boundary), not a blank page.
        fish_ref: app/(app)/(tabs)/competitions/index.tsx:726
    mobile_only: false
    status: todo
