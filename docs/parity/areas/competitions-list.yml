# Parity inventory — area "competitions-list" (tab Competiții: Descoperă/Viitoare/Live/Rezultate/Ale mele/Urmărite,
# bento, search, filters, results; legacy status lists global + per lake).
# Extracted from fish (read-only) on 2026-10-04. Line refs are fish file:line at that date.
# Note: search, filters, results and cards are parts of the (tabs)/competitions screen split out for batching.
# The three per-lake status lists (*-balta) have no page of their own on web: they are merged_into
# lakes.competitions (/balti/[id]/concursuri?tab=…). Where they conflict with it (header title, page size,
# card layout) lakes.competitions wins; their states and card criteria apply to that page.
area: competitions-list
screens:
  - id: competitions-list.index
    title: Competiții (Concursuri)
    fish:
      - app/(app)/(tabs)/competitions/index.tsx
      - app/(app)/(tabs)/competitions/_layout.tsx
      - app/(app)/(tabs)/_layout.tsx
      - features/competitions/components/CompetitionsHeader.tsx
      - features/competitions/components/CompetitionsStatusControl.tsx
      - features/competitions/components/cards/preview/CompetitionDensityPreviewToggle.tsx
      - features/competitions/hooks/useCompetitionCardDensity.ts
      - features/competitions/models/competition-filters.types.ts
      - features/competitions/models/competitions-search.types.ts
      - services/queries/useCompetitionCards.ts
      - services/api/competitionCards.ts
      - models/competition-card.type.ts
      - components/ErrorScreen.tsx
      - components/CompetitionsListSkeleton.tsx
      - components/ListLodingStateFooter.tsx
      - components/errors/RouteErrorBoundary.tsx
      - features/chat/components/viewer/MediaViewer.tsx
      - features/competitions/components/cards/CompetitionPhotoCaption.tsx
      - features/competitions/helpers/competitionsAnalytics.ts
      - hooks/useNavigationGuard.ts
    web_route: /concursuri
    template: T1
    milestone: M1
    roles: &a1
      - guest
      - angler
      - organizer
      - referee
      - operator
    core:
      - core/competitions/queries.ts#competitionCardsInfiniteQuery
      - core/competitions/queries.ts#selectCompetitionCards
      - core/competitions/queries.ts#competitionCardsKeys
      - core/competitions/api.ts#getCompetitionCards
      - core/competitions/api.ts#buildCompetitionCardsQuery
      - core/competitions/domain/filters.ts (DEFAULT_COMPETITION_FILTERS, countActiveFilters, hasActiveFilters, CompetitionCardsScope)
    states:
      - "signed-out: Descoperă lists load (public endpoint); Ale mele tab hidden; Urmărite (eye) shows the sign-in prompt instead of a list"
      - "loading (first page): heading count is a skeleton bar, list area shows CompetitionsListSkeleton"
      - "error: ErrorScreen inline under the heading (no back button), retry / sign-out per describeError"
      - "empty: Descoperă tab with no competitions"
      - "empty: Urmărite scope with no followed competitions"
      - "loading next page: spinner footer"
      - pull-to-refresh in progress (spinner only for the gesture, never for a tab switch)
      - "tab switch: previous list stays on screen until the new one lands (keepPreviousData)"
      - "status = Viitoare (default) with «N concursuri live acum» (when something is live) and «În lumina reflectoarelor» above the list (WEB, replaces the bento: c38, c39)"
      - status = Live, polling every 60s while visible; red pulse dot on the tab when counts.started > 0
      - status = Rezultate (completed)
      - "scope = Ale mele (registered): mixed statuses, no status tab underlined, badge with competitions still ahead"
      - "Ale mele tab with registrations that are all finished: tab shown without a number"
      - scope = Urmărite (followed), eye button active
      - "density: WEB one only (no Listă / Afiș toggle, owner 2026-10-06) — fish's poster cards (expanded density) at every width"
      - "arrived on a tab's own page (/concursuri/viitoare · /live · /rezultate, e.g. from Acasă «Vezi toate») or on /concursuri (Live when something is live, else Viitoare)"
      - "chrome state: search row visible vs scrolled away (magnifier + filter icons fade into the title row)"
      - photo viewer open over the list
      - render error caught by the route error boundary (retry card)
      - "WEB Viitoare at every width: poster cards grouped on the time axis (Azi · Mâine · Săptămâna asta · Weekendul ăsta · Săptămâna viitoare · months), passed starts last (c40)"
      - "WEB Live at every width: «Cântăriri recente» + «Concursul tău» above poster cards in a stable order (competitions-list.live c16–c24)"
      - "WEB desktop ≥1024, Rezultate: compact winner rows, one expanded inline (points rankings in points)"
      - "WEB desktop ≥1024, Ale mele: my registrations led by my status"
