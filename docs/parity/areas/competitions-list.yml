      - id: competitions-list.pulse.c1
        text: The bento shows only on Viitoare with scope all, no committed search and no active filters; it is not rendered at all when there is no hero once loading finished.
        fish_ref: features/competitions/components/pulse/PulseBento.tsx:88
      - id: competitions-list.pulse.c2
        text: While loading, the hero slot is a skeleton of the hero height (plus the dots row when more than one competition is live) and the person + count row is two equal skeletons; the row reveals both tiles together.
        fish_ref: features/competitions/components/pulse/PulseBento.tsx:100
      - id: competitions-list.pulse.c3
        text: Pulse inputs are the live (first 6), upcoming (first 12) and completed (first 6) card lists; upcoming drops notStarted competitions whose start is more than 24h past, merges in my own notStarted registrations, removes anything already in live, and is sorted by start date.
        fish_ref: features/competitions/helpers/useCompetitionsPulse.ts:102
      - id: competitions-list.pulse.c4
        text: "Hero ladder: my live competition → my start within 2 days → first live → upcoming starting within 14 days (prefer ones with places, most joined, then soonest) → soonest dated upcoming → first upcoming → most recently ended completed → none."
        fish_ref: features/competitions/helpers/pickHero.ts:89
      - id: competitions-list.pulse.c5
        text: "The local pick is frozen for the visit: it changes only when the set of live competitions changes or on pull-to-refresh, never on unrelated re-renders."
        fish_ref: features/competitions/helpers/useCompetitionsPulse.ts:127
      - id: competitions-list.pulse.c6
        text: GET /feed/featured-competition is requested only when nothing is live and the hero is not my own upcoming competition; when it returns a card it replaces the local hero as an upcoming card with the chip "RECOMANDAT".
        fish_ref: features/competitions/helpers/useCompetitionsPulse.ts:172
      - id: competitions-list.pulse.c7
        text: "When there are two or more pages (live competitions, my imminent start), the hero is a horizontal stack: my live one first, my imminent start next (first if nothing of mine is live), the other live ones shuffled once per visit; the next card peeks at the edge and a dots row tracks the position."
