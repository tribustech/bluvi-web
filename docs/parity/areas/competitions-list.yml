        text: A fixed chrome holds the title "Concursuri" and the status tab row; the list scrolls underneath it and fades into it through a short gradient instead of a hard edge.
        fish_ref: features/competitions/components/CompetitionsHeader.tsx:84
      - id: competitions-list.index.c2
        text: Status tabs are, in order, "Viitoare" (notStarted), "Live" (started), "Rezultate" (completed), styled as underline tabs with the active label and a 2.5 underline in indigo; Viitoare is selected on first open.
        fish_ref: features/competitions/components/CompetitionsStatusControl.tsx:29
