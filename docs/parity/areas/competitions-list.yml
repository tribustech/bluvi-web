behaviours:
  - id: competitions-list.b.tab-entry
    text: The area is a main tab labelled "Competiții" with a trophy icon; on web it is the top-bar link "Competiții" → /concursuri, open to guests (the (app) group does not redirect signed-out users).
    fish_ref: app/(app)/(tabs)/_layout.tsx:66
  - id: competitions-list.b.status-param
    text: 'Acasă "Vezi toate" under the live rail opens the tab on Live and under the upcoming rail on Viitoare (router param status=started|notStarted); web: /concursuri?status=… (homeLinks.competitions). The param resets search and filters and is consumed.'
    fish_ref: app/(app)/(tabs)/index.tsx:480
  - id: competitions-list.b.notification-routes
    text: Notification NEW_COMPETITIONS without competitionId and COMPETITIONS_DIGEST open the competitions tab; NEW_COMPETITIONS with competitionId opens that competition.
    fish_ref: helpers/getRedirectLocationForNotification.ts:159
  - id: competitions-list.b.lake-see-all
    text: 'Lake competition rails ("Live", "Viitoare", and on the lake competitions page also past) link "Vezi toate" to /(app)/competitions/{status}/{lakeId}; with no lakeId the same push lands on the global status list. Web: /balti/[id]/concursuri?tab=live|viitoare|trecute (one page, owned by lakes.competitions; the three per-lake entries here are merged_into it) and /concursuri/{live|viitoare|incheiate}.'
    fish_ref: components/HorizontalCompetitionsList.tsx:75
  - id: competitions-list.b.live-poll
    text: "Only the Live tab polls (60s), only while the page is visible and not on Ale mele; the interval belongs to the tab's observer, so the bento sharing the same live cache key never polls on its own. Web: pause on document hidden."
    fish_ref: app/(app)/(tabs)/competitions/index.tsx:211
  - id: competitions-list.b.cache-freshness
    text: "Competition-card lists: staleTime 5 min and gcTime 30 min for every status, previous data kept on key change; suggestions: staleTime 60s; pulse person and featured: staleTime 5 min, no refetch on focus or reconnect (pull-to-refresh bypasses)."
    fish_ref: services/queries/useCompetitionCards.ts:104
  - id: competitions-list.b.public-vs-personal
    text: scope all hits the edge-cached public /feed/competition-cards; registered/followed/organized hit per-user /feed/my-competition-cards and are never requested signed out (requiresSignIn).
