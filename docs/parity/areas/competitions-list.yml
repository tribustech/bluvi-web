    states:
      - "loading: hero skeleton (+ dots row when liveCount > 1); person + count tiles as two skeletons until both settle"
      - "no hero after loading: bento not rendered"
      - "live day: hero stack of every live competition with peek, dots and auto-advance"
      - my own live competition leads the stack
      - "my own start within 2 days: leads (or sits behind my live one)"
      - "nothing live: discovery pick, or featured competition (RECOMANDAT) when the server offers one"
      - "nothing upcoming: most recent results card (REZULTATE)"
