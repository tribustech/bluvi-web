behaviours:
  - id: global.b.guest-browsing
    text: "Nothing is auth-gated at the layout level: guests can open every public page; screens that need a user gate themselves (Redirect to sign-in, a sign-in prompt, or a disabled query). On web, per-user pages redirect to /intra?next=<path>, public pages render their guest variant (see account.b.signed-out-gate)."
    fish_ref: "app/(app)/_layout.tsx:42-48; app/(app)/(tabs)/profile.tsx:9-15; app/(app)/partide/join/[code].tsx:27-31"
  - id: global.b.session-loading-gate
    text: "Until the stored session is read, the (app) area renders only a spinner, so no screen decides signed-in vs signed-out on a not-yet-known session. Web: the viewer is resolved server-side from the session cookie before rendering."
    fish_ref: "app/(app)/_layout.tsx:31-40"
  - id: global.b.session-expired
    text: "Session expiry on web: the first ApiError with code SESSION_DEAD (401 „Missing or invalid credentials” / „Invalid credentials”) clears the session cookie once, sends the user to /intra?next=<current path> and shows the error toast „Sesiunea ta a expirat. Te rugăm să te autentifici din nou.”; further 401/403 in the same burst (60 s) do nothing and are not reported. A 401 with a bluCode is a handled error, not a dead session. The JWT has no refresh (1 year). Detail: account.b.session-expired."
    fish_ref: "services/api/api.ts:55-124,141-157; contexts/auth/AuthContext.tsx:257-307"
    status: passing
    web_note: "Built 2026-10-07 (M2-B3 sign-in fixes). SESSION_DEAD detection (core/transport errors.ts, a 401 with a bluCode stays a handled error) and the proxy deleting the dead cookie (lib/server/proxy isDeadSessionBody) as before; app/providers.tsx onSessionDead now: claimSessionDead() (lib/client/session-expired.ts, 60 s module latch, re-armed by a successful sign-in in SignIn.tsx) → queryClient.clear() → the danger toast via the (site) toast host (Toast.tsx subscribes; a one-slot mailbox covers a host not yet mounted) → Firebase Auth signed out (signOutFirebaseQuietly: lazy, waits for the IndexedDB-persisted user, non-fatal; fish signOut → signOutOfFirebase) → POST /api/auth/logout → router.replace(/intra?next=<path+search>) (already on /intra: stay) + router.refresh() (the shared top bar re-renders signed out). Unit lib/client/session-expired.test.ts; e2e tests/e2e/intra.spec.ts «global.b.session-expired … burst» (two held 401s released together on /notificari: one logout, one toast, one history entry to /intra?next=%2Fnotificari, the seeded IndexedDB Firebase user gone) and «from a public page the redirect carries the page as next» (/stiri?x=1)."
  - id: global.b.sign-out-failure
    text: "If any sign-out step throws, the session is still cleared and the error toast „A aparut o problema. Te rugăm să încerci mai târziu.” is shown (fish copy lacks diacritics in „aparut o problema” — web uses „A apărut o problemă. Te rugăm să încerci mai târziu.”, flagged as a copy fix)."
    fish_ref: "contexts/auth/AuthContext.tsx:291-295"
  - id: global.b.api-headers
    text: "Every CMS request carries Authorization: Bearer <jwt> when signed in, x-app-version and x-app-platform (fish: ios/android; web: web); the request timeout is 45 s. A direct public browser GET stays a CORS simple request (no x-app-* headers); per-user calls go through the web proxy, which adds them."
    fish_ref: "services/api/api.ts:26-53"
  - id: global.b.error-normalisation
    text: "Every failed request rejects with { message, status, code, bluCode?, details? }: a bluCode response keeps the server message and details (handled by the screen); everything else gets the generic message „A apărut o eroare necunoscută. Te rugăm să reîncerci mai târziu.”. Web equivalent: core/transport ApiError."
    fish_ref: "services/api/api.ts:12-24,141-149,175-185"
  - id: global.b.focus-refetch
    text: "Returning to the app invalidates every query (fish AppState active → invalidateQueries()). Web: refetch on window focus / visibilitychange for queries that do not opt out (queries that set refetchOnWindowFocus: false keep it off, as in fish)."
    fish_ref: "app/_layout.tsx:58-64; hooks/useAppState.ts:12-43"
  - id: global.b.reconnect-refetch
    text: "Losing connectivity pauses requests (onlineManager offline); regaining it, or the probe returning to ok, refetches every active query."
    fish_ref: "contexts/NetInfoContextProvider.tsx:169-178,218-227"
  - id: global.b.nav-guard
    text: "Only one forward navigation per 800 ms is accepted app-wide (push/navigate); replace is never gated (redirects, sign-out); back/dismiss end the window. Web: links and programmatic router.push from cards/buttons must not double-push on a double click."
    fish_ref: "hooks/useNavigationGuard.ts:4-23,63-99; app/(app)/_layout.tsx:13-17"
  - id: global.b.deep-link-scheme
    text: "The app answers the custom scheme bluvi:// and universal/app links on https://bluvi-app.wearetribus.com for the path prefixes /competitions, /lakes, /polls and /partide (Android intent filters with autoVerify; iOS associatedDomains + AASA paths /competitions/*, /lakes/*, /polls/*, /partide/*). Any other path on that host falls through to the redirect-stores site, which sends the visitor to the store (catch-all SmartStoreRedirect). Web (M8): the same host/paths must keep opening the app on phones and open the web page elsewhere."
    fish_ref: "app.json:8,33-35,63-124; ../bluvi-redirect-stores/public/.well-known/apple-app-site-association.json; ../bluvi-redirect-stores/src/App.tsx:27-40"
    status: proposed
    note: "Owner decision in docs/reviews/M8-url-scheme.md: A) web on its own domain, app links unchanged, the redirect-stores catch-all sends desktop visitors to the web (recommended); B) the web takes over bluvi-app.wearetribus.com and serves AASA + assetlinks.json itself. The web serves no AASA today."
  - id: global.b.legacy-path-redirects
    text: "Every URL the app has ever shared, a push can target or a universal link can open (AASA /competitions/*, /lakes/*, /polls/*, /partide/*) must resolve on web: a redirect to the Romanian route, permanent (308) unless noted. The request query is kept on every redirect (Next merges it into the destination; a next.config redirect cannot drop a key): the destination pages ignore fish's leftovers (timestamp, activeTabId, participantsFilter, sectorName, standName, name) — deviation from the original «timestamp dropped», accepted because dropping keys would need a proxy.ts redirect for links Google never sees. Contract: /competitions → /concursuri; /competitions/{id} → /concursuri/{id}; ?activeTabId=clasament → /concursuri/{id}/clasament; =participanti → /participanti (participantsFilter=pending → ?filtru=in-asteptare); =extracantare → /extra-cantare; =informatii → /informatii; =regulament → /regulament (an unknown tab → the competition); ?openWeighingSheet=1&standId&weighingId → /concursuri/{id}/cantare?cantar={weighingId}&stand={standId}; /competitions/{id}/chat?tab=participants → /concursuri/{id}/chat?tab=participanti and ?tab=general → ?tab=general (the web chat reads `tab`, not the originally specified `camera` — deviation); /competitions/stand-timeline/{id} → /concursuri/{id}/statistici/cronologie; /lakes → /balti; /lakes/{id} → /balti/{id}; /lakes/{id}/reviews → /recenzii; /lakes/{id}/gallery → /galerie; /lakes/{id}/map → /harta; /lakes/{id}/capturi|concursuri|partide|standuri|statistici|clasament → the same name under /balti/{id}; /lakes/review/{id} → /balti/{id}/recenzie; /polls/current → /sondaje; /polls/past → /sondaje/anterioare; /partide/join/{code}, /partide/join and /partide/start → /partide, temporary 307 (deviation from the original /partide/intra/{code}: joining and starting a partidă are app-only on web, ROADMAP §4b rule 21); /partide/comunitate/{id} → /partide/{id}; /partide/comunitate/capturi/{id} → /partide/{id}/capturi; /partide/comunitate/galerie/{id} → /partide/{id}/galerie; /anglers/{id} → /pescari/{id}; /news → /stiri; /news/{id} → /stiri/{id}; /bookings → /rezervari; /bookings/{id} → /rezervari/{id}; /operator/{lakeId}/bookings?status= → /operator/{lakeId}/rezervari?status=; /organizer → /organizator; /penalties/{id} → /concursuri/{id}/penalizari; /penalties/{id}/apply → /penalizari/aplica; /penalties/{id}/select-stand → /penalizari/stand. Unknown ids render a not-found state, never a blank page."
    fish_ref: "helpers/getRedirectLocationForNotification.ts:30-193; common/utils/competitionRoutes.ts:1-7; app.json:63-124; app/(app)/lakes/[lakeId]/reviews.tsx; app/(app)/lakes/[lakeId]/gallery.tsx; app/(app)/lakes/[lakeId]/map.tsx; app/(app)/lakes/review/[lakeId].tsx; app/(app)/penalties/[competitionId]/index.tsx; app/(app)/penalties/[competitionId]/apply.tsx; app/(app)/penalties/[competitionId]/select-stand.tsx; app/(app)/competitions/stand-timeline/[competitionId].tsx; app/(app)/partide/comunitate/galerie/[id].tsx"
    status: passing
    note: "M8-B1: next.config.ts redirects(), specific before generic. The three deviations (query kept, chat ?tab=, partidă join/start → 307 /partide) are part of the criterion text above, not hidden here. e2e tests/e2e/legacy-redirects.spec.ts (one request per row of legacy-redirects.cases.ts: status + Location path + the query keys that matter; the web's routes not caught; a real competition, lake and news item land on their pages; an unknown id lands on the not-found card) + tests/unit/legacy-redirects.test.ts (the same table against next.config alone)."
  - id: global.b.share-urls
    text: "Links the app shares are built on WEB_DOMAIN (https://bluvi-app.wearetribus.com): competition /competitions/{id}, lake /lakes/{documentId}, poll /polls/current, partidă join /partide/join/{code}, partidă spectate /partide/comunitate/{documentId}. Web share actions build absolute web URLs with lib/routes absoluteUrl(); until the domain decision (M8) both URL shapes must resolve (global.b.legacy-path-redirects)."
    fish_ref: "common/utils/constants.ts:35; app/(app)/competitions/[competitionId].tsx:324-325; features/lakes/components/ShareLakeSheet.tsx:118; helpers/sharePoll.ts:5; features/partide/components/CoopCard.tsx:38-39; features/partide/helpers/deepLinks.ts:19-20"
    status: proposed
    note: "Owner decision in docs/reviews/M8-url-scheme.md (domain A/B, slug). Until then both URL shapes resolve: the app's /competitions, /lakes, /polls, /partide links 308 to the web pages (global.b.legacy-path-redirects, tests/e2e/legacy-redirects.spec.ts)."
  - id: global.b.seo-og-images
    text: "Every public page shares as a rich preview: a generated 1200×630 PNG Open Graph / Twitter image (file convention opengraph-image.tsx + twitter-image.tsx, drawn by lib/server/og in the fish visual language from the globals.css tokens, Nunito). Brand card (logo, title, tagline) for /, /balti, /balti/harta, /concursuri (+ /viitoare, /live, /rezultate), /ape-publice, /stiri; lake card (photo or brand panel, name, «oraș, județ», «4,50 ★ (N recenzii)», «de la X RON») on /balti/[id] and its subpages (labelled «Baltă · Statistici»…); competition card (banner/poster or brand panel, name, lake, date range, the status pill as the competition page shows it — «Live» only, plus «Anulat» for a cancelled one — and once completed the podium by fish's card rule: places within the competition's podium depth (one per sector / bestOf winners / tier, 3–6) that caught something, none when nothing was weighed or there is no 1st place, a shared place's badge reading «=1» with «= la egalitate» said once under the podium (never on the name's line), the angler named in an individual competition — never the team name typed, often a sponsor (CMS podiumFromPlacements) —, the ranking's figure with kg or puncte as a separate unit, never «capot»; web deviation, deliberate: a 1200×630 card holds at most 6 rows where fish's card lists every row within depth, so places are kept whole while they fit — a place is never cut inside, the first that does not fit ends the podium, a 1st place shared by more than 6 gives no podium) on /concursuri/[id] and subpages (Imagine clasament included: its page metadata names no image, the segment's card is the one og/twitter image, summary_large_image); public-water card (name, «tip · localizare», area in km², the outline from the bundled dataset) on /ape-publice/[id] and subpages; news card (cover, category, date, title) on /stiri/[id]; sponsor card (logo contained, name) on /sponsori/[id]. Owner rule 4: an unknown fact is left out; an entity the CMS cannot give answers the section's brand card (200), never an error. Pictures: a lake photo or portrait poster is cropped to the panel; a news cover is drawn whole on a blurred copy of itself (never cut) unless its shape is within 15% of the panel's (then cropped — no dark slivers); a competition banner is drawn whole only when clearly landscape (wider than the panel by > 15%). Layout (lib/server/og/layout.ts, text measured with Nunito's advance widths): the logo, eyebrow and title start on the same lines whatever the picture; with no picture the brand panel is a narrow 220 px band (gradient + fish) and the facts take the width; a podium card's photo narrows to 380 px so team names read whole; figures / podium sit at the bottom, without them the facts are centred; the facts are fitted to the space left, by priority: the title whole (≤ 2 lines at the bottom, ≤ 3 centred; «hero» only when it fits 2 hero lines; lines balanced, a « — » bound to the word before), then the lake and the dates (two lines, else one «Lac · 10–11 oct. 2026» line — a results card always says where and when), then the tie legend; ≤ 2 meta lines; secondary text ≥ 30 px on the 1200 px canvas (legible in a ~340 px chat preview). On entity pages og:image AND twitter:image are the card (the page metadata names no raw photo — WhatsApp / Facebook read og:image), with a per-entity alt naming the entity and only the facts the card draws, read off the same layout (generateImageMetadata: «Concursul X, Lac, 10–11 octombrie 2026 — podium: …»). Each image is a cached CMS read + drawing under the entity's CMS tag (purge redraws it); only a slow / failed read is retried within minutes («no price» or an unknown ranking type is an answer, cached as the entity); ≤ 300 KB."
    fish_ref: "features/lakes/components/ShareLakeSheet.tsx:118; app/(app)/competitions/[competitionId].tsx:324-325"
    status: passing
    note: "e2e tests/e2e/og-images.spec.ts (a1 meta points at the route's image with size/type/alt, a2 200 image/png 1200×630 ≤ 300 KB, a3 warm < 1.5 s, a4 unknown / malformed id → brand card) + unit tests/unit/og-model.test.ts (card copy, rule 4 omissions, fish podium rule — no-catch rows dropped, no 1st → none, ties, depth —, status pill, per-entity alt, units / plurals, clamping, tokens, every text step ≥ 30 px) + tests/unit/og-images.test.ts (timeout / error vs «no data») + tests/unit/og-layout.test.ts (Nunito metrics vs the font files, a tied 1st place with two long team names fits its row and is rendered to PNG, meta lines by the space left for 1–6 places, the brand band, the 15% picture rule, balanced titles); e2e also checks Imagine clasament's single og:image source. fish has no web previews (it shares links only): this is the web's replacement for a shared link's look. Metadata objects are global.seo's: / still names og-home.jpg itself (the route draws the same artwork) and most pages say twitter card «summary» — «summary_large_image» would show the card full size."
  - id: global.b.unmatched-route
    text: "fish has no not-found route: an unmatched link renders a black page, which is why every notification/link target must exist in all app versions. Web: any unmatched path inside the site renders „Pagina nu există” inside the shell with a link home, with HTTP 404 or noindex (app/(site)/[...rest] → not-found.tsx)."
    fish_ref: "app/_layout.tsx:95; ../bluvi-redirect-stores/src/App.tsx:34-40"
  - id: global.b.notification-routes-web
    text: "Notification type → web route (same rules and same null cases as fish; a missing required id means no navigation): COMPETITION_NEW_REGISTRATION_USER/TEAM, NEW_REJECTION_TEAM/USER, PENDING_USER, REGISTRATION_MODIFIED_PARTICIPANT, START, FOLLOW_COMPETITION_START, NEW_COMPETITIONS with id → /concursuri/{competitionId}; COMPETITION_END, ROUND_END, FOLLOW_COMPETITION_END/PODIUM → /concursuri/{id}/clasament; NEW_REGISTRATION_ORGANIZER → /concursuri/{id}/participanti?filtru=in-asteptare (the pending registrations; until M6 the unfiltered /concursuri/{id}/participanti, see web_note); PARTICIPANTS_ALLOCATION, ROUND_START, NEW_CANCELLATION_ORGANIZER, REGISTRATION_MODIFIED_ORGANIZER, FOLLOW_COMPETITION_REGISTERED/DIGEST → /concursuri/{id}/participanti; WEIGHING_MODIFIED/END (needs sectorName, standName, standId, weighingId — weighihngId accepted as legacy spelling) → /concursuri/{id}/cantare?cantar={weighingId}&stand={standId}; EXTRA_WEIGHT_REQUEST → /concursuri/{id}/extra-cantare; CHAT_MESSAGE → /concursuri/{id}/chat?camera={tab|chatRoom|general}; PENALTY → /concursuri/{id}/penalizari; POLL_OPENED/CLOSED/SUGGESTION_APPROVED → /sondaje; NEWS → /stiri/{newsId}; NEW_LAKES → /balti; NEW_FOLLOWER → /pescari/{followerDocumentId}; PARTIDA_INVITE → /partide/intra/{partidaCode}; PARTIDA_FINISHED, PARTIDA_AUTO_CLOSE_WARN → own partidă by client sessionId (route owned by partide area); PARTIDA_CATCH, PARTIDA_FINISHED_FOLLOWED, FOLLOW_PARTIDA_START/FIRST_CATCH → /partide/{sessionDocumentId}; FOLLOW_RECORD_PERSONAL/LAKE → /partide/{sessionDocumentId}/capturi; FOLLOW_LAKE_REVIEW → /balti/{lakeId}/recenzii; COMPETITION_AUTO_CANCELLED_ORGANIZER → /organizator; BOOKING_*_ANGLER → /rezervari/{bookingId}; BOOKING_NEW_REQUEST_OPERATOR, PENDING_NUDGE_OPERATOR → /operator/{lakeId}/rezervari?status=pending; AUTO_REJECTED_OPERATOR → ?status=rejected; CANCELLED_OPERATOR → ?status=cancelled; NEW_COMPETITIONS without id, COMPETITIONS_DIGEST → /concursuri; SCHEDULED_NOTIFICATION, COMPETITION_CANCELLED_USER, unknown → none. One pure function in core/social/domain builds these from lib/routes."
    fish_ref: "helpers/getRedirectLocationForNotification.ts:30-193; contexts/NotificationsContextProvider.tsx:54-58"
    status: passing
    web_note: "lib/notification-href.ts notificationHref(route) over core social getRouteForNotificationItem (the mapping lives in core as route descriptors; the web paths only in lib, built with lib/routes). Angler booking notifications (BOOKING_*_ANGLER) open /rezervari/{bookingId} since M3-B2 (NOTIFICATION_PAGES_ON_WEB.booking on; legacy /bookings/{id} → 308 /rezervari/{id}). Targets whose page is not on the web yet answer null (a plain row, never a dead link): chat (M5), penalties (M6), /sondaje (M5), partidă join / own partidă / community catches (M4, and community sessions via ON_WEB.partida), /organizator (M6), operator bookings (M7) — each gated in NOTIFICATION_PAGES_ON_WEB, and a unit test fails when one of those pages appears under app/(site) while its gate is off. Deliberate gap: COMPETITION_NEW_REGISTRATION_ORGANIZER links /concursuri/{id}/participanti WITHOUT ?filtru=in-asteptare — the participants page has no pending filter before M6 (organizer.yml), so the organizer lands on the unfiltered list; gate NOTIFICATION_PAGES_ON_WEB.organizerPendingFilter, which the unit test turns on once a source under concursuri/[id]/participanti reads `filtru`. tests/unit/notification-href.test.ts (every type incl. COMPETITION_ROUND_END/START, added to core 2026-10-07; missing ids; encoding); e2e tests/e2e/notificari.spec.ts «c8 + global.b.notification-routes-web»."
  - id: global.b.notification-same-page
    text: "Opening a notification whose target is the page already shown still acts: fish appends a timestamp so the same route re-navigates; a weighing notification for the competition already open opens that weighing in place; a chat notification for the chat already open switches the room in place instead of stacking another chat. Web: same URL → refetch + open the target in place, never a duplicate history entry."
    fish_ref: "helpers/getRedirectLocationForNotification.ts:31-32; contexts/NotificationsContextProvider.tsx:188-223"
  - id: global.b.notification-tap-invalidation
    text: "Opening a NEWS notification invalidates the news cache; opening any competition-type notification invalidates the competitions and competition caches, so the target page shows fresh data."
    fish_ref: "contexts/NotificationsContextProvider.tsx:179-186"
  - id: global.b.firebase-bridge
    text: "With a session but no Firebase user (cold start, revoked token), a Firebase custom token is re-minted once per session value and signed in, non-fatally — needed for chat and live partide. Web: lib/client/firebase signs in from /firebase-token after the session is known."
    fish_ref: "contexts/auth/AuthContext.tsx:109-132"
  - id: global.b.partide-live-mount
    text: "For a signed-in user one live-partidă subscription is mounted once for the whole app (hydrated from the active-session pointer, Firestore listener on the active session, detached on sign-out), so every page knows about the running partidă. Web: mounted once in the shell for signed-in viewers (partide area owns the details)."
    fish_ref: "app/(app)/_layout.tsx:19-29,52; features/partide/domain/useLiveMount.ts:1-17"
  - id: global.b.chat-outbox
    text: "The chat outbox is drained at start, whenever the device comes back online and on return to the foreground; it is discarded on sign-out so nothing uploads under the next account. Web: drained on load/online/visibility (chat area owns it)."
    fish_ref: "features/chat/outbox/ChatOutboxMount.tsx:7-31; app/(app)/_layout.tsx:53; contexts/auth/AuthContext.tsx:269-272"
  - id: global.b.capture-spam-guard
    text: "One app-wide host shows the „ești sigur?” soft confirmation when a capture is started less than 30 s after the previous one on the same rod bucket; confirming continues to the capture and records a spam signal, cancelling clears it. Web: one host in the shell (partide area owns the flow)."
    fish_ref: "features/partide/components/CaptureSpamGuardHost.tsx:1-12,25-38; app/(app)/_layout.tsx:54"
  - id: global.b.observability
    text: "Errors are reported to Sentry only on production/staging; the user is identified from the stored JWT's id before any request (tag session.state = none|valid|expired|unreadable); the Authorization header is never attached to events; API errors are tagged api_url + api_status and deduped per (status, endpoint) per session."
    fish_ref: "app/_layout.tsx:35-51; contexts/auth/AuthContext.tsx:80-105; services/api/api.ts:86-95,158-172"
    status: passing
    web_note: "M8-B2 (m8.sentry), @sentry/nextjs behind env only (no DSN or token in code): server/edge via instrumentation.ts (SENTRY_DSN, independent of consent, onRequestError tags session.state + user.id decoded from the bluvi_session cookie, the JWT never attached); browser via instrumentation-client.ts (NEXT_PUBLIC_SENTRY_DSN, a separate chunk loaded only after readConsent().errors === true, closed again on withdrawal; identity from /api/auth/session). Reports only on production / preview / staging (SENTRY_ENVIRONMENT, else VERCEL_ENV); server tracesSampleRate 0.05; the browser sends errors only (BrowserSession + BrowserTracing integrations dropped, tracesSampleRate 0 — what the «Monitorizarea erorilor» disclosure says); no Session Replay. The browser gate is decided synchronously in instrumentation-client.ts from the bluvi_consent cookie (lib/observability/gate.ts), so a first-render crash caught by global-error / (site)/error is queued and delivered once the SDK attaches. Identity follows the session without a reload like fish AuthContext.tsx:80-105: sign-in → session.state valid + user.id (SignIn.tsx), confirmed sign-out → none + no user (lib/client/sign-out.ts), forced sign-out → expired + no user (app/providers.tsx); sign-in and sign-out re-arm the API-error dedupe. beforeSend scrubs Authorization/Cookie headers, bluvi_session, JWTs, query tokens and e-mails; browser API errors tagged api_url + api_status, deduped per (status, endpoint) per page; SESSION_DEAD itself sends fish's handleDeadSession message once per page («Session rejected by the API — signing the user out», level error, extra url + hadSessionCookie) and its 60 s 401/403 burst is muted (also after a voluntary sign-out) (lib/observability). app/global-error.tsx: Romanian fallback (kit ErrorState). Unit lib/observability/observability.test.ts (env gating, browser errors-only options, synchronous gate + capture before the gate resolves, consent gate, session state + identity changes, scrubber, dedupe, dead-session message); e2e tests/e2e/sentry-off.spec.ts (no DSN: a forced client error, the root and a route error boundary, and accepted consent send nothing and load no SDK). Live verification needs the owner's Sentry project."
  - id: global.b.screen-view-analytics
    text: "Exactly one screen_view per (pathname, route pattern): navigating between two lakes logs twice, re-rendering the same route logs once; entity ids from the params are attached. Web: GA4 page_view with the same dedupe, after consent (M8)."
    fish_ref: "analytics/ScreenViewTracker.tsx:7-58"
    status: passing
    web_note: "components/analytics/ScreenViewTracker.tsx (mounted once in app/layout.tsx inside <Suspense>): the route pattern comes from usePathname() matched against the screenNames.ts table (static beats [param] beats the not-found catch-all, params read from the pathname), never from the router tree — a screen that moves the URL with history.pushState / replaceState (a tab, a filter, a wizard step) leaves Next's layout segments and params on the old route (ACTION_RESTORE); useParams only serves pages outside the table (dev). Module-scope dedupe on the fish screen instance (screenInstanceKey): `${pathname} ${pattern}` like fish, except the routes that are in-place tabs of ONE fish screen — the Competition Page tabs (/concursuri/[id], /clasament, /cantare, /informatii, …: key «Competition Page|<competition_id>», fish logs competition_page_tab_pressed there, no screen_view) and the Competitions List status tabs (/concursuri/{viitoare,live,rezultate}: fish logs competitions_status_changed), so switching tabs logs nothing and another competition logs one. lib/analytics trackPageView → GA4 page_view with screen_name / screen_class from components/analytics/screenNames.ts (fish screenNames.ts names; web-only routes get a derived name, never untracked), entity ids like fish screenParams.ts (lake_id, competition_id, news_id, creative_id, public_water_id; default-deny: angler, booking, partidă, session ids never logged) and page_path = the pattern with only those ids filled in (no query string; page_title = screen name, never a person's name). The page on screen when the visitor opts in is counted once. PRECONDITION (owner, docs/RUNBOOK.md, launch blocker): config has send_page_view:false, but that only drops config's own hit — GA4 enhanced measurement «Page changes based on browser history events» and «Site search» (on by default in a new web stream) send their own page_view / view_search_results with the real URL (people's ids, ?q= free text) on every client navigation; they must be turned off in the web stream, else ours is not the only page_view and the default-deny is bypassed. Proof: e2e tests/e2e/analytics-ga4.spec.ts «one page_view per navigation: lake A → lake B = 2, a re-render of the same route = 1…», «an angler's page reports the route pattern…», «a URL moved with history.pushState … is reported as the new screen and path», «Competitions List: Viitoare → Live … no second page_view», «Competition Page: its tabs are one screen …» (bluvi:page-view channel), unit tests/unit/screen-names.test.ts (pattern → fish name table, every app/ route named, pathname matching, stale params, screen instance, entity params, page_path, ga4Id gating) and components/analytics/ga4.test.ts «page_view: the page of the opt-in once…», «competition tabs are one screen…» (gtag). GA4 itself needs NEXT_PUBLIC_GA4_ID on the production deployment (elsewhere only with NEXT_PUBLIC_ANALYTICS_DEBUG, like fish isCollectionEnabled) and the visitor's «Analiză» opt-in; a withdrawal in another tab is applied when this tab is shown / focused again (Ga4.tsx re-reads the consent cookie). Without GA on, the events stay on the page's bluvi:analytics channel (no script, no cookie)."
