  - id: global.version-check
    title: Actualizare aplicație
    fish:
      - components/VersionWrapper.tsx
      - services/api/version.ts
      - models/version.type.ts
      - helpers/openAppStoreListing.ts
      - atoms.ts
    web_route: none
    template: none
    milestone: M0
    roles: [guest, angler, organizer, referee, operator]
    core: []
    states:
      - stable
      - update_available (skippable)
      - unsupported (blocking)
      - check failed (fail open)
      - check in flight
    criteria:
      - id: global.version-check.c1
        text: "GET /version/check runs at start and on every return to the foreground; while it is in flight the app is shown (fail open); any failure counts as stable."
        fish_ref: "components/VersionWrapper.tsx:133-146,148-188,207-213"
      - id: global.version-check.c2
        text: "update_available shows „🎉 Versiune nouă disponibilă” with „Actualizare” and „Sari peste”; skip is remembered for that app version."
        fish_ref: "components/VersionWrapper.tsx:26-35,113-120,164-170,190-195"
      - id: global.version-check.c3
        text: "unsupported shows „👇 Actualizare necesară” with only „Actualizare” (blocking)."
        fish_ref: "components/VersionWrapper.tsx:36-45,214-218"
      - id: global.version-check.c4
        text: "„Actualizare” opens the store listing and logs update_app_ios_clicked / update_app_android_clicked."
        fish_ref: "components/VersionWrapper.tsx:197-205"
    mobile_only: true
    web_replacement: "None: the web is always the deployed version, so there is no update wall. The web transport sends x-app-platform: web, which the CMS must never treat as an outdated app (contract to keep, see global.b.api-headers)."
    status: todo

  - id: global.push
    title: Notificări push
    fish:
      - contexts/NotificationsContextProvider.tsx
      - helpers/notificationPressDedup.ts
      - helpers/notifications/getNotificationPresentation.ts
      - helpers/getRedirectLocationForNotification.ts
      - services/api/push-tokens.ts
      - features/chat/domain/pushPresentation.ts
      - features/chat/push/chatPush.ts
      - constants/notifications.ts
    web_route: none
    template: none
    milestone: M2
    roles: [angler, organizer, referee, operator]
    core: [social.getRedirectLocationForNotification, social.markNotificationAsReadMutation]
    states:
      - signed out (no registration)
      - permission granted / denied
      - simulator (no FCM, silent)
      - foreground push
      - background tap
      - cold-start tap
      - duplicate delivery of one tap
    criteria:
      - id: global.push.c1
        text: "Only when signed in and without a token yet: Android channels are created, permission is requested, the FCM token is fetched and registered (createPushToken)."
        fish_ref: "contexts/NotificationsContextProvider.tsx:62-127,248-270,350-353"
      - id: global.push.c2
        text: "A push received in the foreground invalidates notification queries (and competitions/competition/rankings for competition types, news for NEWS) and is re-presented as a local notification; chat pushes for the room already open are not presented."
        fish_ref: "contexts/NotificationsContextProvider.tsx:274-321"
      - id: global.push.c3
        text: "Taps from background, foreground-presented and cold start all go through one handler; the same payload within 1.5 s is ignored as a duplicate delivery."
        fish_ref: "contexts/NotificationsContextProvider.tsx:147-155,323-337,356-372; helpers/notificationPressDedup.ts:20-32"
      - id: global.push.c4
        text: "Rod-alarm and partida-rod local notifications route to the timer / the partidă without the server mapper."
        fish_ref: "contexts/NotificationsContextProvider.tsx:157-177"
      - id: global.push.c5
        text: "A tap logs notification_clicked_from_badge (type, notificationId, redirect_url) and marks the notification read unless it is a chat push."
        fish_ref: "contexts/NotificationsContextProvider.tsx:237-245"
    mobile_only: true
    web_replacement: "In-app notifications only: /notificari list + unread dot in the top bar (account.notifications, account.b.unread-badge). A list tap routes through the same mapper (global.b.notification-routes-web) and marks read. Web push is a later option (ROADMAP §3)."
    status: todo

behaviours:
  - id: global.b.guest-browsing
    text: "Nothing is auth-gated at the layout level: guests can open every public page; screens that need a user gate themselves (Redirect to sign-in, a sign-in prompt, or a disabled query). On web, per-user pages redirect to /intra?next=<path>, public pages render their guest variant (see account.b.signed-out-gate)."
    fish_ref: "app/(app)/_layout.tsx:42-48; app/(app)/(tabs)/profile.tsx:9-15; app/(app)/partide/join/[code].tsx:27-31"
  - id: global.b.session-loading-gate
    text: "Until the stored session is read, the (app) area renders only a spinner, so no screen decides signed-in vs signed-out on a not-yet-known session. Web: the viewer is resolved server-side from the session cookie before rendering."
    fish_ref: "app/(app)/_layout.tsx:31-40"
  - id: global.b.session-expired
    text: "Session expiry on web: the first ApiError with code SESSION_DEAD (401 „Missing or invalid credentials” / „Invalid credentials”) clears the session cookie once, sends the user to /intra?next=<current path> and shows the error toast „Sesiunea ta a expirat. Te rugăm să te autentifici din nou.”; further 401/403 in the same burst (60 s) do nothing and are not reported. A 401 with a bluCode is a handled error, not a dead session. The JWT has no refresh (1 year). Detail: account.b.session-expired."
    fish_ref: "services/api/api.ts:55-124,141-157; contexts/auth/AuthContext.tsx:257-307"
  - id: global.b.sign-out-failure
    text: "If any sign-out step throws, the session is still cleared and the error toast „A aparut o problema. Te rugăm să încerci mai târziu.” is shown (fish copy lacks diacritics in „aparut o problema” — web uses „A apărut o problemă. Te rugăm să încerci mai târziu.”, flagged as a copy fix)."
    fish_ref: "contexts/auth/AuthContext.tsx:291-295"
  - id: global.b.api-headers
    text: "Every CMS request carries Authorization: Bearer <jwt> when signed in, x-app-version and x-app-platform (fish: ios/android; web: web); the request timeout is 45 s. A direct public browser GET stays a CORS simple request (no x-app-* headers); per-user calls go through the web proxy, which adds them."
    fish_ref: "services/api/api.ts:26-53"
  - id: global.b.error-normalisation
    text: "Every failed request rejects with { message, status, code, bluCode?, details? }: a bluCode response keeps the server message and details (handled by the screen); everything else gets the generic message „A apărut o eroare necunoscută. Te rugăm să reîncerci mai târziu.”. Web equivalent: core/transport ApiError."
    fish_ref: "services/api/api.ts:12-24,141-149,175-185"
  - id: global.b.focus-refetch
    text: "Returning to the app invalidates every query (fish AppState active → invalidateQueries()). Web: refetch on window focus / visibilitychange for queries that do not opt out (queries that set refetchOnWindowFocus: false keep it off, as in fish)."
    fish_ref: "app/_layout.tsx:58-64; hooks/useAppState.ts:12-43"
  - id: global.b.reconnect-refetch
    text: "Losing connectivity pauses requests (onlineManager offline); regaining it, or the probe returning to ok, refetches every active query."
    fish_ref: "contexts/NetInfoContextProvider.tsx:169-178,218-227"
  - id: global.b.nav-guard
    text: "Only one forward navigation per 800 ms is accepted app-wide (push/navigate); replace is never gated (redirects, sign-out); back/dismiss end the window. Web: links and programmatic router.push from cards/buttons must not double-push on a double click."
    fish_ref: "hooks/useNavigationGuard.ts:4-23,63-99; app/(app)/_layout.tsx:13-17"
  - id: global.b.deep-link-scheme
    text: "The app answers the custom scheme bluvi:// and universal/app links on https://bluvi-app.wearetribus.com for the path prefixes /competitions, /lakes, /polls and /partide (Android intent filters with autoVerify; iOS associatedDomains + AASA paths /competitions/*, /lakes/*, /polls/*, /partide/*). Any other path on that host falls through to the redirect-stores site, which sends the visitor to the store (catch-all SmartStoreRedirect). Web (M8): the same host/paths must keep opening the app on phones and open the web page elsewhere."
    fish_ref: "app.json:8,33-35,63-124; ../bluvi-redirect-stores/public/.well-known/apple-app-site-association.json; ../bluvi-redirect-stores/src/App.tsx:27-40"
  - id: global.b.legacy-path-redirects
    text: "Every URL the app has ever shared or a push can target must resolve on web (permanent redirect to the Romanian route, query preserved where meaningful, timestamp dropped): /competitions/{id} → /concursuri/{id}; ?activeTabId=clasament → /concursuri/{id}/clasament; =participanti → /participanti (participantsFilter=pending → ?filtru=in-asteptare); =extracantare → /extra-cantare; =informatii → /informatii; =regulament → /regulament; ?openWeighingSheet=1&standId&weighingId → /concursuri/{id}/cantare?cantar={weighingId}&stand={standId}; /competitions/{id}/chat?tab= → /concursuri/{id}/chat?camera=; /lakes/{id} → /balti/{id}; /lakes/{id}/reviews → /balti/{id}/recenzii; /polls/current → /sondaje; /partide/join/{code} → /partide/intra/{code}; /partide/comunitate/{documentId} → /partide/{documentId}; /partide/comunitate/capturi/{documentId} → /partide/{documentId}/capturi; /anglers/{documentId} → /pescari/{documentId}; /news/{id} → /stiri/{id}; /bookings/{id} → /rezervari/{id}; /operator/{lakeId}/bookings?status= → /operator/{lakeId}/rezervari?status=; /organizer → /organizator; /penalties/{competitionId} → /concursuri/{competitionId}/penalizari. Unknown ids render a not-found state, never a blank page."
    fish_ref: "helpers/getRedirectLocationForNotification.ts:30-193; common/utils/competitionRoutes.ts:1-7; app.json:63-124"
  - id: global.b.share-urls
    text: "Links the app shares are built on WEB_DOMAIN (https://bluvi-app.wearetribus.com): competition /competitions/{id}, lake /lakes/{documentId}, poll /polls/current, partidă join /partide/join/{code}, partidă spectate /partide/comunitate/{documentId}. Web share actions build absolute web URLs with lib/routes absoluteUrl(); until the domain decision (M8) both URL shapes must resolve (global.b.legacy-path-redirects)."
    fish_ref: "common/utils/constants.ts:35; app/(app)/competitions/[competitionId].tsx:324-325; features/lakes/components/ShareLakeSheet.tsx:118; helpers/sharePoll.ts:5; features/partide/components/CoopCard.tsx:38-39; features/partide/helpers/deepLinks.ts:19-20"
  - id: global.b.unmatched-route
    text: "fish has no not-found route: an unmatched link renders a black page, which is why every notification/link target must exist in all app versions. Web: any unmatched path inside the site renders „Pagina nu există” inside the shell with a link home, with HTTP 404 or noindex (app/(site)/[...rest] → not-found.tsx)."
    fish_ref: "app/_layout.tsx:95; ../bluvi-redirect-stores/src/App.tsx:34-40"
  - id: global.b.notification-routes-web
    text: "Notification type → web route (same rules and same null cases as fish; a missing required id means no navigation): COMPETITION_NEW_REGISTRATION_USER/TEAM, NEW_REJECTION_TEAM/USER, PENDING_USER, REGISTRATION_MODIFIED_PARTICIPANT, START, FOLLOW_COMPETITION_START, NEW_COMPETITIONS with id → /concursuri/{competitionId}; COMPETITION_END, ROUND_END, FOLLOW_COMPETITION_END/PODIUM → /concursuri/{id}/clasament; NEW_REGISTRATION_ORGANIZER → /concursuri/{id}/participanti?filtru=in-asteptare; PARTICIPANTS_ALLOCATION, ROUND_START, NEW_CANCELLATION_ORGANIZER, REGISTRATION_MODIFIED_ORGANIZER, FOLLOW_COMPETITION_REGISTERED/DIGEST → /concursuri/{id}/participanti; WEIGHING_MODIFIED/END (needs sectorName, standName, standId, weighingId — weighihngId accepted as legacy spelling) → /concursuri/{id}/cantare?cantar={weighingId}&stand={standId}; EXTRA_WEIGHT_REQUEST → /concursuri/{id}/extra-cantare; CHAT_MESSAGE → /concursuri/{id}/chat?camera={tab|chatRoom|general}; PENALTY → /concursuri/{id}/penalizari; POLL_OPENED/CLOSED/SUGGESTION_APPROVED → /sondaje; NEWS → /stiri/{newsId}; NEW_LAKES → /balti; NEW_FOLLOWER → /pescari/{followerDocumentId}; PARTIDA_INVITE → /partide/intra/{partidaCode}; PARTIDA_FINISHED, PARTIDA_AUTO_CLOSE_WARN → own partidă by client sessionId (route owned by partide area); PARTIDA_CATCH, PARTIDA_FINISHED_FOLLOWED, FOLLOW_PARTIDA_START/FIRST_CATCH → /partide/{sessionDocumentId}; FOLLOW_RECORD_PERSONAL/LAKE → /partide/{sessionDocumentId}/capturi; FOLLOW_LAKE_REVIEW → /balti/{lakeId}/recenzii; COMPETITION_AUTO_CANCELLED_ORGANIZER → /organizator; BOOKING_*_ANGLER → /rezervari/{bookingId}; BOOKING_NEW_REQUEST_OPERATOR, PENDING_NUDGE_OPERATOR → /operator/{lakeId}/rezervari?status=pending; AUTO_REJECTED_OPERATOR → ?status=rejected; CANCELLED_OPERATOR → ?status=cancelled; NEW_COMPETITIONS without id, COMPETITIONS_DIGEST → /concursuri; SCHEDULED_NOTIFICATION, COMPETITION_CANCELLED_USER, unknown → none. One pure function in core/social/domain builds these from lib/routes."
    fish_ref: "helpers/getRedirectLocationForNotification.ts:30-193; contexts/NotificationsContextProvider.tsx:54-58"
  - id: global.b.notification-same-page
    text: "Opening a notification whose target is the page already shown still acts: fish appends a timestamp so the same route re-navigates; a weighing notification for the competition already open opens that weighing in place; a chat notification for the chat already open switches the room in place instead of stacking another chat. Web: same URL → refetch + open the target in place, never a duplicate history entry."
    fish_ref: "helpers/getRedirectLocationForNotification.ts:31-32; contexts/NotificationsContextProvider.tsx:188-223"
  - id: global.b.notification-tap-invalidation
    text: "Opening a NEWS notification invalidates the news cache; opening any competition-type notification invalidates the competitions and competition caches, so the target page shows fresh data."
    fish_ref: "contexts/NotificationsContextProvider.tsx:179-186"
  - id: global.b.firebase-bridge
    text: "With a session but no Firebase user (cold start, revoked token), a Firebase custom token is re-minted once per session value and signed in, non-fatally — needed for chat and live partide. Web: lib/client/firebase signs in from /firebase-token after the session is known."
    fish_ref: "contexts/auth/AuthContext.tsx:109-132"
  - id: global.b.partide-live-mount
    text: "For a signed-in user one live-partidă subscription is mounted once for the whole app (hydrated from the active-session pointer, Firestore listener on the active session, detached on sign-out), so every page knows about the running partidă. Web: mounted once in the shell for signed-in viewers (partide area owns the details)."
    fish_ref: "app/(app)/_layout.tsx:19-29,52; features/partide/domain/useLiveMount.ts:1-17"
  - id: global.b.chat-outbox
    text: "The chat outbox is drained at start, whenever the device comes back online and on return to the foreground; it is discarded on sign-out so nothing uploads under the next account. Web: drained on load/online/visibility (chat area owns it)."
    fish_ref: "features/chat/outbox/ChatOutboxMount.tsx:7-31; app/(app)/_layout.tsx:53; contexts/auth/AuthContext.tsx:269-272"
  - id: global.b.capture-spam-guard
    text: "One app-wide host shows the „ești sigur?” soft confirmation when a capture is started less than 30 s after the previous one on the same rod bucket; confirming continues to the capture and records a spam signal, cancelling clears it. Web: one host in the shell (partide area owns the flow)."
    fish_ref: "features/partide/components/CaptureSpamGuardHost.tsx:1-12,25-38; app/(app)/_layout.tsx:54"
  - id: global.b.observability
    text: "Errors are reported to Sentry only on production/staging; the user is identified from the stored JWT's id before any request (tag session.state = none|valid|expired|unreadable); the Authorization header is never attached to events; API errors are tagged api_url + api_status and deduped per (status, endpoint) per session. Web: M8 (Sentry)."
    fish_ref: "app/_layout.tsx:35-51; contexts/auth/AuthContext.tsx:80-105; services/api/api.ts:86-95,158-172"
  - id: global.b.screen-view-analytics
    text: "Exactly one screen_view per (pathname, route pattern): navigating between two lakes logs twice, re-rendering the same route logs once; entity ids from the params are attached. Web: GA4 page_view with the same dedupe, after consent (M8)."
    fish_ref: "analytics/ScreenViewTracker.tsx:7-58"
  - id: global.b.mobile-only-bits
    text: "Not ported (mobile only): native splash + animated loader, status bar style / Android edge-to-edge, keyboard provider, bottom-sheet/portal providers, gesture root, timer bootstrap and rod alarms (useTimerBootstrap), Android notification channels, push token registration, app version wall, CMP SDK provider (web: cookie banner, M8), Reanimated logger."
    fish_ref: "app/_layout.tsx:27-28,53-56,65,68-107"
