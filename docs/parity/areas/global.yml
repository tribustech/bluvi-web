  # SEO (web only: fish has no crawlable pages; its only public URLs are the share links on
  # WEB_DOMAIN, global.b.share-urls). Proof: tests/e2e/seo.spec.ts (criteria ids in the test names),
  # tests/unit/seo-json-ld.test.ts, tests/unit/seo-robots.test.ts, lib/server/sitemap-entries.test.ts.
  - id: global.b.seo-sitemap
    text: >-
      Web only. /sitemap.xml is a sitemap index (app/sitemap.xml/route.ts) of sitemaps split by group
      (app/sitemaps/sitemap.ts generateSitemaps: pagini, balti-<n>, concursuri-viitoare / -live /
      -rezultate, ape-publice-<n>; each ≤ 45 000 URLs), built from the same cached public CMS reads as
      the pages ('use cache' + CMS tags) with the MAX_PAGES guard.
      s1 the index lists every sitemap; each is a valid <urlset> of ≤ 50 000 unique URLs without a query string.
      s2 it lists the list pages, every lake, competition, news article, sponsor and public water, and
      the self-canonical subpages that have content: lake /galerie (photos or catches), /capturi
      (catches), /partide (catches, partide this month or finished partide on record), /statistici
      (partide this month), /clasament (ranked anglers), /standuri (stand rows), /concursuri (a
      competition of any status at the lake: the bare page opens Live, else the first tab with
      competitions; its ItemList url is the bare path), /recenzii (reviews), /harta (coordinates);
      competition /informatii, /participanti (someone registered), /regulament (a regulation),
      /cantare and /capturi (started or completed); public water /harta (not claimed) and, with a
      linkCode, the community subpages by the SAME rules as a lake's (/partide, /statistici,
      /clasament, /capturi — read per water only for the waters with a partida in the community
      history, bounded concurrency); a claimed water's page and map (redirects to its lake) are left out.
      The predicates are shared with the subpages' metadata (sitemap-entries venueSubpageHas /
      lakeSubpageHas): a subpage the sitemap leaves out for lack of content is noindex (m5).
      s3 never listed: noindex pages (competition /statistici, /extra-cantare, /clasament/imagine,
      /statistici/cronologie, a tab or venue subpage without content) and aliases
      (/concursuri/<id>/clasament, period / sort / tab / photo params).
      s4 a list or per-item read that fails leaves its URLs out, never guessed in; the rest is served.
      A failed claimed-waters read leaves out the page and map of every linkCode water (any may
      redirect); a failed history walk lists no water community subpage.
      s5 robots.txt disallows everything unless SITE_INDEXABLE=1; then it allows / except /api/ and names /sitemap.xml.
      lastModified: only news (createdAt) — the lake, competition and sponsor DTOs carry no updatedAt.
    fish_ref: common/utils/constants.ts:35
    status: passing
  - id: global.b.seo-json-ld
    text: >-
      Web only. Every public M1 page carries schema.org JSON-LD built with lib/json-ld.ts (jsonLdHtml
      escapes «<») and never says more than the page shows (rule 4).
      j1 every block parses and has the schema.org context.
      j2 every detail / subpage has a BreadcrumbList whose last step is the page (its `item` is the
      page's path) and whose labels are the visible breadcrumb band's (one label per subpage, as
      its H1 and <title> name it: lake «Clasament», «Clasament standuri»; competition /cantare
      «Cântare», /capturi «Toți peștii», /statistici «Statistici»).
      j3 generated values never say «capot» (UI: «fără captură»).
      j4 lake and public-water Statistici / Clasament / Standuri: CollectionPage about the venue with the
      ranked rows on screen as an ItemList (none for an empty period); Partide: CollectionPage;
      Hartă: Map about the place (coordinates when known); lake Recenzii: the lake with an
      AggregateRating (mean of the three shown scores) and the listed reviews, only when it has
      reviews; Galerie / Capturi: ImageGallery; competition pages and tabs: SportsEvent + BreadcrumbList.
    fish_ref: common/utils/constants.ts:35
    status: passing
  - id: global.b.seo-metadata
    text: >-
      Web only. Every public page has a Romanian title and description (diacritics), a self canonical
      without view params, Open Graph url / siteName «Bluvi» / locale ro_RO and twitter.card
      summary_large_image. Share images come from the routes' opengraph-image / twitter-image files
      (global.seo-og), so subpage metadata sets no image keys.
      m1 title + description; m2 og:url = canonical, og:site_name, og:locale, twitter:card;
      m3 canonical = the bare path (?perioada, ?sortare, ?tab, ?foto ignored);
      m4 a page the sitemap lists is indexable (no noindex);
      m5 noindex, follow: competition Statistici (signed-in only), Extra Cântare (at every stage: a
      utility list read in the browser), Regulament without a regulation, Participanți with nobody
      registered; a lake / public-water subpage without content (the sitemap's predicates, s2: no
      reviews, no coordinates, nothing in the month's stats / catches / history); a read that
      fails is «not known» and never noindexes. Before the start /cantare and /capturi show the
      preview and canonicalise to /concursuri/<id>. Descriptions: counts via formatCount, the
      venue named as the title names it, the reviews score = the AggregateRating (mean of the
      three scores, one decimal).
    fish_ref: common/utils/constants.ts:35
    status: passing
