        fish_ref: "components/SplashGate/SplashGate.tsx:74-80"
      - id: global.loading.c3
        text: "The start overlay waits for the session, the version check and the first screen's ready signal, but never longer than 3 s; after the ceiling the app is shown regardless (web: a slow CMS never keeps the whole page blank — the shell paints and the slow section streams in later)."
        fish_ref: "components/SplashGate/SplashGate.tsx:12,29,32-35"
      - id: global.loading.c4
        text: "The overlay plays at least its 400 ms intro and then fades out in 180 ms; it blocks touches while visible (web: no splash; loading placeholders use the kit skeletons and respect prefers-reduced-motion)."
        fish_ref: "components/SplashGate/SplashGate.tsx:11,13,40-65"
      - id: global.loading.c5
        text: "The spinner uses the brand accent (indigo5) and is centered in the available area."
