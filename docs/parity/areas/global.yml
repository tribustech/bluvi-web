      - root-level error (shell itself failed)
      - error reported, reference code available
      - reference code not available (reporting disabled / failed)
    criteria:
      - id: global.app-error.c1
        text: "A render error shows the title „Ceva n-a mers” as the page heading."
        fish_ref: "components/errors/AppErrorFallback.tsx:38"
      - id: global.app-error.c2
        text: "Under it the text „A apărut o problemă neașteptată pe acest ecran. Am trimis automat detaliile către echipă.” is shown."
        fish_ref: "components/errors/AppErrorFallback.tsx:39-41"
      - id: global.app-error.c3
        text: "A „Reîncearcă” button is shown when the boundary can retry; activating it re-renders the failed subtree (web: reset())."
        fish_ref: "components/errors/AppErrorFallback.tsx:43-51; components/errors/RouteErrorBoundary.tsx:16-18"
      - id: global.app-error.c4
        text: "When the error was reported, „Cod: ” followed by the first 8 characters of the error event id is shown under the button (web: Next error digest or Sentry event id)."
        fish_ref: "components/errors/AppErrorFallback.tsx:53-55"
      - id: global.app-error.c5
        text: "Each error is reported exactly once, tagged with where the boundary sits (error_boundary = root | route); the root boundary, which already reported, does not report a second time."
        fish_ref: "components/errors/AppErrorFallback.tsx:30-34; app/_layout.tsx:79-83"
      - id: global.app-error.c6
        text: "A route-level error keeps the shell (top bar) usable; only a failure of the shell itself falls back to the root fallback."
        fish_ref: "components/errors/RouteErrorBoundary.tsx:8-11; app/_layout.tsx:73-78"
      - id: global.app-error.c7
        text: "The root fallback renders without the providers, queries, profile or theme machinery that could have crashed (web: global-error.tsx is self-contained, with its own <html>/<body> and only token CSS)."
        fish_ref: "components/errors/AppErrorFallback.tsx:5-14"
      - id: global.app-error.c8
        text: "The retry control is a real button (role button, keyboard operable, visible focus)."
        fish_ref: "components/errors/AppErrorFallback.tsx:44-48"
      - id: global.app-error.c9
        text: "The fallback content is centered with the heading, text and button stacked; it is never a blank page."
        fish_ref: "components/errors/AppErrorFallback.tsx:60-73"
    mobile_only: false
    status: todo

  - id: global.error-screen
    title: Ecran de eroare (date)
    fish:
      - components/ErrorScreen.tsx
      - helpers/errors/describeError.ts
      - services/api/api.ts
      - contexts/NetInfoContextProvider.tsx
      - components/BackButton.tsx
    web_route: "/** (kit ErrorState used by every page whose data failed)"
    template: none
    milestone: M0
    roles: [guest, angler, organizer, referee, operator]
    core: [transport.ApiError, transport.isApiError]
    states:
      - offline / no response
      - server error (5xx)
      - session rejected (401)
      - forbidden (403)
      - not found (404)
      - refused with server message (400)
      - other 4xx with server message
      - unknown
      - unknown while connection probe says serverDown / offline / poor
      - with back control / without
    criteria:
      - id: global.error-screen.c1
        text: "No response at all (network error, timeout, offline code) shows „Nu putem ajunge la server” / „Verifică conexiunea la internet și încearcă din nou.” with a retry."
        fish_ref: "helpers/errors/describeError.ts:47-49,102-126,180-181"
      - id: global.error-screen.c2
        text: "A 5xx shows „Serverul nu răspunde” / „Lucrăm la asta. Încearcă din nou în câteva minute.” with a retry."
        fish_ref: "helpers/errors/describeError.ts:128-134,184"
      - id: global.error-screen.c3
        text: "A 401 shows „Sesiunea a expirat” / „Autentifică-te din nou ca să continui.” with NO retry and a „Deconectează-te” button that signs out."
        fish_ref: "helpers/errors/describeError.ts:136-142,185; components/ErrorScreen.tsx:57"
      - id: global.error-screen.c4
        text: "A 403 shows „Nu ai acces” / „Contul tău nu are drepturi pentru aceste date.” with a retry and never offers sign-out."
        fish_ref: "helpers/errors/describeError.ts:10-13,144-150,186"
      - id: global.error-screen.c5
        text: "A 404 shows „Nu am găsit datele” / „Poate au fost șterse între timp.” with a retry."
        fish_ref: "helpers/errors/describeError.ts:152-158,187"
      - id: global.error-screen.c6
        text: "A 400 that carries a readable server message shows „A apărut o eroare” with that message and NO retry."
        fish_ref: "helpers/errors/describeError.ts:191-197"
      - id: global.error-screen.c7
        text: "Any other 4xx shows the server's own message when it wrote one (keeping the retry); otherwise „A apărut o eroare” / „Încearcă din nou. Dacă persistă, scrie-ne.” with a retry."
        fish_ref: "helpers/errors/describeError.ts:160-166,199-203"
      - id: global.error-screen.c8
        text: "The generic transport message „A apărut o eroare necunoscută. Te rugăm să reîncerci mai târziu.” and code-like messages (e.g. INVALID_STATUS) are never shown as the server's message."
        fish_ref: "helpers/errors/describeError.ts:40-52,93-100; services/api/api.ts:175-185"
      - id: global.error-screen.c9
        text: "An error wrapped as the cause of another error is diagnosed from the innermost cause that carries status/code/bluCode (max 5 levels)."
        fish_ref: "helpers/errors/describeError.ts:60-77"
      - id: global.error-screen.c10
        text: "When the error itself is unknown but the connection probe says serverDown the server copy (c2) is shown; offline or poor shows the offline copy (c1)."
        fish_ref: "helpers/errors/describeError.ts:206-220; components/ErrorScreen.tsx:41-42"
      - id: global.error-screen.c11
        text: "The retry button reads „Încearcă din nou” and refetches the failed query only."
        fish_ref: "components/ErrorScreen.tsx:56"
      - id: global.error-screen.c12
        text: "A warning icon in the danger color sits above the title; the title is a heading and the message sits under it, all centered."
        fish_ref: "components/ErrorScreen.tsx:47-54"
      - id: global.error-screen.c13
        text: "A back control is shown above the error unless the page opts out (goBack=false) — on web: a page-level error inside a detail page keeps its back link."
        fish_ref: "components/ErrorScreen.tsx:26,46"
      - id: global.error-screen.c14
        text: "A string, null, undefined or plain Error never crashes the error state; it shows the unknown copy (or offline copy if the text looks like a network failure)."
        fish_ref: "helpers/errors/describeError.ts:168-176"
    mobile_only: false
    status: todo

  - id: global.network-banner
    title: Stare conexiune
    fish:
      - contexts/NetInfoContextProvider.tsx
      - helpers/network/connectionQuality.ts
      - helpers/network/probeConnection.ts
      - hooks/useAppState.ts
    web_route: "/** (shell)"
    template: none
    milestone: M0
    roles: [guest, angler, organizer, referee, operator]
    core: []
    states:
      - ok (no banner)
      - offline (radio down, or probe internet down)
      - poor (internet slow, or API slow)
      - serverDown (internet ok, API down)
      - first bad reading awaiting confirmation (no banner yet)
      - recovered (banner leaves, data refetched)
    criteria:
      - id: global.network-banner.c1
        text: "Offline shows the danger-colored banner „Nu ești conectat la internet.” in white text."
        fish_ref: "helpers/network/connectionQuality.ts:52-53; contexts/NetInfoContextProvider.tsx:70-72,86"
      - id: global.network-banner.c2
        text: "Poor connection shows the warning (amber) banner „Conexiune slabă la internet.” with dark text."
        fish_ref: "helpers/network/connectionQuality.ts:54; contexts/NetInfoContextProvider.tsx:72,86"
      - id: global.network-banner.c3
        text: "Internet ok but the API down shows the warning banner „Serverul nu răspunde momentan.”."
        fish_ref: "helpers/network/connectionQuality.ts:35,55"
      - id: global.network-banner.c4
        text: "With quality ok no banner is rendered at all."
        fish_ref: "helpers/network/connectionQuality.ts:38,56"
      - id: global.network-banner.c5
        text: "Quality is derived as: disconnected → offline; no probe yet → ok; probe internet down → offline; internet slow → poor; API down → serverDown; API slow → poor; otherwise ok. An unknown connection state counts as connected."
        fish_ref: "helpers/network/connectionQuality.ts:24-39"
      - id: global.network-banner.c6
        text: "The probe checks two targets in parallel: HEAD https://www.gstatic.com/generate_204 (internet) and GET <CMS root>/_health (API, the /api suffix stripped), both with Cache-Control: no-cache and outside the authenticated transport (no token, no error reporting)."
        fish_ref: "helpers/network/probeConnection.ts:36,47-56,77-82,102-113"
      - id: global.network-banner.c7
        text: "A target answering 2xx in more than 1500 ms is slow; a 4 s timeout counts as slow; a non-2xx or a network/DNS/TLS failure counts as down."
        fish_ref: "helpers/network/probeConnection.ts:37-40,85-96"
      - id: global.network-banner.c8
        text: "The first bad reading after a good state is not shown: it is re-measured after 4 s and the banner appears only if the second reading is also bad."
        fish_ref: "contexts/NetInfoContextProvider.tsx:49-52,125-140"
      - id: global.network-banner.c9
        text: "Probes are triggered on mount, on connectivity change to connected and on return to the foreground (delayed 2 s); triggers less than 3 s apart collapse into one, no probe starts while one is running, and none runs while disconnected."
        fish_ref: "contexts/NetInfoContextProvider.tsx:42-48,158-200"
      - id: global.network-banner.c10
        text: "While quality is not ok a probe re-runs every 30 s; the interval stops as soon as quality returns to ok."
        fish_ref: "contexts/NetInfoContextProvider.tsx:44-45,211-216"
      - id: global.network-banner.c11
        text: "Going offline marks the query layer offline (no requests fire); when quality returns to ok from any bad state, every active query is refetched so pages stuck on an error state recover by themselves."
        fish_ref: "contexts/NetInfoContextProvider.tsx:169-178,218-227"
      - id: global.network-banner.c12
        text: "Going to the background cancels a pending confirmation re-measure (web: page hidden), so it never fires on stale sockets at return."
        fish_ref: "contexts/NetInfoContextProvider.tsx:187-194"
      - id: global.network-banner.c13
        text: "The banner enters with a short fade/slide (260 ms) and leaves with a fade (200 ms), anchored at the bottom of the viewport, and its height is exposed so bottom actions are padded above it (web: announced politely via role=status; no motion under prefers-reduced-motion)."
        fish_ref: "contexts/NetInfoContextProvider.tsx:20-24,231-252"
    mobile_only: false
    status: todo

