    text: "Web only (ROADMAP §5, §9). The top public pages (/, /balti, /balti/[id], /balti/harta, /concursuri, /concursuri/[id], /concursuri/[id]/clasament, /ape-publice, /stiri, /stiri/[id], /partide, /partide/[id]) meet the Lighthouse mobile budget on the production build (lighthouserc.json: LCP < 2.5 s, CLS < 0.05, TBT < 200 ms, median of 3 simulated runs). p1 Suspense boundaries are revealed on the next frame, not throttled 300 ms after the shell; p2 only the upright font face is preloaded; p3 /balti on a phone does not shift when the location permission is read, its first rail's photos load first and the hidden desktop grid's photos are not fetched; p4 the /balti/harta list's first photo loads eagerly; no map, editor, Firebase or GIF library in a non-map page's first load."
