# Parity inventory — area "global": the app frame and everything cross-cutting that is not one
# screen. Root layout (providers, error boundary, splash, toasts, network banner, version check),
# the (app) group layout (session-loading gate, navigation guard, live mounts), the tab bar layout
# (→ web top bar), the root index redirect, deep links, notification → route mapping, auth gating,
# session expiry and push.
# Extracted from fish (read-only) on 2026-10-04. Line refs are fish file:line at that date.
#
# Overlap, on purpose: account.yml already inventories sign-in, sign-out, session expiry and the
# notification → fish-route map (account.b.*). Here the same facts are restated only where the web
# needs something extra — the web route each fish target becomes, the legacy-URL redirects, and the
# app-wide frame. app/(app)/(tabs)/index.tsx (Acasă) is inventoried in home.yml (home.acasa).
#
# Web routes for areas not yet inventoried (polls, partide, organizer, operator, penalties, chat)
# are PROPOSALS in the lib/routes.ts style; the owning area file wins when it lands.
area: global
screens:
  - id: global.shell
    title: Bara de navigare
    fish:
      - app/(app)/(tabs)/_layout.tsx
      - app/(app)/_layout.tsx
      - app/_layout.tsx
      - app/(app)/(tabs)/profile.tsx
      - features/partide/domain/viewAtoms.ts
      - features/partide/domain/nouBadge.ts
      - services/queries/useProfile.ts
      - helpers/getImageFormat.tsx
      - hooks/useNavigationGuard.ts
      - contexts/auth/AuthContext.tsx
      - contexts/NetInfoContextProvider.tsx
      - components/errors/RouteErrorBoundary.tsx
    web_route: "/** (layout: app/(site)/layout.tsx → _shell/SiteTopBar.tsx)"
    template: none
    milestone: M0
    roles: [guest, angler, organizer, referee, operator]
    core: [social.profileQuery, social.getProfile, social.unreadNotificationsCountQuery, booking.ownedLakesQuery]
    states:
      - signed out (no avatar entry, „Intră” instead)
      - signed in, profile has avatar
      - signed in, profile without avatar (Bluvi logo fallback)
      - signed in, profile still loading
      - organizer (Administrare menu)
      - operator of at least one lake (Administrare menu)
      - organizer and operator
      - unread notifications > 0
      - phone width, menu panel closed / open
      - current route is one of the main destinations (active state)
      - current route is a nested page (no main destination active, or its parent active)
      - network banner visible
      - page below throws (shell must survive)
    criteria:
      - id: global.shell.c1
        text: "The main destinations are, in this order, Acasă, Bălți, Competiții, Partide (fish tab order index → lakes → competitions → partide); on desktop they are links in the top bar, on phone they are in the ☰ panel."
        fish_ref: "app/(app)/(tabs)/_layout.tsx:45-95"
      - id: global.shell.c2
        text: "The destination labels are exactly „Acasă”, „Bălți”, „Competiții”, „Partide” and „Profil” (with diacritics)."
        fish_ref: "app/(app)/(tabs)/_layout.tsx:51,62,73,93,101"
      - id: global.shell.c3
        text: "Acasă links to /, Bălți to /balti, Competiții to /concursuri, Partide to /partide (lib/routes.ts)."
        fish_ref: "app/(app)/(tabs)/_layout.tsx:46,56,67,77"
      - id: global.shell.c4
        text: "The destination of the current route is marked active with the accent color (fish tint indigo5) and exposes aria-current=\"page\"; the others are not marked."
        fish_ref: "app/(app)/(tabs)/_layout.tsx:28"
      - id: global.shell.c5
        text: "The profile entry (avatar) exists only for a signed-in user; signed out it is absent (fish href: null), and the top bar offers „Intră” → /intra instead."
        fish_ref: "app/(app)/(tabs)/_layout.tsx:17,99"
      - id: global.shell.c6
        text: "The avatar shows the profile avatar in its thumb format; when the profile has no avatar (or is still loading) it shows the Bluvi logo; it is round."
        fish_ref: "app/(app)/(tabs)/_layout.tsx:19,110-123"
      - id: global.shell.c7
        text: "While the current route is the own profile (/profil) the avatar carries an accent ring; elsewhere it has none."
        fish_ref: "app/(app)/(tabs)/_layout.tsx:108,120-121"
      - id: global.shell.c8
        text: "Activating the avatar opens /profil (the own angler profile in own mode); /profil visited signed out renders nothing personal and goes to sign-in (fish: profile tab is unreachable signed out and null-renders as a fallback)."
        fish_ref: "app/(app)/(tabs)/profile.tsx:7-17"
      - id: global.shell.c9
        text: "The Partide „NOU” pill shows only before 2026-09-18T00:00Z and only for a user who never opened Partide; while the visited flag is unknown no pill renders (no flash). Since the deadline has passed the web never shows it — the criterion is that it is NOT rendered."
        fish_ref: "features/partide/domain/nouBadge.ts:3,13-18; features/partide/domain/viewAtoms.ts:66-87; app/(app)/(tabs)/_layout.tsx:22,83-89"
      - id: global.shell.c10
        text: "Destination labels never truncate or wrap at any width or at 200% text zoom (fish locked tab label scaling because „Competiții” was cut to „Competi…”)."
        fish_ref: "app/(app)/(tabs)/_layout.tsx:30-34"
      - id: global.shell.c11
        text: "The notifications entry is shown to signed-in users with an unread dot when the unread count is > 0 (see account.b.unread-badge); signed out it is not shown."
        fish_ref: "app/(app)/(tabs)/index.tsx:180-184,392-404"
      - id: global.shell.c12
        text: "An „Administrare” menu is shown only to organizers (profile role name „Organizer” → /organizator) and to operators (non-empty /feed/owned-lakes → /operator); a user who is both sees both entries; anglers and referees never see it (fish: OrganizerBanner / OwnedLakesCard on Home, operator stack titled „Administrare lacuri”)."
        fish_ref: "services/queries/useOrganizerDashboard.ts:7-12; components/OwnedLakesCard.tsx:57-64; app/(app)/_layout.tsx:122-129"
      - id: global.shell.c13
        text: "A page that throws renders the error fallback inside the page area while the top bar keeps working, so the user can navigate elsewhere (fish per-route ErrorBoundary keeps the tab bar)."
        fish_ref: "components/errors/RouteErrorBoundary.tsx:8-11,16-18; app/(app)/(tabs)/profile.tsx:22"
      - id: global.shell.c14
        text: "A rapid double activation of any navigation link or card produces one navigation (one history entry), not two (fish installs an 800 ms guard on every push/navigate; back/dismiss reset it so a deliberate second navigation after Back is never swallowed)."
        fish_ref: "hooks/useNavigationGuard.ts:5,17-23,58-65,81-99; app/(app)/_layout.tsx:13-17"
      - id: global.shell.c15
        text: "Going to a main destination from a nested page replaces the content under the same single shell; the shell never renders twice (fish routes tab targets through dismissTo so a second Tabs is never mounted)."
        fish_ref: "contexts/NotificationsContextProvider.tsx:225-228"
      - id: global.shell.c16
        text: "When the network banner is visible it never covers the top bar, the menu panel or the page's primary action, and no empty strip opens between banner and content."
        fish_ref: "app/(app)/(tabs)/_layout.tsx:37-42; contexts/NetInfoContextProvider.tsx:20-24"
      - id: global.shell.c17
        text: "The shell is the same for guests and signed-in users: no route group is wholesale auth-gated (fish keeps the (app) redirect to sign-in commented out); each page decides its own gating."
        fish_ref: "app/(app)/_layout.tsx:42-48"
      - id: global.shell.c18
        text: "Landmarks: the top bar is a <header> with a <nav> labelled for the main destinations; the page body is the single <main>; every icon-only control (search, notifications, avatar, ☰) has a Romanian accessible name and a visible focus ring."
        fish_ref: "app/(app)/(tabs)/_layout.tsx:45-127"
    mobile_only: false
    status: todo

