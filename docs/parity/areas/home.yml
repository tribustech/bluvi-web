    web_route: /
    template: T5
    milestone: M0
    roles: [guest, angler, organizer, referee, operator]
    core:
      - social.profileQuery
      - social.unreadNotificationsCountQuery
      - social.suggestedAnglersHomeInfiniteQuery
      - social.followAnglerMutation
      - social.sendFeedbackMutation
      - social.domain.suggestedStats (formatFollowers, pickTopStats)
      - competitions.competitionCardsInfiniteQuery (scope all, status started / notStarted, default filters, sort date)
      - competitions.liveCompetitionQuery (fish calls /competitions/live?extraStatus=new — core has only the plain variant; gap)
      - competitions.currentPollQuery + sortPollOptionsByVotes
      - competitions.pollVoteMutation / applyPollVote
      - competitions.sponsorsQuery
      - organizer.organizerDashboardQuery + isOrganizerProfile
      - organizer.activeWeighingQuery
      - organizer.raffleActiveQuery + raffleParticipationQuery + deriveRaffleState
      - lakes.getLakes (/feed/lakes/search, pageSize 10) — home lake rail
      - lakes.ownedLakesStatsQuery
      - lakes.sendLakeSuggestionMutation
      - booking.ownedLakesQuery
      - booking.myBookingsCountQuery
      - news.newsInfiniteQuery (pageSize 10)
      - realtime.partide.activePartidaOf
      - social.myWidgetNotificationQuery + registerWidgetNotificationMutation (/feed/widget-notifications/mine, POST /feed/widget-notifications)
    states:
      - signed-out (h1 „Bine ai venit pe Bluvi”, guest card „Conectează-te”, „Ce găsești pe Bluvi” pillars (account.onboarding.c4), no organizer/operator/suggested/live-competition blocks, Contact + Setări de confidențialitate shown)
      - signed-in, profile loading
      - signed-in, profile incomplete (username missing / „null null” / isProfileComplete false) → complete-profile prompt
      - full-page error (lakes, profile, unread count or news query failed)
      - session expired (profile 401/403 → sign-out)
      - live competitions present → „Concursuri live (n)” rail
      - no live competitions, upcoming present → „Concursuri viitoare (n)” rail
      - no live and no upcoming competitions → no competition rail
      - competition rail loading (3 skeletons) / rail error with retry
      - user registered in a live competition → „CONCURSUL MEU” panel (with 0..3 extra-scale requests, active weighing line)
      - active partidă → live partidă dock (replaces the start-partidă CTA and wins over the competition panel)
      - organizer → organizer banner with stats
      - operator with 1 lake / several lakes; pending requests / none; cancellations; reviews owed
      - poll present / absent / voting closed / ≤3 options / >3 options collapsed / expanded / voted / pending selection
      - raffle absent / active not joined / joined without receipt / joined with receipt / ended without winners / ended with winners
      - suggested anglers fewer than 3 visible → section hidden
      - lakes loading (3 skeletons) / empty / next page loading
      - sponsors empty → section hidden
      - news loading (3 skeletons) / empty
      - offline (partidă capture blocked with toast)
