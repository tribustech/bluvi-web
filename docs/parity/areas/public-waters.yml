# Parity inventory — area: public-waters (Ape publice, ANAR "Hidrografie", CC-BY 4.0)
#
# Data-source note (read before building any screen here): fish reads public waters from a
# BUNDLED, read-only SQLite DB (fish/assets/db/public-waters.sqlite3, DB_VERSION 4, opened by
# features/public-waters/db.ts). There is NO CMS endpoint for the waters themselves — only for
# the claim map (/feed/public-waters/claimed) and for community activity keyed by `water:<linkCode>`.
# bluvi-web has the model types + pure helpers (core/lakes/domain/publicWaters.ts) but no data
# source yet: every screen below needs a web equivalent of features/public-waters/queries.ts
# (by id, by linkCode, viewport rows, markers, search, nearest, counties, county names,
# attribution, geometry). Listed under `core` as "MISSING core/publicWaters source".
area: public-waters
screens:
  # ─────────────────────────────────────────────────────────────────────────────────────────
  - id: public-waters.harta-ape
    title: Ape publice — hartă și listă
    fish:
      - "app/(app)/(tabs)/lakes/index.tsx"
      - features/lakes/components/LakesResultsWithMap.tsx
      - features/public-waters/PublicWatersSheet.tsx
      - features/public-waters/PublicWatersSearch.tsx
      - features/public-waters/PublicWaterCountyFilter.tsx
      - features/public-waters/PublicWaterDetailCard.tsx
      - features/public-waters/PublicWatersLayer.tsx
      - features/public-waters/PublicWaterClusters.tsx
      - features/public-waters/SelectedWaterHighlight.tsx
      - features/public-waters/WaterTypeIcon.tsx
      - features/public-waters/usePublicWatersInViewport.ts
      - features/public-waters/usePublicWaterMarkers.ts
      - features/public-waters/usePublicWaterClusters.ts
      - features/public-waters/usePublicWaterSelection.ts
      - features/public-waters/publicWaterSelectionMachine.ts
      - features/public-waters/useMapCamera.ts
      - features/public-waters/regionForWater.ts
      - features/public-waters/clusterIndex.ts
      - features/public-waters/band.ts
      - features/public-waters/hitTest.ts
      - features/public-waters/geometryStore.ts
      - features/public-waters/geometryCache.ts
      - features/public-waters/recentSearches.ts
      - features/public-waters/helpers/waterDistance.ts
      - features/public-waters/queries.ts
      - features/public-waters/db.ts
      - models/publicWater.type.ts
      - services/queries/useClaimedPublicWaters.ts
      - services/api/publicWaters.ts
    web_route: /ape-publice
    template: T2
    milestone: M1
    roles: [guest, angler, organizer, referee, operator]
    core:
      - core/lakes/domain/publicWaters (types, publicWaterFilterToTypes, publicWaterLocationLabel, publicWaterAreaHaLabel, waterDistanceKm, formatWaterDistance)
      - core/lakes claimedPublicWatersQuery + toClaimedPublicWatersMap
      - "MISSING core/publicWaters source: getWaterRowsInViewport, getGeometriesByIds, getMarkerWatersInViewport, getPublicWaterById, searchPublicWaters, nearestWatersTo, getCounties"
      - "MISSING pure ports: band.ts (resolveBand, displayedSpans), clusterIndex.ts (supercluster), hitTest.ts (findWaterAtPoint), regionForWater.ts, publicWaterSelectionMachine.ts (reduceSelection)"
    states:
      - clusters band (zoom below geometry gate) — cluster badges + single-water icon pins
      - geometry band — river lines + lake polygons, small waters as pins
      - geometry band loading with no rows yet („Se încarcă apele…”)
      - empty viewport („Nicio apă în această zonă” / „Nicio apă publică în această zonă.”)
      - list sheet open / hidden after pan („Vezi lista (N)” pill)
      - water selected loading → previewing (amber highlight + preview card)
      - selection load failed (silently back to none)
      - claimed water (reroutes to the lake page)
      - Lacuri vs Râuri filter; county filter active (badge N)
      - search overlay — empty (recents / În jurul meu), searching (skeleton), results grouped Râuri/Lacuri, no results, nearby list
      - location permission denied / services off (from În jurul meu or locate button)
      - county filter overlay with draft selection
      - signed-out (identical — no auth gate)
    criteria:
      - id: public-waters.harta-ape.c1
        text: "The Bălți tab home shows a two-option toggle „Bălți” / „Ape publice”; choosing „Ape publice” switches to map mode, clears lake filters and the committed search and forces the all-results map view."
        fish_ref: "app/(app)/(tabs)/lakes/index.tsx:563-576"
      - id: public-waters.harta-ape.c2
        text: "While Date.now() < 2026-09-06 a red „NOU” badge sits on the „Ape publice” toggle option; after that date it is not shown (date-gated, no persistence)."
        fish_ref: "app/(app)/(tabs)/lakes/index.tsx:95-97"
      - id: public-waters.harta-ape.c3
        text: "In Ape publice mode the private-lake queries (bbox lakes + lakes list) are disabled — no lake network request fires while browsing public waters."
        fish_ref: features/lakes/components/LakesResultsWithMap.tsx:781-789
      - id: public-waters.harta-ape.c4
        text: "The map chrome shows a back control (returns to the Bălți home sections and resets mode to Bălți), a search pill labelled „Caută un râu sau lac” that opens the public-waters search, and a filter icon in the pill that opens the county filter."
        fish_ref: features/lakes/components/LakesResultsWithMap.tsx:1345-1361
      - id: public-waters.harta-ape.c5
        text: "Filter chips: „Lacuri” (default active, lake icon), „Râuri” (river icon) — exactly one type active at a time; tapping the active one is a no-op; „Județe” chip with chevron is active and shows a count badge when ≥1 county is selected and opens the county filter."
        fish_ref: features/lakes/components/LakesResultsWithMap.tsx:1196-1231
      - id: public-waters.harta-ape.c6
        text: "„Lacuri” maps to types natural_lake, reservoir_lake, coastal_lake, transitional_lake; „Râuri” maps to river only."
        fish_ref: models/publicWater.type.ts:141-153
      - id: public-waters.harta-ape.c7
        text: "Zoom band with hysteresis: entering geometry when continuous zoom ≥ 11.2, leaving it only when ≤ 10.6 (zoom = log2(360/longitudeDelta)); below it the map shows clusters, above it shapes."
        fish_ref: features/public-waters/band.ts:9-35
      - id: public-waters.harta-ape.c8
        text: "Clusters band: centroids are clustered (supercluster, maxZoom 11); from zoom 8.5 clusters of ≤4 waters expand into individual icon pins; a single water renders as a lake/river icon pin, not a „1” badge."
        fish_ref: features/public-waters/band.ts:13-19
      - id: public-waters.harta-ape.c9
        text: "Tapping a multi-water cluster closes the list sheet and zooms to max(expansionZoom, current+1.2), capped at 11.5 (gate + 0.3), centred on the badge; tapping a single-water pin selects that water."
        fish_ref: features/lakes/components/LakesResultsWithMap.tsx:637-670
      - id: public-waters.harta-ape.c10
        text: "Geometry band: rivers draw as indigo lines (width 3), lakes as indigo-outlined polygons with an 18% indigo wash; waters whose projected bbox is < 24px render as icon pins instead of shapes."
        fish_ref: features/public-waters/PublicWatersLayer.tsx:10-17
      - id: public-waters.harta-ape.c11
        text: "Geometry band viewport query returns at most 1500 waters intersecting the visible bbox, filtered by type and (primary) county; clusters band markers are the 150 largest waters by bbox area in view."
        fish_ref: features/public-waters/queries.ts:133-171
      - id: public-waters.harta-ape.c12
        text: "While the geometry band's first viewport query is in flight with zero rows, a floating pill „Se încarcă apele…” with a spinner is shown under the chrome."
        fish_ref: features/lakes/components/LakesResultsWithMap.tsx:1402-1424
      - id: public-waters.harta-ape.c13
        text: "Tapping the map: the selected water's pin re-frames it; else the nearest cluster/pin within 36px is pressed; in the clusters band an empty tap closes the preview; in the geometry band shapes are hit-tested with ~14px tolerance (polygon containment wins), a miss closes the preview."
        fish_ref: features/lakes/components/LakesResultsWithMap.tsx:672-761
      - id: public-waters.harta-ape.c14
        text: "Every selection origin (map tap, pin, list row, search) first checks the claim map: a water whose linkCode is claimed by a bookable lake opens /balti/[lakeId] instead of the public-water preview."
        fish_ref: features/lakes/components/LakesResultsWithMap.tsx:600-627
      - id: public-waters.harta-ape.c15
        text: "Selecting a water loads its full record, frames it on the map (amber highlight: river width 6 / lake stroke 4.5 + 25% amber fill) and shows the preview card; re-selecting the same water is a no-op; a failed load returns silently to no selection."
        fish_ref: features/public-waters/publicWaterSelectionMachine.ts:52-87
      - id: public-waters.harta-ape.c16
        text: "Closing the preview restores the camera to the region captured at the first selection (survives chained selections); if the user panned during the preview the camera is not moved back."
        fish_ref: features/public-waters/publicWaterSelectionMachine.ts:89-103
      - id: public-waters.harta-ape.c17
        text: "Preview card shows the name (fallback „Apă publică”), subtitle „<type label> · <location label>”, a close X („Închide”) and „Vezi detalii ›”; tapping the card opens /ape-publice/[id] (numeric row id)."
        fish_ref: features/public-waters/PublicWaterDetailCard.tsx:30-80
      - id: public-waters.harta-ape.c18
        text: "Type labels: river „Râu”, natural_lake „Lac natural”, reservoir_lake „Lac de acumulare”, coastal_lake „Lac costier”, transitional_lake „Apă de tranziție”."
        fish_ref: features/public-waters/PublicWaterDetailCard.tsx:15-21
      - id: public-waters.harta-ape.c19
        text: "Location label: a river touching more than one county shows „N județe”; otherwise the primary county name."
        fish_ref: models/publicWater.type.ts:88-97
      - id: public-waters.harta-ape.c20
        text: "The preview card and the list sheet are mutually exclusive: selecting closes the sheet; closing the preview re-opens the sheet only if it was open before the selection."
        fish_ref: features/lakes/components/LakesResultsWithMap.tsx:455-473
      - id: public-waters.harta-ape.c21
        text: "List sheet title: clusters band → „Cele mai mari ape din zonă” (or „Nicio apă în această zonă” when empty); geometry band → „Se încarcă…” while loading with no rows, else „N apă/ape în această zonă”; the count N is shown at the right of the header."
        fish_ref: features/lakes/components/LakesResultsWithMap.tsx:1460-1472
      - id: public-waters.harta-ape.c22
        text: "List rows are sorted by surface area descending (rivers, which have no area, last); each row shows name (fallback „Apă publică”), meta „<location> · <N ha>” (area rounded, ro-RO thousands) and a type badge „Râu” or „Lac”; tapping a row selects the water (or reroutes if claimed)."
        fish_ref: features/public-waters/PublicWatersSheet.tsx:43-98
      - id: public-waters.harta-ape.c23
        text: "Empty list: spinner while the viewport query loads, else „Nicio apă publică în această zonă.”."
        fish_ref: features/public-waters/PublicWatersSheet.tsx:102-114
      - id: public-waters.harta-ape.c24
        text: "Panning hides the list sheet; a floating pill „Vezi lista (N)” (N = markers in clusters band, rows in geometry band) re-opens it; the pill is hidden while a water is selected."
        fish_ref: features/lakes/components/LakesResultsWithMap.tsx:1372-1400
      - id: public-waters.harta-ape.c25
        text: "Locate button: asks for location (permission / services-off sheets on failure), then zooms to a 20 km radius around the user; pressing again while centred tightens by 5 km down to 5 km."
        fish_ref: features/lakes/components/LakesResultsWithMap.tsx:1060-1083
      - id: public-waters.harta-ape.c26
        text: "Search overlay: title „Caută ape publice”, close X „Închide”, input placeholder „Caută un râu sau lac”, autofocus after opening; closing clears term, results and nearby state."
        fish_ref: features/public-waters/PublicWatersSearch.tsx:76-88
      - id: public-waters.harta-ape.c27
        text: "Search runs 250ms debounced once the term has ≥2 characters; matches name OR county, case-insensitive, names starting with the term first, then shorter names; max 40 results; results grouped under „Râuri” and „Lacuri” section headers."
        fish_ref: features/public-waters/PublicWatersSearch.tsx:90-140
      - id: public-waters.harta-ape.c28
        text: "Search rows show the name (fallback „Apă publică”) and „<type label> · <location label>”; while searching a skeleton is shown; zero results show „Niciun rezultat pentru „<term>”.”."
        fish_ref: features/public-waters/PublicWatersSearch.tsx:249-279
      - id: public-waters.harta-ape.c29
        text: "With <2 characters typed the overlay shows „În jurul meu / Ape publice în apropiere” and, if any, „Căutări recente” with a „Șterge tot” action that clears them."
        fish_ref: features/public-waters/PublicWatersSearch.tsx:127-133
      - id: public-waters.harta-ape.c30
        text: "„În jurul meu” requests location (denied → permission sheet, services off or error → services-off sheet), then lists the 20 nearest waters that have a linkCode under „Cele mai apropiate”, each subtitle prefixed with distance („420 m” / „3.2 km” / „13 km”); typing ≥2 chars exits nearby mode, and a result arriving after the user typed or closed is dropped."
        fish_ref: features/public-waters/PublicWatersSearch.tsx:152-175
      - id: public-waters.harta-ape.c31
        text: "Selecting a search result stores it as most-recent (max 8, de-duplicated by id, no geometry) and navigates to /balti/[lakeId] when its linkCode is claimed, else /ape-publice/[id]."
        fish_ref: "app/(app)/(tabs)/lakes/index.tsx:858-866"
      - id: public-waters.harta-ape.c32
        text: "County filter overlay: header „Județe”, „Anulează” closes without applying; search box „Caută un județ” (diacritic-insensitive); each row shows the county name and „N apă/ape” with a checkbox."
        fish_ref: features/public-waters/PublicWaterCountyFilter.tsx:41-140
      - id: public-waters.harta-ape.c33
        text: "County filter edits a draft seeded from the applied selection; „Toate” (shown when ≥1 is selected) clears the draft; footer button „Aplică (N)” / „Aplică” commits it and closes; an empty selection means all counties."
        fish_ref: features/public-waters/PublicWaterCountyFilter.tsx:33-39
      - id: public-waters.harta-ape.c34
        text: "The applied county filter constrains markers, clusters, viewport rows and map hit-tests on the primary county_id."
        fish_ref: features/public-waters/queries.ts:116-123
    mobile_only: false
    status: passing

  # ─────────────────────────────────────────────────────────────────────────────────────────
  - id: public-waters.detaliu
    title: Apă publică
    fish:
      - "app/(app)/public-waters/[id].tsx"
      - features/public-waters/useResolvedPublicWater.ts
      - features/public-waters/routeParam.ts
      - features/public-waters/publicWaterDetailLogic.ts
