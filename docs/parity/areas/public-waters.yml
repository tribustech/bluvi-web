behaviours:
  - id: public-waters.b.route-param
    text: "Every /ape-publice/[id]* route accepts either the bundled numeric row id or the stable ANAR linkCode (e.g. „R:<guid>”); links must URL-encode the code (it contains „:” and „.”)."
    fish_ref: features/public-waters/publicWaterDetailLogic.ts:25-47
  - id: public-waters.b.claimed-redirect
    text: "A public water whose linkCode is claimed by a bookable lake (GET /feed/public-waters/claimed, public, staleTime 1h, gcTime 24h; empty map until loaded = no reroute) never shows as a public water: map/list/search open /balti/[lakeId], the detail page replaces itself with it."
    fish_ref: services/queries/useClaimedPublicWaters.ts:16-29
  - id: public-waters.b.inbound-partida-hero
    text: "A partidă's venue hero links to /balti/[lakeId] when it has a lakeId, else to /ape-publice/[publicWaterCode] for venueType publicWater, else nothing (pins)."
    fish_ref: features/partide/community/view.ts:346-354
  - id: public-waters.b.inbound-community-cards
    text: "Live venue cards in the Partide Acasă/Comunitate feeds open /ape-publice/[code]/partide for a publicWater venue (code read from key „water:<code>”); manual pins have no page and fall back to opening the leading partidă."
    fish_ref: features/partide/community/venuePartideHref.ts:15-24
  - id: public-waters.b.inbound-start-partida
    text: "The start-partidă flow accepts a public water as pre-selected venue (?waterCode=<linkCode>, resolved with the same resolver) — the web start route must accept the equivalent query param."
    fish_ref: "app/(app)/partide/start.tsx:33-34"
  - id: public-waters.b.no-auth-gate
    text: "All public-water screens are reachable signed-out (the (app) layout has its auth redirect commented out) and every request they make is public (auth none); only the own-partidă resolution and the EU pill use the session."
    fish_ref: "app/(app)/_layout.tsx:42-47"
  - id: public-waters.b.no-notifications
    text: "No notification type routes to a public-water screen (getRedirectLocationForNotification has no public-water target); there are no public-water deep links other than in-app routes."
    fish_ref: helpers/getRedirectLocationForNotification.ts:1
  - id: public-waters.b.refresh-intervals
    text: "Venue section polls every 60s (stale 30s); venue catches stale 60s, 20/page; history stale 120s, 10/page; stats stale 60s per venue with keepPreviousData; all with retry false."
    fish_ref: features/partide/community/hooks.ts:132-295
  - id: public-waters.b.offline-data-source
    text: "Waters, geometry, counties and the CC-BY attribution come from a bundled read-only SQLite DB (no network); the web must serve the same dataset (same ids, linkCodes, names without diacritics, attribution) from its own source before any screen in this area can pass."
    fish_ref: features/public-waters/db.ts:1-59
  - id: public-waters.b.attribution
    text: "The ANAR CC-BY 4.0 attribution must be shown wherever the dataset is displayed (fish shows it on the detail page's Locație section)."
    fish_ref: features/public-waters/queries.ts:386-391
  - id: public-waters.b.recent-searches
    text: "Recently selected public waters are persisted per device (max 8, newest first, de-duplicated by id, rows only, no geometry) and can be cleared with „Șterge tot”."
    fish_ref: features/public-waters/recentSearches.ts:4-30
  - id: public-waters.b.period-param
    text: "Statistici and Clasament keep the selected period in the URL (fish ?period=week|month|year; web ?perioada=) via replace, so refresh/back keeps it; unknown values fall back to month."
    fish_ref: features/partide/helpers/statsPeriod.ts:7-9
  - id: public-waters.b.navigation-guard
    text: "Every push from these screens goes through guardNavigation to prevent double navigation on fast double taps (web: links must not double-submit client navigations)."
