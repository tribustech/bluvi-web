        text: "Direcții opens a directions chooser with Google Maps (dir api, driving) and Waze (navigate=yes) to the water's centre point; Apple Maps only on Apple platforms; missing coordinates show „Coordonatele nu sunt disponibile…”."
        fish_ref: components/NavigationSheet.tsx:14-101
        status: passing
