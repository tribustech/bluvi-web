    web_route: /ape-publice/[id]
    template: T3
    milestone: M1
    roles: [guest, angler, organizer, referee, operator]
    core:
      - core/lakes/publicWatersSource.ts (getPublicWaterById, getPublicWaterByLinkCode, getCountyNamesByIds, getAttribution; served by app/(site)/ape-publice/_server/source.ts)
      - core/lakes/domain/publicWaterDetail.ts (publicWaterName, publicWaterSubtitle, publicWaterFacts, buildPublicWaterSectionChips, countiesHeading)
      - core/lakes/domain/publicWaters (publicWaterLocationLabel)
      - core/lakes claimedPublicWatersQuery + toClaimedPublicWatersMap
      - core/partide communityVenueSectionQuery, communityVenueCatchesInfiniteQuery (venue {kind:'water', code})
      - core/partide/domain/venueKeys (communityVenueKey)
      - core/partide hasPartideActivity; the scroll spy / scroll target are the T3 kit's (components/templates/T3/DetailSections.tsx)
    states:
      - loading (spinner + back)
      - not-found (empty/invalid param or no matching row)
      - error (DB/source failure, retry)
      - claimed water (replaced by /balti/[lakeId])
      - water without linkCode (no community sections, no link-code row)
      - no partide activity (Partide section + chip hidden)
      - no catches and no species (Capturi section + chip + quick action hidden)
      - species but zero photo catches (Capturi section with „Nicio captură cu poză…”)
      - community or catches fetch failed (inline red banner with retry)
      - catches paginating (spinner under grid)
      - multi-county river (Județe (N) chips)
      - no facts (Detalii block hidden)
      - live partide now (badge on Partide tile, ACTIVI ACUM card)
      - signed-out (identical; own partidă resolution needs session)
    criteria:
      - id: public-waters.detaliu.c1
        text: "The [id] param resolves as a numeric row id when it is a positive safe integer, otherwise as an ANAR linkCode (trimmed); an empty param is not-found without any lookup."
        fish_ref: features/public-waters/routeParam.ts:6-21
        status: passing
      - id: public-waters.detaliu.c2
        text: "Loading shows a centred spinner and a back control; a param change never shows the previous water for a frame (shown as loading until the new lookup resolves)."
        fish_ref: features/public-waters/useResolvedPublicWater.ts:65-72
        web_note: "From 768 the loading band already reads «Bălți / Ape publice / ▭» (the shell's URL trail nests ape-publice under Bălți) and the skeleton's section nav is the tab bar's text bars (DetailSkeleton sectionTabs), so neither changes shape when the page lands. e2e at 375 and 1440."
        status: passing
      - id: public-waters.detaliu.c3
        text: "Not-found shows a warning icon and „Apa publică nu a fost găsită.” with no retry; error shows „Nu am putut încărca apa publică.” and a „Încearcă din nou” button that re-runs the lookup."
        fish_ref: "app/(app)/public-waters/[id].tsx:127-147"
        status: passing
      - id: public-waters.detaliu.c4
        text: "When the water's linkCode is in the claim map (/feed/public-waters/claimed), the page is REPLACED (not pushed) by /balti/[lakeDocumentId]."
        fish_ref: "app/(app)/public-waters/[id].tsx:375-384"
        web_note: "Decided twice, as fish reads the map on every mount: the server redirects when it renders the (cached) page, and the page reads claimedPublicWatersQuery in the browser and router.replace()s to the lake when the linkCode is in it — so a water claimed after its page was cached still leaves for the lake. Open: a water UNclaimed since keeps redirecting until the server claim cache (1h, `public-waters-claimed` tag, purged 'max' = stale-while-revalidate) refreshes; the CMS purge webhook is patch P1. e2e (both)."
        status: passing
      - id: public-waters.detaliu.c5
        text: "Hero: a 280-high static map (no pan/zoom/rotate/pitch) fitted to the water's geometry with 34px padding (centre ± 0.1° fallback when <2 coordinates), the water drawn with the amber outline and an indigo wash; the whole hero is a button „Deschide harta pentru <name>” opening /ape-publice/[id]/harta."
        fish_ref: "app/(app)/public-waters/[id].tsx:150-202"
        web_note: "Until MapLibre's first idle after the map is up (style, tiles and the outline drawn), the band keeps the loading skeleton's shimmer and then fades it out — never a flat grey slab, never the outline mid-fit; the water is fitted again when the band changes width (the catch photos arrive). e2e (style held → shimmer; released → map)."
        status: passing
      - id: public-waters.detaliu.c6
        text: "Header: name (fallback „Apă publică”) as title, then a pin icon with „<type label> · <location label>”, then the English name when present and different from the name."
        fish_ref: "app/(app)/public-waters/[id].tsx:618-644"
        web_note: "Web: the second name is labelled «și: <nameEn>» and is dropped when it only differs from the name by case / diacritics («SNAGOV» next to «Snagov»). e2e (Dunarea «și: Brat Alionte»; the `noname` fault for «Apă publică»)."
        status: passing
      - id: public-waters.detaliu.c7
        text: "Section chips, in order: Prezentare, Partide (only with partide activity), Capturi (only with ≥1 photo catch OR species counts), Locație."
        fish_ref: features/public-waters/publicWaterDetailLogic.ts:3-23
        status: passing
      - id: public-waters.detaliu.c8
        text: "Partide activity = activeNow > 0 OR catchesThisMonth > 0 OR recordKg != null OR any monthlyActivity count > 0."
        fish_ref: features/lakes/helpers/lakeDetailLogic.ts:39-44
        status: passing
      - id: public-waters.detaliu.c9
        text: "Tapping a chip scrolls its section to just under the pinned nav and marks it active immediately; the scroll-spy does not walk the highlight through intermediate sections during that scroll; when the chip set changes and the active one disappears, the first chip becomes active."
        fish_ref: "app/(app)/public-waters/[id].tsx:403-504"
        web_note: "The spy also measures again when a section comes back at this width (T3 DetailSectionsProvider: hideFromLg / hideFromXl in its key): from 1024 Prezentare joins above Locație once the reads settle (the «Detalii» bento), and at the top of the page it takes the highlight. e2e at 1440 with the reads answered late."
        status: passing
      - id: public-waters.detaliu.c10
        text: "Scroll-spy: the active chip is the last section whose top has passed under the pinned nav (+12px)."
        fish_ref: features/venues/detail/sectionLogic.ts:7-19
        status: passing
      - id: public-waters.detaliu.c11
        text: "Once the chips row scrolls past the top, a pinned bar fades in with the name, the pin + subtitle meta and the same chips (synced active state)."
        fish_ref: features/venues/detail/VenuePinnedNav.tsx:57-115
        status: passing
      - id: public-waters.detaliu.c12
        text: "A back control stays fixed top-left over the hero."
        fish_ref: "app/(app)/public-waters/[id].tsx:823-830"
        web_note: "Phone: the back chip over the map (DetailHeroTopControls); once pinned, the mini row's back. From 768 the page has no hero overlay (owner rule 1): the breadcrumb is the way back. e2e at 375."
        status: passing
      - id: public-waters.detaliu.c13
        text: "Prezentare opens with „Acțiuni rapide” tiles in this order: Direcții, Hartă, Partide, Statistici, and Capturi only when the photo-catch total > 0."
        fish_ref: "app/(app)/public-waters/[id].tsx:521-568"
        web_note: "Owner (one entry point per page): while the Partide section is on the page its «Vezi tot» is the way in, so the Partide tile is shown only when there is no partide activity; the map band on top is the way to the map at every width, so there is no Hartă tile (below 1024 Locație's card recaps it — two map links, never three). From 1024 Direcții is in the summary card. e2e: both cases, with and without photo catches."
        status: passing
