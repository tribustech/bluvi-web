        text: "Partide tile carries a red count badge = stats.activeNow when > 0 and opens /ape-publice/[id]/partide; Statistici opens /ape-publice/[id]/statistici; Hartă opens /ape-publice/[id]/harta; Capturi carries the photo-catch total as badge and scrolls to the Capturi section."
        fish_ref: "app/(app)/public-waters/[id].tsx:533-558"
        web_note: "Owner (one entry point per page): see c13 — no Hartă tile (the band opens the map). The Partide tile (and its activeNow badge) only exists without partide activity, i.e. when activeNow is 0, so the badge never shows; the live count is the section's «N ACTIVI ACUM» pill instead."
