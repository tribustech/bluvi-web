      - id: lakes.review-form.c8
        text: "Edit updates optimistically my review, the review list and the lake's rating meta, rolls back on error (error toast), and on success shows „Recenzia a fost editată cu succes!” and closes."
        fish_ref: "features/reviews/mutations.ts:28"
        status: passing
        web_note: "core editReviewMutation (optimistic + rollback), toast on error / success, leaves on success. e2e «lakes.review-form.c8» (mocked PUT 500, re-reads held: the list shows the original after back) + «REAL write» (real PUT, list updated)."
      - id: lakes.review-form.c9
        text: "After add/edit/delete these are refetched: lake reviews, the lake, my review for the lake, every lakes list, and bookings awaiting a review."
        fish_ref: "features/reviews/mutations.ts:11"
        status: passing
        web_note: "core invalidateReviewQueries (incl. ['bookings','to-review'], spelled out: lakes may not import booking) refreshes the React Query caches; the lake page is static (cached public reads tagged lake-<id>), so every write also runs the server action recenzie/_components/actions.ts refreshLakeAfterReview (updateTag lake-<id>, read-your-own-writes, after a 1s wait for the CMS's edge purge so the forced re-read is not the stale edge copy; signed-in callers only; the form stays busy meanwhile) and the form router.refresh()es before leaving. Unit core/lakes/lakes.test.ts «review writes invalidate …»; e2e «REAL write» (back on /recenzii: the new review, «1 recenzie», no add bar; the lake page after add («1 recenzie», the review), edit (the new text) and delete («nu are încă recenzii»)). Caveat: the local CMS sends no CDN-Cache-Control, so the lake page is not cached in e2e and those steps pass with or without the updateTag (checked 2026-10-07); the cached path is exercised only on staging / production."
      - id: lakes.review-form.c10
        text: "Signed-out visitors are sent to /intra (fish only reaches the form through signed-in entry points)."
        fish_ref: "components/AddReviewButton.tsx:24"
        status: passing
        web_note: "requireViewer(routes.lakeReview(id, {editare, rezervare})) inside Suspense; proxy.ts answers the cookie-less case with a 307. e2e «lakes.review-form.c10» (all three modes keep their query in next)."
    e2e: tests/e2e/balta-recenzie.spec.ts
    web_note: "Web divergences (fish's entry points never reach them, a typed / stale link can): opening the add mode while the viewer already has a review replaces the URL with ?editare=1 (the CMS refuses a second review); opening ?editare=1 with no review replaces it with the add mode (fish would show an empty edit form whose PUT fails). ?rezervare= is kept through both replaces, so an edit link from a booking still posts a verified review (only the add body carries it). The add mode waits for the own-review read (skeleton) before showing the form, so it never flips under the user's typing; if that read fails the form shows (as fish). From 1280 the lake card (photo, name → the lake, location, rating) in the right column with the CTA docked under it; below 1280 the CTA is pinned and lifted above the on-screen keyboard (VisualViewport). e2e «web divergences», «layout»."
    mobile_only: false
    status: proposed

