  - id: lakes.review-form
    title: "Adaugă / editează recenzia"
    fish:
      - "app/(app)/lakes/review/[lakeId].tsx"
      - "features/reviews/components/LakeReviewForms.tsx"
      - "features/reviews/mutations.ts"
      - "features/reviews/queries.ts"
      - "features/reviews/types.ts"
    web_route: "/balti/[id]/recenzie (?editare=1, ?rezervare={bookingId})"
    template: T4
    milestone: M3
    roles: [angler, organizer, referee, operator]
    core:
      - "core/lakes: postReviewMutation, editReviewMutation, myLakeReviewQuery, invalidateReviewQueries, applyEditToMyReview, applyEditToReviewPages, applyEditToLakeMeta"
    states:
      - "add"
      - "add from a completed booking (verified)"
      - "edit loading"
      - "edit load error"
      - "validation errors"
      - "submitting"
      - "signed-out (→ /intra)"
    criteria:
      - id: lakes.review-form.c1
        text: "Title „Adaugă o recenzie” or, with editare, „Editează recenzia”; back control."
        fish_ref: "app/(app)/lakes/review/[lakeId].tsx:26"
        status: passing
        web_note: "Header band (T4Header): back (fish goBackOrHome: history when the previous page is the site's, else the lake's reviews), the lake's name as the eyebrow, the h1. e2e «REAL write» (both titles)."
      - id: lakes.review-form.c2
        text: "Heading „Cum evaluezi această baltă?” and three whole-star ratings „Pescuit”, „Facilități”, „Atmosferă”, 1–5, default 5, never below 1."
        fish_ref: "features/reviews/components/LakeReviewForms.tsx:66"
        status: passing
        web_note: "Each score is a native radio group named by its title (arrows move and choose, «N stele» per star, ring on :focus-visible only); no «0» option, so never below 1. Phone: title left of the stars; from 768 three tiles. e2e «REAL write» (defaults, keyboard, pointer, focus ring) + unit recenzie/_components/schema.test.ts."
      - id: lakes.review-form.c3
        text: "Comment (placeholder „Împărtășiți cu noi experiența dvs.”) is required: empty → „Pentru o experiență mai bună, te rugăm să lași un comentariu.”, under 10 trimmed chars → „Acest câmp trebuie să aibă cel puțin 10 caractere”, over 2000 → „Acest câmp trebuie să aibă cel mult 2000 de caractere”."
        fish_ref: "features/reviews/components/LakeReviewForms.tsx:87"
        status: passing
        web_note: "Messages after the first submit, then live (react-hook-form onSubmit / reValidate onChange), in RHF's order (required → max, untrimmed → min, trimmed). The field takes focus on a refused submit; a «N / 2000» counter under it (web addition). e2e «REAL write» + unit schema.test.ts."
      - id: lakes.review-form.c4
        text: "Checkbox „Recomand această baltă”, checked by default."
        fish_ref: "features/reviews/components/LakeReviewForms.tsx:123"
        status: passing
        web_note: "T4ChoiceCard checkbox. e2e «REAL write» (default on, toggled, sent, prefilled)."
      - id: lakes.review-form.c5
        text: "Submit button reads „Adaugă o recenzie” / „Editează recenzia”, shows loading and is disabled while sending."
        fish_ref: "features/reviews/components/LakeReviewForms.tsx:154"
        status: passing
        web_note: "Kit Button + T4Spinner, disabled + aria-busy while sending; the header's back is inert meanwhile. e2e «REAL write» (POST held 1.2s)."
      - id: lakes.review-form.c6
        text: "Add posts the review with the booking id when opened from a completed booking (so it is marked verified); success → „Recenzia a fost adăugată cu succes!” and the form closes; failure → error toast with the message."
