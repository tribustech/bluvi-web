        status: passing
        web_note: "?rezervare={bookingId} → body.booking. Success: toast, then back to the site page it came from (Navigation API; never /intra, never the form) else replace → /recenzii. Failure: danger toast with the ApiError message (the CMS's own copy when it sends a bluCode, else the generic one). e2e «lakes.review-form.c6» (mocked POST: body carries booking, failure toast) + «REAL write» (real POST body, back to /recenzii, the review listed)."
      - id: lakes.review-form.c7
        text: "Edit loads the viewer's review (spinner; on failure „A apărut o eroare, te rugăm să încerci mai târziu”) and prefills every field."
