# Parity inventory — area "lakes" (fish → bluvi-web).
# Source: fish `app/(app)/(tabs)/lakes/*`, `app/(app)/lakes/**`, `features/lakes/*`, `features/venues/*`
# plus the shared components they render (features/reviews, features/partide/screens used by lake subpages).
# Line refs are against fish as read on 2026-10-04. Paths are relative to fish/.
# Not covered here (other areas): booking grid `features/lakes/booking/*` + `app/(app)/book-lake/*` (area booking, M3),
# operator walk-in, public waters (`features/public-waters/*`, area public-waters).
area: lakes
screens:
  # ───────────────────────────────────────────── Bălți: home (sections)
  - id: lakes.home
    title: "Bălți"
    fish:
      - "app/(app)/(tabs)/lakes/index.tsx"
      - "app/(app)/(tabs)/lakes/_layout.tsx"
      - "features/lakes/components/LakesHomeSectionRow.tsx"
      - "features/lakes/helpers/lakesHomeSections.ts"
      - "features/lakes/helpers/lakesHomeCardPresentation.ts"
      - "features/lakes/components/LakesNearbyPermissionPlaceholder.tsx"
      - "features/lakes/components/LakesLocationPermissionSheet.tsx"
      - "features/lakes/components/LakesSearchBubble.tsx"
      - "features/lakes/helpers/locationPermissionState.ts"
      - "features/lakes/helpers/recentViewedLakes.ts"
      - "components/MiniatureLakeCard.tsx"
      - "components/LakesListSkeleton.tsx"
      - "components/ErrorScreen.tsx"
      - "helpers/lakesSearch.ts"
      - "services/queries/useLakesHome.ts"
    web_route: /balti
    template: T2
    milestone: M1
    roles: [guest, angler, organizer, referee, operator]
    core:
      - "core/lakes: lakesHomeQuery, getLakesByDocumentIds, buildLakesHomeSections, getTotalLakesInSections, getLakesHomeCardPresentation"
      - "core/lakes: parseRecentViewedLakeIds, pushRecentViewedLakeId, MAX_RECENT_VIEWED_LAKE_IDS"
      - "core/lakes: formatNearbyDistanceKm, getLakeLocationSubtitle, getLakesSearchSummary, DEFAULT_NEARBY_RADIUS_KM, EMPTY_LAKE_FILTERS"
    states:
      - "loading (home skeleton while /feed/lakes/home or recent-viewed lakes are pending)"
      - "error with no sections (error screen + retry)"
      - "location never_asked (nearby slot = placeholder „Permite locația”)"
      - "location denied (placeholder „Deschide setările” + permission dialog)"
      - "location unavailable / services_off (placeholder + services dialog)"
      - "location granted (nearby section with distances)"
      - "no recently viewed lakes (section absent)"
      - "recently viewed lakes present (first section)"
      - "section with > 10 lakes (Vezi toate link + trailing card)"
      - "all sections empty (map CTA hidden)"
      - "signed-out (identical content)"
    criteria:
      - id: lakes.home.c1
        text: "A two-option toggle „Bălți” / „Ape publice” sits above the search; „Bălți” is selected on arrival."
        fish_ref: "app/(app)/(tabs)/lakes/index.tsx:715"
      - id: lakes.home.c2
        text: "The red „NOU” badge on „Ape publice” is date-gated to before 2026-09-06 and must NOT render any more."
        fish_ref: "app/(app)/(tabs)/lakes/index.tsx:97"
      - id: lakes.home.c3
        text: "Choosing „Ape publice” clears every lake filter and the committed search and opens the public-waters map (area public-waters, /ape-publice)."
        fish_ref: "app/(app)/(tabs)/lakes/index.tsx:564"
      - id: lakes.home.c4
        text: "The search field shows a magnifier and the placeholder „Caută bălți, lacuri...”, has the accessible name „Deschide căutarea pentru bălți”, and opens the lakes search (lakes.search)."
        fish_ref: "features/lakes/components/LakesSearchBubble.tsx:40"
      - id: lakes.home.c5
        text: "A round „Filtre” button next to the search opens the filter panel with all sections (lakes.filters, mode all)."
        fish_ref: "app/(app)/(tabs)/lakes/index.tsx:762"
      - id: lakes.home.c6
        text: "Applying filters from the home panel goes to the results map: filtered results when at least one filter is set, the all-lakes map when none is set (never stays on the home)."
        fish_ref: "app/(app)/(tabs)/lakes/index.tsx:887"
      - id: lakes.home.c7
        text: "Sections render in this order: „Vizualizate recent” (only when present, newest first), the nearby section (or its location placeholder), the all-lakes section, then the fixed sections from /feed/lakes/home in server order."
        fish_ref: "features/lakes/helpers/lakesHomeSections.ts:34"
      - id: lakes.home.c8
        text: "A lake already shown in the nearby section or an earlier fixed section is removed from later fixed sections; a fixed section left empty is not rendered."
        fish_ref: "features/lakes/helpers/lakesHomeSections.ts:78"
      - id: lakes.home.c9
        text: "Each section header shows a colored icon badge for its key (recent=clock, nearby=compass, all_lakes=waves, bookable=ticket, top_rated=star, with_retention=fish, with_cabins=home, competition_lakes=trophy, other=telescope) and the section title."
        fish_ref: "features/lakes/components/LakesHomeSectionRow.tsx:63"
      - id: lakes.home.c10
        text: "A section shows at most 10 lakes; when it has more, the header shows „Vezi toate ›” and the row ends with a „Vezi toate” card; /feed/lakes/home is requested with limit 11."
        fish_ref: "features/lakes/components/LakesHomeSectionRow.tsx:162"
      - id: lakes.home.c11
        text: "„Vezi toate” on the bookable section opens the results map with only the Rezervări filter active; on the nearby section (location known) it opens a nearby search with the current radius; on any other section it opens the all-lakes map with filters cleared."
        fish_ref: "app/(app)/(tabs)/lakes/index.tsx:592"
      - id: lakes.home.c12
        text: "The nearby section header shows the radius („50 km ›”, default 50) instead of „Vezi toate”; activating it opens the nearby results map (or triggers the location flow when no position is known)."
        fish_ref: "features/lakes/components/LakesHomeSectionRow.tsx:214"
      - id: lakes.home.c13
        text: "Nearby cards show a dark distance pill: one decimal under 10 km („7.4 km”), rounded above („23 km”)."
        fish_ref: "features/lakes/components/LakesHomeSectionRow.tsx:286"
      - id: lakes.home.c14
        text: "A lake card shows the first image (blurhash placeholder), a white rating pill „★ 4.5” on the image only when the lake has reviews, the name, the county/city subtitle, up to 4 facility icons plus „+N”, and the fishing regime."
        fish_ref: "features/lakes/helpers/lakesHomeCardPresentation.ts:18"
      - id: lakes.home.c15
        text: "Cards in „Vizualizate recent” are the compact variant: narrower, no facilities and no regime."
        fish_ref: "features/lakes/helpers/lakesHomeCardPresentation.ts:33"
      - id: lakes.home.c16
        text: "Activating a card opens /balti/[id]."
        fish_ref: "app/(app)/(tabs)/lakes/index.tsx:623"
      - id: lakes.home.c17
        text: "When location is not granted, the nearby slot is a placeholder card. never_asked: „Descoperă bălți aproape de tine” / „Permite locația și îți arătăm instant locurile din apropiere.” / „Permite locația”; denied: „Activează locația din setări” / „Permisiunea e blocată acum, dar o poți reactiva rapid.” / „Deschide setările”; services_off: „Activează locația dispozitivului” / „Permisiunea e dată, dar locația telefonului este oprită.” / „Deschide setările”."
        fish_ref: "features/lakes/components/LakesNearbyPermissionPlaceholder.tsx:13"
      - id: lakes.home.c18
        text: "Activating the placeholder: never_asked → asks for geolocation and, when granted, loads the position and the nearby section; denied → opens the permission dialog; services_off → opens the services dialog."
        fish_ref: "app/(app)/(tabs)/lakes/index.tsx:178"
      - id: lakes.home.c19
        text: "Permission dialog copy: „Găsește bălți aproape de tine” / „Activează localizarea ca să îți arătăm bălțile din apropiere.” (+ how-to line) / button „Mergi la Setări”; services dialog: „Activează serviciile de locație” / „Locația dispozitivului este oprită. Activeaz-o ca să găsim bălți aproape de tine.” On web the button explains how to allow location in the browser instead of opening OS settings."
        fish_ref: "features/lakes/components/LakesLocationPermissionSheet.tsx:20"
      - id: lakes.home.c20
        text: "The services-off dialog opens by itself once when the location state becomes services_off; the permission dialog opens by itself once when the results map opens while location is denied."
        fish_ref: "app/(app)/(tabs)/lakes/index.tsx:266"
      - id: lakes.home.c21
        text: "/feed/lakes/home is called with the user's latitude/longitude (when granted), radiusKm (default 50) and limit 11, and cached 1h."
        fish_ref: "app/(app)/(tabs)/lakes/index.tsx:343"
      - id: lakes.home.c22
        text: "Recently viewed lakes are read from local storage (max 10) every time the page gains focus and fetched by ids from /feed/lakes/by-ids (cached 24h, previous data kept while refetching)."
        fish_ref: "app/(app)/(tabs)/lakes/index.tsx:350"
      - id: lakes.home.c23
        text: "A floating „Vezi bălțile pe hartă” button (map icon) shows when the sections contain at least one lake; it opens the all-lakes results map with filters cleared."
        fish_ref: "app/(app)/(tabs)/lakes/index.tsx:825"
      - id: lakes.home.c24
        text: "While home sections or recently viewed lakes are loading, the home skeleton is shown instead of the sections."
        fish_ref: "app/(app)/(tabs)/lakes/index.tsx:663"
      - id: lakes.home.c25
        text: "When /feed/lakes/home fails and there are no sections, an error screen with „Încearcă din nou” (refetch) replaces the page. fish bug: the never-asked location placeholder counts as a section, so a failed read leaves that card alone with no word of the failure; the web shows the error whenever the failed read leaves no lake row (the placeholder is dropped)."
        fish_ref: "app/(app)/(tabs)/lakes/index.tsx:659"
      - id: lakes.home.c26
        text: "Refresh (pull-to-refresh in fish) reloads the recent ids, the home sections and the recently viewed lakes."
        fish_ref: "app/(app)/(tabs)/lakes/index.tsx:480"
      - id: lakes.home.c27
        text: "The search row stays fixed while sections scroll under it, faded into the page background."
        fish_ref: "app/(app)/(tabs)/lakes/index.tsx:817"
      - id: lakes.home.c28
        text: "Analytics: one lake_home_section_impression per section with content (section_key, section_position, lakes_count) and lake_home_section_click (section_key, section_position, item_position, lake_id)."
        fish_ref: "app/(app)/(tabs)/lakes/index.tsx:623"
    mobile_only: false
    status: proposed

  # ───────────────────────────────────────────── search overlay
  - id: lakes.search
    title: "Caută în Bălți"
    fish:
      - "features/lakes/components/LakesSearchScreen.tsx"
      - "features/lakes/components/LakesSearchSuggestionsList.tsx"
      - "features/lakes/helpers/suggestionToCommittedSearch.ts"
      - "features/lakes/helpers/recentLakeSearches.ts"
      - "features/lakes/models/lakes-search.types.ts"
      - "services/queries/useLakesExploreSuggestions.ts"
      - "components/search/CollapsibleSearchInput.tsx"
      - "components/search/SearchResultsSkeleton.tsx"
    web_route: "/balti (dialog de căutare; deschis și din /balti/harta)"
    template: none
    milestone: M1
    roles: [guest, angler, organizer, referee, operator]
    core:
      - "core/lakes: lakesExploreSuggestionsInfiniteQuery, defaultLakesExploreSuggestionsInfiniteQuery, flattenLakesExploreSuggestions, LAKES_EXPLORE_SUGGESTIONS_DEBOUNCE_MS"
      - "core/lakes: suggestionToCommittedSearch, nearbyCommittedSearch, mapApiSuggestion"
      - "missing in core: recent lake searches store (fish features/lakes/helpers/recentLakeSearches.ts) — port as pure parse/push helpers"
    states:
      - "empty term, no recents (În jurul meu + default suggestions)"
      - "empty term with recents („Căutări recente”)"
      - "debouncing / first fetch (skeleton)"
      - "results"
      - "no results"
      - "loading next page"
      - "requesting location for „În jurul meu”"
      - "location denied / unavailable (hands off to the location dialogs)"
    criteria:
      - id: lakes.search.c1
        text: "Opens as a full-screen layer titled „Caută în Bălți” with a close button named „Închide”; the input gets focus after opening."
        fish_ref: "features/lakes/components/LakesSearchScreen.tsx:158"
      - id: lakes.search.c2
        text: "The input placeholder is „Caută o baltă, județ sau localitate” and shows a loading indicator while suggestions load."
        fish_ref: "features/lakes/components/LakesSearchScreen.tsx:167"
      - id: lakes.search.c3
        text: "With an empty term the first row is always „În jurul meu” / „Bălți în apropiere” (location icon), followed by the default suggestions."
        fish_ref: "features/lakes/components/LakesSearchScreen.tsx:108"
      - id: lakes.search.c4
        text: "With an empty term and saved recents, a „Căutări recente” block lists them above the suggestions with a „Șterge tot” action that clears them; recents keep max 5, newest first, deduped by id, only county/city/lake picks (never „În jurul meu” nor free text)."
        fish_ref: "features/lakes/helpers/recentLakeSearches.ts:5"
      - id: lakes.search.c5
        text: "Typing queries /feed/lakes/explore/suggestions in text mode (debounced); each row shows an icon by type (location, county pin, city building, lake waves) on its colored circle, the title (1 line) and the subtitle (2 lines)."
        fish_ref: "features/lakes/components/LakesSearchSuggestionsList.tsx:13"
      - id: lakes.search.c6
        text: "While the term is debouncing or the first page is in flight with nothing to show, a skeleton is shown and the empty message never flashes."
        fish_ref: "features/lakes/components/LakesSearchScreen.tsx:94"
      - id: lakes.search.c7
        text: "A non-empty term with no results shows „Nu am găsit rezultate pentru căutarea ta.” fish bug: the CMS answers every term with its „În jurul meu” row, so fish's empty-list message never shows; the web judges „no results” on the county/city/lake rows and shows the message above the nearby row."
        fish_ref: "features/lakes/components/LakesSearchScreen.tsx:213"
      - id: lakes.search.c8
        text: "Suggestions page 20 at a time; reaching the end loads the next page with a spinner footer."
        fish_ref: "features/lakes/components/LakesSearchScreen.tsx:188"
      - id: lakes.search.c9
        text: "Picking a lake suggestion saves it to recents and navigates straight to /balti/[id] (the search layer closes)."
        fish_ref: "app/(app)/(tabs)/lakes/index.tsx:842"
      - id: lakes.search.c10
        text: "Picking a county or city saves it to recents and opens the results map scoped to it, with the title as the search summary."
        fish_ref: "features/lakes/helpers/suggestionToCommittedSearch.ts:23"
      - id: lakes.search.c11
        text: "Picking „În jurul meu” requests geolocation: denied → permission dialog; position unavailable → services dialog; success → results map in nearby mode with radius 50 km and summary „În jurul meu · 50km”."
        fish_ref: "features/lakes/components/LakesSearchScreen.tsx:116"
      - id: lakes.search.c12
        text: "While the location request runs, a spinner shows in the input and a second tap on „În jurul meu” is ignored."
        fish_ref: "features/lakes/components/LakesSearchScreen.tsx:118"
      - id: lakes.search.c13
        text: "Closing the layer resets the typed term."
        fish_ref: "features/lakes/components/LakesSearchScreen.tsx:71"
    mobile_only: false
    status: passing

  # ───────────────────────────────────────────── filter panel
  - id: lakes.filters
    title: "Filtre bălți"
    fish:
      - "features/lakes/components/LakeFilterPickerSheet.tsx"
      - "features/lakes/helpers/lakeFilterChips.ts"
      - "features/lakes/helpers/lakeFilterOptions.ts"
      - "features/lakes/helpers/lakesWizardSummaries.ts"
      - "features/lakes/models/lake-filters.types.ts"
      - "features/lakes/components/FishGlyphs.tsx"
      - "services/queries/useLakesExploreCount.ts"
      - "services/queries/useFacilities.ts"
      - "services/queries/useFishes.ts"
      - "atoms.ts"
    web_route: "/balti/harta (panou Filtre; deschis și din /balti)"
    template: none
    milestone: M1
    roles: [guest, angler, organizer, referee, operator]
    core:
      - "core/lakes: facilitiesQuery, fishesQuery, lakesExploreCountQuery, LAKES_EXPLORE_COUNT_DEBOUNCE_MS"
      - "core/lakes: getRegimeOptions, mapFacilitiesToFilterValues, mapFishToFilterValues, RATING_TIER_ORDER, getRatingTierLabel, getLakeFilterChips, EMPTY_LAKE_FILTERS"
    states:
      - "all sections (opened from „Filtre”)"
      - "single section (opened from a chip)"
      - "nothing selected (Șterge disabled)"
      - "counting (button reads „Aplică”)"
      - "count known („Aplică · N bălți”)"
      - "long section collapsed / expanded"
    criteria:
      - id: lakes.filters.c1
        text: "Opened from „Filtre” the panel is titled „Filtre” and stacks Regim, Facilități, Rating, Rezervări, Pești in that order; opened from a chip it shows only that section, titled with its name."
        fish_ref: "features/lakes/components/LakeFilterPickerSheet.tsx:533"
      - id: lakes.filters.c2
        text: "Regim offers „C&R”, „Retinere”, „C&R + Retinere” (multi-select)."
        fish_ref: "features/lakes/helpers/lakeFilterOptions.ts:25"
      - id: lakes.filters.c3
        text: "Facilități options come from /facilities and Pești options from /fishes (both cached 3h); each pill shows the facility glyph / species glyph (generic fish fallback)."
        fish_ref: "features/lakes/components/LakeFilterPickerSheet.tsx:273"
      - id: lakes.filters.c4
        text: "Multi-select section headers show the uppercase title, „· N” selected count, and a „Selectează tot” / „Deselectează tot” action that flips the whole section."
        fish_ref: "features/lakes/components/LakeFilterPickerSheet.tsx:148"
      - id: lakes.filters.c5
        text: "Facilități and Pești are clipped to 4 rows with an expand pill „Vezi toate facilitățile (N)” / „Vezi toți peștii (N)” that toggles to „Vezi mai puțin”; clipped options are not reachable by keyboard or screen reader."
        fish_ref: "features/lakes/components/LakeFilterPickerSheet.tsx:206"
      - id: lakes.filters.c6
        text: "Options already committed before opening are listed first, and order does not change while the user toggles."
        fish_ref: "features/lakes/components/LakeFilterPickerSheet.tsx:320"
      - id: lakes.filters.c7
        text: "Rating is single-select: „Orice” (no minimum) plus „Excelent”, „Foarte bun”, „Bun”, „Acceptabil” (CMS thresholds 4,5+ / 4,0+ / 3,5+ / 3,0+)."
        fish_ref: "features/lakes/components/LakeFilterPickerSheet.tsx:394"
      - id: lakes.filters.c8
        text: "Rezervări is a single on/off pill „Acceptă rezervări online” (bookableOnly)."
        fish_ref: "features/lakes/components/LakeFilterPickerSheet.tsx:423"
      - id: lakes.filters.c9
        text: "Selections are a draft until „Aplică”; closing (X „Închide” or backdrop) discards the draft; reopening starts from the committed filters."
        fish_ref: "features/lakes/components/LakeFilterPickerSheet.tsx:296"
      - id: lakes.filters.c10
        text: "The apply button shows the live result count for the draft and the current search: „Aplică · N bălți” (or „1 baltă”), plain „Aplică” while counting (/feed/lakes/explore/count)."
        fish_ref: "features/lakes/components/LakeFilterPickerSheet.tsx:565"
      - id: lakes.filters.c11
        text: "„Șterge” clears the shown section (all sections in all-mode) and is disabled when the draft has nothing selected there."
        fish_ref: "features/lakes/components/LakeFilterPickerSheet.tsx:470"
      - id: lakes.filters.c12
        text: "Option pills expose their selected state to assistive tech (role button + pressed/selected)."
        fish_ref: "features/lakes/components/LakeFilterPickerSheet.tsx:92"
      - id: lakes.filters.c13
        text: "Committed filters are app-session state shared by home and results map (not persisted across reloads). Web: the shared state is /balti/harta's query string (web_route above): the home writes it when it opens the map, the map edits it in place, «Înapoi» to /balti drops it; a reload of the map keeps it (a link to a filtered map works) — owner to confirm."
        fish_ref: "atoms.ts:8"
    mobile_only: false
    status: passing

  # ───────────────────────────────────────────── legacy full-screen filters (unreachable)
  - id: lakes.choose-filters
    title: "Filtrează bălți (vechi)"
    fish:
      - "app/(app)/lakes/choose-lake-filters.tsx"
      - "app/(app)/_layout.tsx"
    web_route: "/balti/harta (acoperit de lakes.filters; fără pagină proprie)"
    merged_into: lakes.filters
    template: none
    milestone: M1
    roles: [guest, angler, organizer, referee, operator]
    core:
      - "core/lakes: same as lakes.filters"
    states:
      - "unreachable in fish (no navigation pushes it)"
    criteria:
      - id: lakes.choose-filters.c1
        text: "The route is registered but no fish code navigates to it; the web builds no separate page and treats it as covered by lakes.filters (verify no inbound link exists before closing)."
        fish_ref: "app/(app)/_layout.tsx:65"
      - id: lakes.choose-filters.c2
        text: "Its content (Facilități / Tipuri de pesti / Regim pills, „Șterge filtre”, „Aplică”) is a subset of lakes.filters; nothing here may be missing from lakes.filters."
        fish_ref: "app/(app)/lakes/choose-lake-filters.tsx:63"
    mobile_only: false
    status: passing

  # ───────────────────────────────────────────── results map + list
  - id: lakes.results-map
    title: "Hartă bălți"
    fish:
      - "app/(app)/(tabs)/lakes/index.tsx"
      - "features/lakes/components/LakesResultsWithMap.tsx"
      - "features/lakes/components/LakeMapPinCard.tsx"
      - "features/lakes/components/LakesResultsClearFiltersPill.tsx"
      - "features/lakes/components/LakesResultsMapLocateButton.tsx"
      - "features/lakes/helpers/getMapFocusRegion.ts"
      - "features/lakes/helpers/clusterTargetRegion.ts"
      - "features/lakes/helpers/frameRegionInBand.ts"
      - "features/lakes/helpers/lakeFilterChips.ts"
      - "components/map/MapChrome.tsx"
      - "components/NewLakeCardWithCarouselHeader.tsx"
      - "components/NavigationSheet.tsx"
      - "services/queries/useMapClusters.ts"
      - "services/queries/useLakesInBbox.ts"
      - "services/queries/useLakesFocusBbox.ts"
    web_route: "/balti/harta (?q, ?judet, ?localitate, ?aproape&raza, filtre în query)"
    template: T2
    milestone: M1
    roles: [guest, angler, organizer, referee, operator]
    core:
      - "core/lakes: lakeMapClustersQuery, lakesInBboxInfiniteQuery, lakesFocusBboxQuery, lakeQuery, bboxBucketKey, makeLakesInBboxSignature"
      - "core/lakes: getLakeFilterChips, getLakesSearchSummary, getDistanceKm, formatNearbyDistanceKm, getLakeLocationSubtitle"
      - "missing in core: getMapFocusRegion + COUNTRY_OVERVIEW_REGION + isGeographicSearchMode (fish features/lakes/helpers/getMapFocusRegion.ts), computeClusterTargetRegion (clusterTargetRegion.ts)"
    states:
      - "first load (full skeleton until the first list page)"
      - "fetching after a pan/zoom („Se încarcă…” pill)"
      - "results"
      - "0 results in viewport"
      - "pin selected (pin card)"
      - "list hidden after pan („Vezi lista (N)”)"
      - "filters/search active („Șterge filtre”)"
      - "county/city bbox still resolving / bbox request failed (falls back to country)"
      - "location never_asked / denied / unavailable / granted (locate button)"
      - "nearby mode"
    criteria:
      - id: lakes.results-map.c1
        text: "Map chrome: back control, a search pill showing the summary („În jurul meu · 50km”, the picked county/city name, or „Caută bălți, lacuri...”) that opens lakes.search, and a Filtre icon inside the pill that opens lakes.filters with all sections."
        fish_ref: "features/lakes/components/LakesResultsWithMap.tsx:1345"
      - id: lakes.results-map.c2
        text: "Back clears the search and every filter and returns to the Bălți home sections."
        fish_ref: "app/(app)/(tabs)/lakes/index.tsx:554"
      - id: lakes.results-map.c3
        text: "Filter chip rail in order Regim, Facilități, Rating, Rezervări, Pești; a chip is active when its filter is set; multi-select chips show the selected count; the Rating chip label becomes the tier name when set."
        fish_ref: "features/lakes/helpers/lakeFilterChips.ts:17"
      - id: lakes.results-map.c4
