behaviours:
  - id: lakes.b.share-link
    text: "Shared lake links use https://bluvi-app.wearetribus.com/lakes/{documentId} (universal link to the app); the web must serve /lakes/{id} as a permanent redirect to /balti/{id} (and /lakes/{id}/reviews → /balti/{id}/recenzii) so links already in circulation open on the web (M8 universal-link coordination)."
    fish_ref: "features/lakes/components/ShareLakeSheet.tsx:118"
  - id: lakes.b.notification-follow-lake-review
    text: "Notification FOLLOW_LAKE_REVIEW (data.lakeId) routes to the lake's reviews list (/balti/[id]/recenzii); no lakeId → no navigation. Web in-app notification list must use the same target."
    fish_ref: "helpers/getRedirectLocationForNotification.ts:188"
  - id: lakes.b.inbound-links
    text: "Lake page /balti/[id] is entered from: the home lakes rail, competition header (lake of a competition), Partide community/home scenes and leaderboard venue rows, public-water detail when the water is claimed by a lake, lake request sheet; the review form from Rezervările mele (with booking id) and own review cards."
    fish_ref: "components/competition/CompetitionHeader.tsx:75"
  - id: lakes.b.claimed-public-water-reroute
    text: "A public water whose ANAR linkCode is claimed by a bookable lake (/feed/public-waters/claimed, cached 1h) opens /balti/[lakeId] instead of the public-water page — from search, list rows, pins and map taps."
    fish_ref: "features/lakes/components/LakesResultsWithMap.tsx:609"
  - id: lakes.b.recently-viewed
    text: "Recently viewed lakes: ids stored per device (max 10, deduped, newest last), pushed when a lake page opens, shown newest first on the Bălți home. Web: per-browser storage wrapped in try/catch, page renders without it."
    fish_ref: "features/lakes/helpers/recentViewedLakes.ts:30"
  - id: lakes.b.recent-searches
    text: "Recent lake searches: per device, max 5, only county/city/lake picks, deduped by id, „Șterge tot” clears them."
    fish_ref: "features/lakes/helpers/recentLakeSearches.ts:39"
  - id: lakes.b.location-state
    text: "Location state machine never_asked / denied / services_off / granted drives the nearby section, placeholder copy, dialogs and the locate button; state is re-read whenever the app returns to the foreground (web: on visibilitychange / Permissions API change)."
    fish_ref: "app/(app)/(tabs)/lakes/index.tsx:283"
  - id: lakes.b.signin-gating
    text: "Signed-out gates: booking CTA on a bookable lake → /intra; owner profile link → /intra; booking-interest submit → /intra; add review → sign-in button; everything else on the lakes area (home, map, lake page, subpages, reviews list) is public."
    fish_ref: "app/(app)/lakes/[lakeId].tsx:276"
  - id: lakes.b.claim-signed-out
    text: "FLAG for owner: fish lets a guest open the claim form but POST /feed/lake-claims requires auth (CMS route 19-lake-claims.ts), so a guest only gets the generic error. Web proposal: gate the form behind /intra."
    fish_ref: "features/lakes/LakeClaimSheet.tsx:44"
  - id: lakes.b.refresh-intervals
    text: "Live refresh: lake Partide section and /balti/[id]/partide live data every 60s (staleTime 30s); no other polling in the area. Cache times: home 1h, map clusters and in-bbox 60s, explore count 5m, focus bbox 5m, suggestions per hook, facilities/fishes 3h, claimed waters 1h, reviews 5m, venue stats 60s, venue catches 60s."
    fish_ref: "features/partide/community/hooks.ts:132"
  - id: lakes.b.review-invalidation
    text: "Any review write (add/edit/delete) invalidates lake reviews, the lake detail, my review, all lakes lists and bookings-to-review, so the lake rating and the Rezervările mele prompt update."
    fish_ref: "features/reviews/mutations.ts:11"
  - id: lakes.b.route-error-boundary
    text: "The Bălți tab, lake page and lake competitions page each have their own error boundary: a crash shows a retry card for that route only, the shell keeps working (web: route-level error.tsx)."
    fish_ref: "app/(app)/lakes/[lakeId].tsx:680"
  - id: lakes.b.nav-guard
    text: "Navigations from cards/tiles are guarded against double activation (fish guardNavigation); web must not push duplicate history entries on double click."
    fish_ref: "app/(app)/(tabs)/lakes/index.tsx:631"
  - id: lakes.b.expired-nou-badges
    text: "Both launch badges in the area are date-gated and expired („Ape publice” NOU until 2026-09-06, Rezervă NOU until 2026-10-01): the web ships neither."
    fish_ref: "hooks/useNouBadge.ts:101"
  - id: lakes.b.period-and-sort-in-url
    text: "Venue stats, angler ranking and stand ranking keep period (and stand sort) in the URL, replacing the current entry instead of pushing; links between them carry the current period (and sort)."
    fish_ref: "features/partide/screens/VenueStatsScreen.tsx:94"
  - id: lakes.b.analytics
    text: "GA4 events emitted by the area (to wire in M8): lake_home_section_impression/click, lakes_map_* (view, focus_applied, cluster_tap, pin_tap, locate_me, clear_filters, pin_card_view_page, pin_card_dismiss), lakes_pin_card_open_maps, share_lake_button_pressed, share_lake, copy_lake_share_text, lake_booking_cta_pressed, lake_booking_interest_*, contact_pressed (phone)."
    fish_ref: "features/lakes/detail/LakeContactSection.tsx:15"
  - id: lakes.b.dead-code
    text: "fish features/lakes contains unused components (LakeCompetitions, LakeReservation, LakeListEmptyComponent, LakeIntroOverlay + useLakeIntroTransition, LakePrices, booking/LakeAvailabilityTab) and the unreachable route lakes/choose-lake-filters; none of them is a parity target."
    fish_ref: "app/(app)/_layout.tsx:65"
