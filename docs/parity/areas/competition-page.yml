    web_route: /concursuri/[id]
    template: T3
    milestone: M1
    roles: [guest, angler, participant, organizer, referee, operator]
    core:
      - competitions.competitionQuery (core + my-status merged under competitionKeys.byId)
      - competitions.competitionMyStatusQuery
      - competitions.followCompetitionMutation + applyFollowToCompetition
      - competitions.competitionFollowersQuery
      - competitions.userStatuteForCompetitionQuery
      - competitions.prefetchCompetitionNotificationPreferences + competitionNotificationPreferencesQuery + updateCompetitionNotificationPreferencesMutation
      - organizer.activeWeighingQuery
      - organizer.allocatedParticipantsQuery
      - formatNationalStand (fish helpers/formatNationalStand.ts) — not in core yet; gap
    states:
      - loading (header skeleton; tab content skeletons)
      - competition request failed → full error screen (retry; sign-out on dead session)
      - offline with nothing cached (query paused, no data) → same error screen
      - competition loaded but header data missing/invalid → header error line
      - competitionStatus notStarted / started / completed / draft / cancelled (no badges for draft/cancelled)
      - signed-out (no follow, no active-weighing banner, no statute)
      - viewer is author / referee / registered / pending / rejected / not registered
      - following / not following
      - viewers 0 / 1 / n
      - followers list loading / empty / list
      - no active weighing / one active weighing / several active weighings (signed-in only)
      - National Championship stand labels (A3(12))
      - arrival from publish (fromPublish=1 → confetti)
      - arrival from deep link / notification (activeTabId, participantsFilter, openWeighingSheet params)
      - "unknown competition id (web: 404)"
