# Parity inventory — area "competition-page" (Concurs: antet, tab-uri, vederi Clasament, foi, imagine clasament, cronologie).
# Extracted from fish (read-only) on 2026-10-04. Line refs are fish file:line at that date (paths relative to fish/).
# Chat (competitions/[competitionId]/chat), registration, scale, penalties pages and the create-competition
# wizard are other areas; this file only records how the competition page reaches them.
