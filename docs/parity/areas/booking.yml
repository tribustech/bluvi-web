# Parity inventory — area "booking" (Rezervă stand: grilă → extra → confirmare; Rezervările mele; Rezervare).
# Extracted from fish (read-only) on 2026-10-04. Line refs are fish file:line at that date.
# Out of scope here (other areas): the lake review form `lakes/review/[lakeId]` (lakes area, linked from
# this area), the operator walk-in flow `operator/[lakeId]/walk-in/*` (operator area, shares
# BookingFlowProvider/useBookingGridFlow/AvailabilityGrid with the angler flow below).
area: booking
screens:
  # ─────────────────────────────────────────────────────────────────────────────────────────
  - id: booking.rezerva-grila
    title: Rezervă — alege standul și intervalul
    fish:
      - app/(app)/book-lake/[lakeId]/_layout.tsx
      - app/(app)/book-lake/[lakeId]/index.tsx
      - features/lakes/booking/BookingFlowProvider.tsx
      - features/lakes/booking/useBookingGridFlow.ts
      - features/lakes/booking/BookingGridStep.tsx
      - features/lakes/booking/AvailabilityGrid.tsx
      - features/lakes/booking/GridBand.tsx
      - features/lakes/booking/gridGeometry.ts
      - features/lakes/booking/rowRuns.ts
      - features/lakes/booking/useGridSelection.ts
      - features/lakes/booking/availabilityStatus.ts
      - features/lakes/booking/availabilityPaging.ts
      - features/lakes/booking/timezone.ts
      - features/lakes/booking/offeredExtras.ts
      - features/lakes/booking/nights.ts
      - features/lakes/booking/BookingSelectionSheetHost.tsx
      - features/lakes/booking/BookingSelectionSheet.tsx
      - features/lakes/booking/TooSoonSheet.tsx
      - features/lakes/booking/CompetitionBlockSheet.tsx
      - features/operator/blockReasons.ts
      - features/bookings/ui/chipModel.ts
      - helpers/formatBookingPeriod.ts
      - services/queries/useLake.ts
      - services/queries/useLakeAvailability.ts
      - services/queries/useBookingQuote.ts
      - app/(app)/lakes/[lakeId].tsx
      - features/lakes/booking/LakeAvailabilityTab.tsx
    web_route: /balti/[id]/rezerva
    template: T4
    milestone: M3
    roles: [angler, organizer, referee, operator]
    core:
      - lakes.lakeQuery (lake name, contact phone, paymentMode, depositPercent, checkoutBufferMinutes)
      - booking.lakeAvailabilityInfiniteQuery (month pages via monthWindow, staleTime 0)
      - booking.domain.mergePages / monthWindow
      - booking.domain.gridGeometry (days, bands, headerSlots, formatInterval, formatSelectionLabel, formatSlotLabel)
      - booking.domain.rowRuns (mergeRowBands)
      - booking.domain.gridSelection (toggleSelectionCell, selectDaySelection, computeDaySelection, seedFromSelection, isCellSelected, selectionFromState)
      - booking.domain.availabilityStatus (indexExceptions, resolveSlotStatus, cellA11yLabel, BOOKING_LEAD_HOURS)
      - booking.domain.offeredExtras + countNights + timezone
      - booking.domain.chipModel (durationLabel, rowLabelAddsMeaning)
      - booking.domain.blockReasons (BLOCK_REASON_LABELS)
      - booking.bookingQuoteQuery (POST /feed/lakes/:id/quote, placeholder = previous, staleTime 0)
      - formatBookingPoint / formatBookingPeriod — not in core yet (fish helpers/formatBookingPeriod.ts; core has only dates primitives)
    states:
      - signed-out (lake page CTA sends to sign-in; direct URL must redirect to /intra and return here)
      - lake or first availability page loading → grid skeleton (10 rows × 4 days)
      - availability error with no cached data → inline error + „Încearcă din nou”
      - booking disabled for the lake → „Rezervările nu sunt disponibile”
      - no stands / no slots in range → „Nicio disponibilitate”
      - grid loaded, no selection (header + legend visible)
      - next month page fetching (placeholder column + spinner in header)
      - selection made, quote loading („se calculează”)
      - selection made, quote priced (Continuă enabled)
      - selection made, quote refused by the lake (server sentence, price „—”, Continuă disabled)
      - selection made, quote request failed („Nu am putut calcula prețul” + retry)
      - selection made, stand offers extras for this tour („Poți adăuga extra la pasul următor.”)
      - selection, payment mode deposit / full / offline (different note under the price)
      - slot inside the lead time (yellow, phone only) → too-soon panel, with / without lake phone
      - blocked slot by competition (trophy, panel with „Vezi concursul”) / by operator note / plain block
      - booked slot (red with booker initials, not selectable)
      - past slot (dashed, dimmed) → toast
      - selection scrolled out of view → chevron hint at the right edge
      - returning from extras/review with a selection → grid re-seeded and scrolled to its day
    criteria:
      - id: booking.rezerva-grila.c1
        text: "Entry: on the lake page the booking CTA, when booking is enabled and the user is signed out, opens sign-in (plain push, no redirectTo — back returns to the lake); signed in, it opens this grid. Web: a signed-out visit to /balti/[id]/rezerva redirects to /intra and back."
        fish_ref: app/(app)/lakes/[lakeId].tsx:271-284
      - id: booking.rezerva-grila.c2
        text: "The lake availability tab also offers „Vezi disponibilitatea și rezervă” (disabled with „🔑 Trebuie să fii autentificat în contul tău pentru a putea face o rezervare.” when signed out) that opens this grid."
        fish_ref: features/lakes/booking/LakeAvailabilityTab.tsx:32-48
      - id: booking.rezerva-grila.c3
        text: "The header shows a back button, the lake name as title (fallback „Rezervare”), an „Azi” pill (aria „Mergi la ziua de azi”) that scrolls the grid to today, and the legend under it."
        fish_ref: features/lakes/booking/BookingGridStep.tsx:92-104
      - id: booking.rezerva-grila.c4
        text: "Legend chips: „Liber” (white), „Indisponibil” (red tint), „Doar telefonic” (yellow, angler flow only) and a cabin glyph labelled „Cabană”."
        fish_ref: features/lakes/booking/AvailabilityGrid.tsx:1208-1228
      - id: booking.rezerva-grila.c5
        text: "While a selection exists the header (title, Azi, legend) collapses to zero height with a 220ms fade, giving the space to the grid; it expands again when the selection is cleared."
        fish_ref: features/lakes/booking/BookingGridStep.tsx:16-17,80-89
      - id: booking.rezerva-grila.c6
        text: "Availability is loaded one lake-zone calendar month per page starting with the current month (page 0), endlessly forward, never backward; staleTime 0 (live)."
        fish_ref: services/queries/useLakeAvailability.ts:7-19
      - id: booking.rezerva-grila.c7
        text: "Every time the grid becomes the focused screen again (back from extras/review, from another screen or a notification) the availability query is invalidated and refetched. Web: refetch on mount, on return to the step and on window focus."
        fish_ref: app/(app)/book-lake/[lakeId]/index.tsx:21-37
      - id: booking.rezerva-grila.c8
        text: "The grid starts at yesterday (local start of day), not at the month boundary: older history is clipped out."
        fish_ref: features/lakes/booking/AvailabilityGrid.tsx:257-265
      - id: booking.rezerva-grila.c9
        text: "Scrolling horizontally to within 2 day-columns of the loaded end fetches the next month once per approach (re-armed when scrolled back); while it loads a dimmed placeholder column and a spinner in the header mark the incoming page."
        fish_ref: features/lakes/booking/AvailabilityGrid.tsx:381-387,718-728,1106-1110
      - id: booking.rezerva-grila.c10
        text: "Rows are stands (frozen left column titled „Stand” with the stand name and a cabin mark when the stand has extras), columns are days; the day header row is sticky and each day is a pill reading „{Weekday} {d MMM}” (e.g. „Sâmbătă 15 aug”)."
        fish_ref: features/lakes/booking/AvailabilityGrid.tsx:745-765,1040-1070,1116-1126
      - id: booking.rezerva-grila.c11
        text: "Under the day pills each slot has a chip with its interval („06–18”, or „07:30–19:30” off the hour) and a sun (day shift) or moon (night shift) glyph; a slot of 24h or more shows „{n}h · HH:mm → HH:mm” and no glyph; the glyph is dropped when the column is too narrow."
        fish_ref: features/lakes/booking/AvailabilityGrid.tsx:1079-1104
      - id: booking.rezerva-grila.c12
        text: "Slot status: a block on that stand wins over a lake-wide block, any block wins over a booking (half-open overlap, touching ends do not overlap); otherwise booked if a booking overlaps, else available."
        fish_ref: features/lakes/booking/availabilityStatus.ts:72-91
      - id: booking.rezerva-grila.c13
        text: "Free cells are white and silent; booked and blocked cells share one red „indisponibil” look; booked cells show the booker's initials; a competition block shows a trophy; a blocked run spans the block's full extent."
        fish_ref: features/lakes/booking/GridBand.tsx:47-55,224-231
      - id: booking.rezerva-grila.c14
        text: "A slot that started is past (dashed, dimmed, neutral); tapping it toasts „Interval trecut — alege o zi viitoare.”"
        fish_ref: features/lakes/booking/GridBand.tsx:76,174-176,200-206
      - id: booking.rezerva-grila.c15
        text: "A free slot starting within the lake's lead hours (leadHours, default 24) is yellow and NOT selectable; tapping it opens the „Rezervare din scurt” panel."
        fish_ref: features/lakes/booking/availabilityStatus.ts:19-20,83; features/lakes/booking/AvailabilityGrid.tsx:964-967
      - id: booking.rezerva-grila.c16
        text: "Too-soon panel: title „Rezervare din scurt”, text „Rezervările care încep în mai puțin de {o oră / N ore / N de ore} nu se pot face din aplicație — administratorul are nevoie de timp să confirme. Sună-l direct pentru un loc pe termen scurt.”, „Sună administratorul” (tel: link to the lake's first contact phone, only when it exists; logs contact_pressed 'Lake too soon contact') and „Am înțeles” closing it."
        fish_ref: features/lakes/booking/TooSoonSheet.tsx:17,39-47,63-77
      - id: booking.rezerva-grila.c17
        text: "Tapping a future blocked slot that carries a competition id or a label opens the block panel: trophy + title (block label, else reason label, else „Indisponibil”) + caption „Concurs” for competitions; text „Balta e rezervată integral pentru concurs, toate standurile, între {d MMM, HH:mm} și {d MMM, HH:mm}.” or „Indisponibil între … și ….”; „Vezi concursul” (only with competitionId) opens the competition; „Am înțeles” closes."
        fish_ref: features/lakes/booking/CompetitionBlockSheet.tsx:39-101; features/lakes/booking/GridBand.tsx:155,177-179
      - id: booking.rezerva-grila.c18
        text: "Tapping a booked slot or a blocked slot without label/competition does nothing visible (error haptic only on mobile); the angler cannot open someone else's booking."
        fish_ref: features/lakes/booking/GridBand.tsx:163-183
      - id: booking.rezerva-grila.c19
        text: "Selection rules: one stand row, one contiguous run of available cells; tapping a cell on another stand restarts there; tapping the only selected cell clears it; tapping a later/earlier available cell extends the run when every cell between is available, else restarts at the tapped cell; tapping inside a multi-cell run collapses to that cell; tapping an unavailable cell is a no-op."
        fish_ref: features/lakes/booking/useGridSelection.ts:55-118
      - id: booking.rezerva-grila.c20
        text: "Tapping a day pill selects the whole day on the selected stand; refusals toast: no selection → „Selectează mai întâi un stand.”; day before today → „Ziua a trecut — alege o zi viitoare.”; a slot of that day already started → „Ziua a început deja — alege o zi viitoare.”; a taken cell on that stand → „Ziua nu e liberă integral la standul ales.”"
        fish_ref: features/lakes/booking/AvailabilityGrid.tsx:528-551; features/lakes/booking/useGridSelection.ts:205-222
      - id: booking.rezerva-grila.c21
