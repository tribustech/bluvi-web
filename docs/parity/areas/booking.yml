      - loading
      - error / not found / not mine → error screen with retry
      - pending (request warning, cancel + call)
      - confirmed future (cancel allowed / cancel notice window closed → call only + notice line)
      - live (started, call only, no cancel when ended)
      - completed without my review → „Lasă o recenzie”; with review → none
      - cancelled (by me / lake / system) / rejected → rebook card, dead reason
      - no-show → „Nu a venit”, rebook card
      - lake without contact phone (no call button)
      - booking made before basis existed (no price breakdown)
      - booking with angler note / without
      - cancel sheet open / validation error / submitting / failed
