        fish_ref: features/lakes/booking/AvailabilityGrid.tsx:569-597; features/lakes/booking/useGridSelection.ts:187-198
      - id: booking.rezerva-grila.c25
        text: "Grid cells expose accessible labels „{stand}, {interval label if any}, trecut|indisponibil|disponibil[, selectat]” and selected state; day pills are buttons labelled with the day."
        fish_ref: features/lakes/booking/availabilityStatus.ts:93-110; features/lakes/booking/GridBand.tsx:213-221
      - id: booking.rezerva-grila.c26
        text: "Booking disabled for the lake → empty state „Rezervările nu sunt disponibile” / „Acest lac nu acceptă deocamdată rezervări online.”; no stands or no slots → „Nicio disponibilitate” / „Nu există standuri sau intervale disponibile pentru această perioadă.”"
        fish_ref: features/lakes/booking/AvailabilityGrid.tsx:610-629
