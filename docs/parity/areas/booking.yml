    web_route: /rezervari/[id]
    # Single detail page, no tabs: closest template is T3 without the tab bar.
    template: T3
    milestone: M3
    roles: [angler, organizer, referee, operator]
    core:
      - booking.bookingQuery (GET booking by documentId)
      - booking.cancelBookingMutation
      - booking.domain.statusModel / timelineModel (buildTimeline audience angler)
      - booking.domain.bookingCard (cancelWindowClosed, startsInLabel, deadBookingReason)
      - booking.domain.cancelNotes (stripAppendedCancelReason, meaningfulNoShowNote)
      - booking.domain.cancelReasons.MIN_CANCEL_REASON_LEN
      - lakes.myLakeReviewQuery (does the angler already have a review for this lake)
      - friendlyCancelError — not in core yet
    states:
      - signed-out (redirect to /intra, return here — notification links land here)
      - loading
      - error / not found / not mine → error screen with retry
      - pending (request warning, cancel + call)
      - confirmed future (cancel allowed / cancel notice window closed → call only + notice line)
      - live (started, call only, no cancel when ended)
      - completed without my review → „Lasă o recenzie”; with review → none
      - cancelled (by me / lake / system) / rejected → rebook card, dead reason
      - no-show → „Nu a venit”, rebook card
      - lake without contact phone (no call button)
      - booking made before basis existed (no price breakdown)
      - booking with angler note / without
      - cancel sheet open / validation error / submitting / failed
