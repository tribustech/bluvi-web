  # ─────────────────────────────────────────────────────────────────────────────────────────
  - id: booking.rezerva-extra
    title: Rezervă — Extra
    fish:
      - app/(app)/book-lake/[lakeId]/extras.tsx
      - app/(app)/book-lake/[lakeId]/__tests__/stepGuards.test.tsx
      - features/lakes/booking/ExtrasStep.tsx
      - features/lakes/booking/offeredExtras.ts
      - features/lakes/booking/nights.ts
      - features/lakes/booking/useBookingGridFlow.ts
      - features/lakes/booking/BookingFlowProvider.tsx
      - services/queries/useBookingQuote.ts
    web_route: /balti/[id]/rezerva/extra
    template: T4
    milestone: M3
    roles: [angler, organizer, referee, operator]
    core:
      - booking.domain.offeredExtras + countNights
      - booking.bookingQuoteQuery (re-quoted with the chosen extras)
    states:
      - signed-out (redirect to /intra)
      - reached without a selection (deep link / reload) → back to the grid
      - extras listed, none selected
      - extra(s) selected, re-quote in flight (Continuă disabled)
      - quote priced (Continuă enabled)
      - quote refused / failed (Continuă disabled)
      - per-night extra on a multi-night tour (price × nights + note)
    criteria:
      - id: booking.rezerva-extra.c1
        text: "Without a selection, a selected stand or availability (direct link, reload) the step redirects to the grid. Web: the selection must survive a reload (URL/search params or session) or the redirect applies."
        fish_ref: app/(app)/book-lake/[lakeId]/extras.tsx:17-19; app/(app)/book-lake/[lakeId]/__tests__/stepGuards.test.tsx:53-56
      - id: booking.rezerva-extra.c2
        text: "The step exists only when the stand offers at least one extra for this tour; otherwise Continuă on the grid skips it and Back from review returns to the grid."
        fish_ref: features/lakes/booking/useBookingGridFlow.ts:280-302
      - id: booking.rezerva-extra.c3
        text: "Screen title „Extra”; heading „Extra” with subtitle „Poți adăuga la rezervare, dacă vrei.”"
        fish_ref: app/(app)/book-lake/[lakeId]/extras.tsx:26-28; features/lakes/booking/ExtrasStep.tsx:36-44
      - id: booking.rezerva-extra.c4
        text: "One card per offered extra: round checkbox (filled indigo with a check when selected), the extra's label, and „+{price} lei” on the right; tapping the card toggles it (multi-select)."
        fish_ref: features/lakes/booking/ExtrasStep.tsx:30-31,46-57,62-107
      - id: booking.rezerva-extra.c5
        text: "A per-night extra shows price × nights and the note „{price} lei/noapte · {n} noapte|nopți”; a per-stay extra shows its flat price and no note. Nights = lake-local midnights crossed."
        fish_ref: features/lakes/booking/ExtrasStep.tsx:52-53; features/lakes/booking/nights.ts:13-20
      - id: booking.rezerva-extra.c6
        text: "Each toggle re-quotes the selection with the sorted extras list (cached per stand/window/extras so toggling back shows the previous answer instantly)."
        fish_ref: services/queries/useBookingQuote.ts:13-15,34-48; features/lakes/booking/useBookingGridFlow.ts:163-170
      - id: booking.rezerva-extra.c7
        text: "Footer „Continuă” is disabled (and dimmed) while re-quoting or when the quote has no total; enabled it opens the review step."
        fish_ref: app/(app)/book-lake/[lakeId]/extras.tsx:21,31-43
      - id: booking.rezerva-extra.c8
        text: "Back returns to the grid with the selection kept; extras are reset on return to the grid."
        fish_ref: app/(app)/book-lake/[lakeId]/extras.tsx:28; features/lakes/booking/useBookingGridFlow.ts:127-132,304-308
    mobile_only: false
    status: todo

  # ─────────────────────────────────────────────────────────────────────────────────────────
  - id: booking.rezerva-confirmare
    title: Confirmă rezervarea
    fish:
      - app/(app)/book-lake/[lakeId]/review.tsx
      - app/(app)/book-lake/[lakeId]/__tests__/stepGuards.test.tsx
      - features/lakes/booking/BookingReview.tsx
      - features/lakes/booking/BookingConfirmSheet.tsx
      - features/lakes/booking/QuoteUnavailable.tsx
      - features/lakes/booking/BookingFlowProvider.tsx
      - features/lakes/booking/useBookingGridFlow.ts
      - features/bookings/ui/BookingCard.tsx
      - features/bookings/ui/chipModel.ts
      - features/bookings/ui/Chip.tsx
      - features/bookings/ui/DetailRows.tsx
      - features/bookings/ui/MetaRow.tsx
      - features/bookings/ui/StandBadge.tsx
      - features/bookings/ui/BookingActions.tsx
      - helpers/formatBookingPeriod.ts
      - schemas/phone.schema.ts
      - config/bookingFlags.ts
      - services/mutations/useCreateBooking.ts
      - services/mutations/useUpdateProfile.ts
      - services/mutations/invalidateOperatorSurfaces.ts
      - services/queries/useProfile.ts
      - services/queries/useBookingQuote.ts
    web_route: /balti/[id]/rezerva/confirmare
    template: T4
    milestone: M3
    roles: [angler, organizer, referee, operator]
    core:
      - booking.bookingQuoteQuery
      - booking.createBookingMutation (POST booking; invalidates bookingKeys.all + operator stats)
      - booking.domain.chipModel (buildBookingChips, durationLabel, rowLabelAddsMeaning)
      - booking.domain.bookingCard.cancellationPolicyText
      - social.profileQuery (prefill name/phone)
      - social.updateProfileMutation (write back an edited phone)
      - lakes.lakeQuery
      - friendlyBookingError + phone schema/sanitizer — not in core yet (fish review.tsx:37-69, schemas/phone.schema.ts)
      - formatBookingPeriod — not in core yet
    states:
      - signed-out (redirect to /intra)
      - reached without selection / stand / lake → back to the grid
      - quote loading („Se calculează prețul…”)
      - quote refused by the lake (server sentence + „Alege alt interval sau alt stand.”)
      - quote request failed (retry + back to selection)
      - priced, request lake (manual confirmation or offline payment) vs instant lake
      - payment mode deposit / full / offline (on site)
      - profile not yet loaded → fields fill in when it arrives
      - validation errors (name empty, phone empty/invalid, notes > 1000)
      - confirmation panel open (with / without regulation PDF; cancellation line only when money is collected up front)
      - submitting (button spinner, back frozen)
      - success (request sent / confirmed, optional code)
      - error 409 PRICE_CHANGED (with / without fresh total) → stay, re-quote
      - error STAND_TAKEN / STAND_BLOCKED → back to grid, selection cleared
      - other known codes / unknown error
      - online payment branch (flag-gated, dormant)
    criteria:
      - id: booking.rezerva-confirmare.c1
        text: "Without a selection, selected stand or loaded lake the step redirects to the grid before rendering anything."
        fish_ref: app/(app)/book-lake/[lakeId]/review.tsx:408-417; app/(app)/book-lake/[lakeId]/__tests__/stepGuards.test.tsx:58-61
      - id: booking.rezerva-confirmare.c2
        text: "Screen title „Confirmă rezervarea”; back goes one step back (extras or grid) and is ignored while the submit is in flight."
