behaviours:
  - id: booking.b.sign-in-gate
    text: "A booking belongs to an account: the lake CTA sends guests to sign-in first; every route of this area requires a session (web: redirect to /intra with return path)."
    fish_ref: app/(app)/lakes/[lakeId].tsx:271-279
  - id: booking.b.entry-points
    text: "Entry points: lake page booking CTA (bookingState enabled; legacy_phone scrolls to contact instead; otherwise booking-interest flow), lake availability tab, „Rezervă din nou” on a past booking, Setări „Rezervările mele”, home „Instrumente” Rezervări tile."
    fish_ref: app/(app)/lakes/[lakeId].tsx:262-292; app/(app)/settings.tsx:235-239; components/WidgetsList.tsx:86-91; app/(app)/bookings/[id].tsx:66-71
  - id: booking.b.notification-routes
    text: "Angler booking notifications (BOOKING_REQUEST_RECEIVED/CONFIRMED/REJECTED/CANCELLED/REMINDER/NO_SHOW/WALK_IN_ANGLER) open the booking detail; without bookingId nothing opens. Operator booking notifications go to the operator inbox (operator area)."
    fish_ref: helpers/getRedirectLocationForNotification.ts:135-157
  - id: booking.b.flow-state
    text: "The three steps share one flow state per visit (selection, retained selection for the panel, extras, quote); leaving the flow resets it. Back walks one step; a refused/dead selection returns straight to the grid (dismissTo). Web: the steps are real URLs; direct access without state redirects to the grid."
    fish_ref: features/lakes/booking/BookingFlowProvider.tsx:36-75; features/lakes/booking/useBookingGridFlow.ts:304-312
  - id: booking.b.server-priced
    text: "The client never prices a booking: every figure (selection panel, review, confirm) comes from the server quote, and the submit carries expectedTotal so a changed rate answers 409 instead of charging a different amount."
    fish_ref: features/lakes/booking/useBookingGridFlow.ts:149-170; app/(app)/book-lake/[lakeId]/review.tsx:159-183
  - id: booking.b.live-availability
    text: "Availability is live (staleTime 0) and refetched each time the grid regains focus; quotes are refetched immediately even when cached; both are invalidated after a price change or a taken/blocked stand."
    fish_ref: services/queries/useLakeAvailability.ts:18; services/queries/useBookingQuote.ts:17-22,46-47; app/(app)/book-lake/[lakeId]/index.tsx:31-37
  - id: booking.b.write-invalidation
    text: "Every booking write (create, cancel) invalidates the whole ['bookings'] root and ['operator-stats'], so home counts, my bookings, availability and operator surfaces refresh."
    fish_ref: services/mutations/invalidateOperatorSurfaces.ts:4-21
  - id: booking.b.lead-time
    text: "Slots starting within the lake's leadHours (default 24, mirrors backend BOOKING_TOO_SOON) are phone-only for anglers; operators (walk-in) are exempt."
    fish_ref: features/lakes/booking/availabilityStatus.ts:19-20,72-91; features/lakes/booking/BookingGridStep.tsx:28-31
  - id: booking.b.timezone
    text: "Month windows and nights are computed in the lake's IANA timezone (falls back to device-local); displayed times use the local clock; end times shown to the angler subtract the lake's checkoutBufferMinutes everywhere (panel, review, confirm, list, detail, timeline)."
    fish_ref: features/lakes/booking/availabilityPaging.ts:18-41; features/lakes/booking/nights.ts:13-20; helpers/formatBookingPeriod.ts:9-24
  - id: booking.b.double-submit-guard
    text: "Navigation into the flow is guarded against double taps (800ms window, navigate not push), and back is frozen while a booking submit is in flight."
    fish_ref: hooks/useNavigationGuard.ts:4-23; app/(app)/lakes/[lakeId].tsx:281-284; features/lakes/booking/useBookingGridFlow.ts:304-308
