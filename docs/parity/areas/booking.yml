# Parity inventory — area "booking" (Rezervă stand: grilă → extra → confirmare; Rezervările mele; Rezervare).
# Extracted from fish (read-only) on 2026-10-04. Line refs are fish file:line at that date.
# Out of scope here (other areas): the lake review form `lakes/review/[lakeId]` (lakes area, linked from
# this area), the operator walk-in flow `operator/[lakeId]/walk-in/*` (operator area, shares
# BookingFlowProvider/useBookingGridFlow/AvailabilityGrid with the angler flow below).
area: booking
screens:
  # ─────────────────────────────────────────────────────────────────────────────────────────
  - id: booking.rezerva-grila
    title: Rezervă — alege standul și intervalul
    fish:
      - app/(app)/book-lake/[lakeId]/_layout.tsx
      - app/(app)/book-lake/[lakeId]/index.tsx
      - features/lakes/booking/BookingFlowProvider.tsx
      - features/lakes/booking/useBookingGridFlow.ts
      - features/lakes/booking/BookingGridStep.tsx
      - features/lakes/booking/AvailabilityGrid.tsx
      - features/lakes/booking/GridBand.tsx
      - features/lakes/booking/gridGeometry.ts
      - features/lakes/booking/rowRuns.ts
      - features/lakes/booking/useGridSelection.ts
      - features/lakes/booking/availabilityStatus.ts
      - features/lakes/booking/availabilityPaging.ts
      - features/lakes/booking/timezone.ts
      - features/lakes/booking/offeredExtras.ts
      - features/lakes/booking/nights.ts
      - features/lakes/booking/BookingSelectionSheetHost.tsx
      - features/lakes/booking/BookingSelectionSheet.tsx
      - features/lakes/booking/TooSoonSheet.tsx
      - features/lakes/booking/CompetitionBlockSheet.tsx
      - features/operator/blockReasons.ts
      - features/bookings/ui/chipModel.ts
      - helpers/formatBookingPeriod.ts
      - services/queries/useLake.ts
      - services/queries/useLakeAvailability.ts
      - services/queries/useBookingQuote.ts
      - app/(app)/lakes/[lakeId].tsx
      - features/lakes/booking/LakeAvailabilityTab.tsx
    web_route: /balti/[id]/rezerva
    template: T4
    milestone: M3
    roles: [angler, organizer, referee, operator]
    core:
      - lakes.lakeQuery (lake name, contact phone, paymentMode, depositPercent, checkoutBufferMinutes)
      - booking.lakeAvailabilityInfiniteQuery (month pages via monthWindow, staleTime 0)
      - booking.domain.mergePages / monthWindow
      - booking.domain.gridGeometry (days, bands, headerSlots, formatInterval, formatSelectionLabel, formatSlotLabel)
      - booking.domain.rowRuns (mergeRowBands)
      - booking.domain.gridSelection (toggleSelectionCell, selectDaySelection, computeDaySelection, seedFromSelection, isCellSelected, selectionFromState)
      - booking.domain.availabilityStatus (indexExceptions, resolveSlotStatus, cellA11yLabel, BOOKING_LEAD_HOURS)
      - booking.domain.offeredExtras + countNights + timezone
      - booking.domain.chipModel (durationLabel, rowLabelAddsMeaning)
      - booking.domain.blockReasons (BLOCK_REASON_LABELS)
      - booking.bookingQuoteQuery (POST /feed/lakes/:id/quote, placeholder = previous, staleTime 0)
      - formatBookingPoint / formatBookingPeriod — not in core yet (fish helpers/formatBookingPeriod.ts; core has only dates primitives)
    states:
      - signed-out (lake page CTA sends to sign-in; direct URL must redirect to /intra and return here)
      - lake or first availability page loading → grid skeleton (10 rows × 4 days)
      - availability error with no cached data → inline error + „Încearcă din nou”
      - booking disabled for the lake → „Rezervările nu sunt disponibile”
      - no stands / no slots in range → „Nicio disponibilitate”
      - grid loaded, no selection (header + legend visible)
      - next month page fetching (placeholder column + spinner in header)
      - selection made, quote loading („se calculează”)
      - selection made, quote priced (Continuă enabled)
      - selection made, quote refused by the lake (server sentence, price „—”, Continuă disabled)
      - selection made, quote request failed („Nu am putut calcula prețul” + retry)
      - selection made, stand offers extras for this tour („Poți adăuga extra la pasul următor.”)
      - selection, payment mode deposit / full / offline (different note under the price)
      - slot inside the lead time (yellow, phone only) → too-soon panel, with / without lake phone
      - blocked slot by competition (trophy, panel with „Vezi concursul”) / by operator note / plain block
      - booked slot (red with booker initials, not selectable)
      - past slot (dashed, dimmed) → toast
      - selection scrolled out of view → chevron hint at the right edge
      - returning from extras/review with a selection → grid re-seeded and scrolled to its day
