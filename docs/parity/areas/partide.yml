      - id: partide.partida-lansete.c10
        text: "Countdowns tick every second on the server-corrected clock; when a rod's deadline passes the rod moves to the fired state."
        fish_ref: "features/partide/scenes/CronometreScene.tsx:66-99"
      - id: partide.partida-lansete.c11
        text: "Below the cards a dashed „Adaugă lansetă” tile is shown while fewer than 4 rods exist."
        fish_ref: "features/partide/scenes/CronometreScene.tsx:37,101-104,232-250"
      - id: partide.partida-lansete.c12
        text: "Offline, outcome, capture, add and configure actions are refused with „Fără conexiune. Reconectare…”."
        fish_ref: "features/partide/scenes/CronometreScene.tsx:49-60,164-169"
      - id: partide.partida-lansete.c13
