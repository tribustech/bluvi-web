# Parity inventory — area: partide (personal fishing sessions + Partide community)
#
# fish sources: app/(app)/(tabs)/partide.tsx, app/(app)/partide/** (15 screens), app/(app)/timer/**,
# features/partide/**. Paths below are relative to fish/.
#
# Identity note (read before building any route here): fish has TWO ids for a partidă.
#   - clientId  — client-minted, the Firestore session id; the param of fish /partide/[id] (own/member view),
#                 of /partide/captura?sessionClientId= and of the PARTIDA_FINISHED / AUTO_CLOSE_WARN push.
#   - documentId — Strapi id; the param of fish /partide/comunitate/[id] (spectator view), of the share link
#                 and of every community DTO.
# The web keys every partidă page on the documentId (lib/routes.ts `partida(documentId)` = /partide/[id]) and
# renders the member view or the spectator view on the same URL depending on whether the viewer is a member
# (fish does the same switch: comunitate/[id] replaces itself with the own view for the live session, and
# useOpenPartida picks own vs spectator). A clientId arriving from a push/deep link is resolved to the
# documentId through the cached /feed/sessions/mine list (core/partide findMineListItem) — see behaviours.
#
# Live data note: the active partidă is a Firestore projection (core/realtime/partide) — rods, rod runtimes,
# catches and markers stream from Firestore, writes go through the CMS (/feed/sessions/*). Rod TIMERS and
# their alarms are device features (ROADMAP §3): the web shows a running countdown read-only but schedules
# no alarm, and the rod configuration screen (rod-config) is mobile only.
area: partide
screens:
  # ───────────────────────────────────────────────────────────────────────────────────────────────
