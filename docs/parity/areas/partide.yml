        status: passing
        note: "e2e tests/e2e/partide-exploreaza.spec.ts. Web: T1 FilterBar «Filtre partide» (owner rule 2), LIVE in the live tone when on; the place rides in the URL (?live=1, ?filtru=notificari|prieteni, ?loc=lake:<id>|water:<code>), and «Șterge filtrele» at the bar's end once anything is chosen."
