behaviours:
  - id: partide.b.deep-link-spectate
    text: "Share link https://bluvi-app.wearetribus.com/partide/comunitate/{documentId} (AASA covers /partide/*) must open the web spectator/member page: /partide/comunitate/[id] redirects (308) to /partide/[id]."
    fish_ref: "features/partide/helpers/deepLinks.ts:19-31"
  - id: partide.b.deep-link-join
    text: "Invite link https://bluvi-app.wearetribus.com/partide/join/{code} must work on web: /partide/join/[code] redirects to /partide/intra/[cod] (sign-in first when signed out, then back)."
    fish_ref: "features/partide/components/CoopCard.tsx:38-39"
  - id: partide.b.notif-invite
    text: "Notification PARTIDA_INVITE (data.partidaCode) routes to /partide/intra/[cod]; missing code → no navigation."
    fish_ref: "helpers/getRedirectLocationForNotification.ts:104-106"
  - id: partide.b.notif-finished-autoclose
    text: "PARTIDA_FINISHED and PARTIDA_AUTO_CLOSE_WARN carry the session CLIENT id (data.sessionId); the web resolves it to the documentId through the own sessions list (or the live pointer) and opens /partide/[documentId]; unresolvable → Partide „Ale mele”."
    fish_ref: "helpers/getRedirectLocationForNotification.ts:107-116"
  - id: partide.b.notif-community
    text: "PARTIDA_CATCH, PARTIDA_FINISHED_FOLLOWED, FOLLOW_PARTIDA_START and FOLLOW_PARTIDA_FIRST_CATCH (data.sessionDocumentId) open /partide/[documentId]; FOLLOW_RECORD_PERSONAL / FOLLOW_RECORD_LAKE open /partide/[documentId]/capturi."
    fish_ref: "helpers/getRedirectLocationForNotification.ts:117-123,178-185"
  - id: partide.b.signin-gating
    text: "Signed-out: start, join (both), pescari redirect to sign-in; the Ale mele tab shows the sign-in wall; the Pescari quick-nav tile and the follow bell push sign-in; Comunitate, Explorează, statistici, clasament and spectator pages are public."
    fish_ref: "features/partide/scenes/AcasaScene.tsx:119-126"
  - id: partide.b.own-vs-spectator
    text: "Opening a community partidă resolves own vs spectator: the device's active pointer or the cached own list → member view, otherwise spectator; the spectator page also self-redirects when getActiveSession matches."
    fish_ref: "features/partide/community/useOpenPartida.ts:28-43"
  - id: partide.b.live-subscription
    text: "Signed in, the active partidă pointer is hydrated from GET /feed/sessions/active at start and the session is followed live (Firestore: meta, rods, catches, markers); unsubscribed on sign-out; listener permission errors confirm access over REST (kicked / deleted → cleanup + toast, valid → backoff retry 1/2/4 s, unknown → wait for online)."
    fish_ref: "features/partide/domain/useLiveMount.ts:1-60,215-260"
  - id: partide.b.offline-writes
    text: "Every partidă write (capture, outcome, delete, marker, add/configure rod) is refused offline with „Fără conexiune. Reconectare…”; reads of the live projection stay available."
    fish_ref: "features/partide/scenes/CronometreScene.tsx:49-60"
  - id: partide.b.refetch-intervals
    text: "Polling: community overview 60 s, venue section 60 s, community session 60 s while live (+ on focus/reconnect); stale times: active/history 30 s / 120 s, stats 120 s (60 s per venue), own sessions 5 min."
    fish_ref: "features/partide/community/hooks.ts:65-213"
  - id: partide.b.community-purge-grace
    text: "After finishing a partidă or saving a catch, community queries are invalidated after a 2 s grace (edge-cache purge), not immediately."
    fish_ref: "app/(app)/partide/[id].tsx:247-252"
  - id: partide.b.private-partida
    text: "A private partidă (visibleOnProfile false) offers no share link and does not appear in community feeds; photo tags only affect galleries when the partidă is public."
    fish_ref: "features/partide/helpers/deepLinks.ts:30-31"
  - id: partide.b.nou-badge
    text: "The Partide nav entry shows a „NOU” pill until the first visit (persisted flag) and only before PARTIDE_NEW_BADGE_UNTIL (2026-09-18, already past — so no badge today); an unknown flag shows no badge. Web: not needed unless the owner re-dates it."
    fish_ref: "features/partide/domain/viewAtoms.ts:54-100"
  - id: partide.b.venue-partide-pages
    text: "Venue partide pages and venue stats/leaderboards (/balti/[id]/partide, /ape-publice/[code]/partide …) are inventoried in the lakes and public-waters areas; this area links to them via venuePartideHref."
    fish_ref: "features/partide/community/venuePartideHref.ts:15-24"
  - id: partide.b.server-clock
    text: "Rod countdowns everywhere (dock, Lansete) use the server-corrected clock and show a provisional „sincronizare…” label while the projection is from cache or the clock is unsampled — never a false „expirat”."
    fish_ref: "features/partide/components/ActivePartidaDock.tsx:47-58"
  - id: partide.b.active-dock-global
    text: "The live-partidă dock appears on the Partide pages whenever the viewer has an active partidă; on web the home page already has its own ActivePartida card (home area)."
    fish_ref: "app/(app)/(tabs)/partide.tsx:279-282"
