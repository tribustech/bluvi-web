    milestone: M4
    roles: [guest, angler, organizer, referee, operator]
    core:
      - "core/partide communityOverviewQuery (GET /feed/community/overview, staleTime 30s, refetchInterval 60s)"
      - "core/partide communityHistoryInfiniteQuery([]) (only page 0, only when overview has no live venue)"
      - "core/partide/domain communityView (buildDashboardPartideSection, buildRecordSlots, relativeRo, membersLabel)"
      - "core/partide/domain cardModel (liveCardShape, venueCountLabel, standLabel/standSuffix, barFraction, fmtSpan, fmtRange, agoRo, isDuelLeader)"
      - "core/partide/domain venuePartideHref, photoSources (gridSource, thumbSource)"
      - "core/partide/domain format (fmtKg, fmtDurationCompact)"
      - "core/realtime/partide (active partidă for the top CTA vs live dock)"
    states:
      - loading (overview in flight, or no live venue and history page 0 in flight) → dashboard skeleton
      - live — „În direct” with up to 5 live venue cards (solo / duel / leaderboard shapes)
      - finished fallback — „Ultimele partide” with up to 3 finished cards
      - empty — „Partide active” with the tutorial prose
      - Ultimele capturi rail hidden when overview.latestCatches is empty
      - Locuri populare hidden when overview.popularVenues is empty
      - record windows empty → invitation tiles
      - viewer has an active partidă (top CTA hidden, start pill hidden, live dock shown)
      - signed-out (browsable read-only; Pescari tile → sign-in)
      - overview error (retry false → renders as empty sections)
