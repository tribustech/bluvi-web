        text: "No rods: illustration, „Nicio lansetă încă”, „Adaugă o lansetă ca să-ți notezi momeala și capturile. Cronometrul e opțional.” and „Adaugă lansetă”."
        fish_ref: "features/partide/scenes/CronometreScene.tsx:252-266"
      - id: partide.partida-lansete.c2
        text: "Each rod card has a left border in the rod colour, a badge „L{index}” (indigo ring + clock bubble when a timer is configured), the lane + distance title („Stânga/Centru/Dreapta · {m} m”), and, when the rod has bites, captures count, best kg and „{n} trăsătură/trăsături”."
        fish_ref: "features/partide/components/PartidaRodCard.tsx:170-258"
      - id: partide.partida-lansete.c3
        text: "Idle rods show the bait line (or „Momeală necunoscută”); a running rod shows „Timp rămas” with a live countdown, an expired one „Expirat” in red, a provisional one „Se sincronizează” in grey."
        fish_ref: "features/partide/components/PartidaRodCard.tsx:329-339,643"
      - id: partide.partida-lansete.c4
        text: "Every rod card has three outcome buttons: „Fără trăsătură”, „Scăpat”, „Captură” (green, emphasised); Captură opens the capture flow for that rod."
        fish_ref: "features/partide/components/PartidaRodCard.tsx:385-401"
      - id: partide.partida-lansete.c5
        text: "„Scăpat” / „Fără trăsătură” on the same rod within 60 s of the previous identical outcome is refused with „Ai marcat deja «scăpat» pe lanseta asta acum {s}s. Un pește nu scapă de două ori într-un minut 🎣” / „Ai marcat deja «fără trăsătură» acum {s}s. Stai un pic până la următoarea aruncare 🎣”."
        fish_ref: "features/partide/helpers/partideSpam.ts:8-55"
      - id: partide.partida-lansete.c6
