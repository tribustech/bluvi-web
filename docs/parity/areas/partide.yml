        fish_ref: "features/partide/scenes/CronometreScene.tsx:147-157"
      - id: partide.partida-lansete.c8
        text: "A capture in the same rod bucket (or the free bucket) within 30 s of the previous one asks „Sigur adaugi altă captură?” / „Ai adăugat o captură acum {s}s. Ești sigur că vrei să adaugi alta?” with „Da, adaug” / „Anulează”."
        fish_ref: "features/partide/scenes/useCaptureFlow.tsx:38-60"
      - id: partide.partida-lansete.c9
