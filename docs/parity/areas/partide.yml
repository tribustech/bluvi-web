    web_route: "/partide/[id] (vizualizare membru; [id] = documentId; ?tab=lansete|jurnal|galerie|statistici|setari)"
    template: T3
    milestone: M4
    roles: [angler, organizer, referee, operator]
    core:
      - "core/realtime/partide (live subscription, activePartidaOf, applyLiveSnapshot, pointer, waitForProjection)"
      - "core/partide partidaDetailQuery (GET /feed/sessions/:documentId for non-live partide), partideHistoryQuery"
      - "core/partide mutations finishPartidaMutation, leavePartidaMutation, deletePartidaMutation, kickPartidaMemberMutation, rotatePartidaJoinCodeMutation, invalidateMembershipCaches"
      - "core/partide api extendSession (auto-close „Da, continui”), patchSession (anchor)"
      - "core/partide/domain historyMappers (dtoToLocalSession, dtoToLocalEvent), historySelectors (findMineListItem), venueRef (sessionSubtitle), format (fmtEndedSubtitle), sessionAccess"
      - "core/social sendFeedback (feedback sheet)"
      - "MISSING pure ports: helpers/partidaTabs (visibleTabs, initialTab), helpers/deepLinks (partidaSpectateDeepLink, shareVisible), helpers/feedbackNudge (shouldShowNudge, history)"
    states:
      - preparing (active pointer known, snapshot not yet arrived) → „Se pregătește partida…”
      - not found
      - summary only (list row known, detail in flight) → skeleton
      - detail download failed → „Nu am putut descărca partida” + retry
      - live (5 tabs) / ended (4 tabs, no Lansete)
      - live and offline → „Reconectare…” banner
      - owner vs member (guest) vs not-synced (no membershipDocumentId)
      - private partidă (no share)
      - auto-close warning pending (owner)
      - access revoked while open (kicked / deleted)
      - feedback nudge visible / hint after dismiss
    criteria:
      - id: partide.partida.c1
        text: "The header shows a back control („Înapoi”), the venue name (lake → public water → manual name → anchor name → „Partidă”) and a subtitle: for a live partidă „{sessionSubtitle} · {n lansetă/lansete}” (rod part only when rods exist), for an ended one fmtEndedSubtitle(start, end)."
        fish_ref: "app/(app)/partide/[id].tsx:70-79,520-526"
      - id: partide.partida.c2
        text: "A red „Termină” header action („Termină partida”) appears only for the owner (hostUid = viewer) of a live, synced partidă and opens the finish confirmation."
        fish_ref: "app/(app)/partide/[id].tsx:524"
      - id: partide.partida.c3
        text: "A share action („Distribuie partida”) appears only when the partidă is public (visibleOnProfile !== false) and its documentId is known; it shares „Vezi partida mea pe Bluvi 🎣 https://bluvi-app.wearetribus.com/partide/comunitate/{documentId}” (web: system share or copy link)."
        fish_ref: "app/(app)/partide/[id].tsx:164-174"
      - id: partide.partida.c4
        text: "Tabs: live → „Lansete”, „Jurnal”, „Galerie”, „Statistici”, „Setări”; ended → the same without „Lansete”. The „Jurnal” tab carries a count badge of all events when > 0."
        fish_ref: "features/partide/helpers/partidaTabs.ts:8-10"
      - id: partide.partida.c5
        text: "Initial tab: ended → Jurnal; live with ≥1 rod → Lansete; live with no rod → Jurnal. When the partidă ends while open, the selected tab is kept if it still exists, else the initial tab is chosen."
        fish_ref: "features/partide/helpers/partidaTabs.ts:13-16"
      - id: partide.partida.c6
        text: "If the session is not known yet but it is the device's active pointer, the page shows a spinner and „Se pregătește partida…”."
        fish_ref: "app/(app)/partide/[id].tsx:433-446"
      - id: partide.partida.c7
        text: "Unknown session: „Partida nu a fost găsită” / „Poate a fost ștearsă sau încă nu s-a sincronizat.”"
        fish_ref: "app/(app)/partide/[id].tsx:447-459"
      - id: partide.partida.c8
        text: "Only the list summary known: the detail skeleton; if the detail request failed: cloud-off icon, „Nu am putut descărca partida”, „Ai nevoie de conexiune pentru a descărca această partidă.” and „Reîncearcă” (invalidates the detail query)."
        fish_ref: "app/(app)/partide/[id].tsx:462-492"
      - id: partide.partida.c9
        text: "A live partidă viewed while offline shows an amber banner „Reconectare…” under the header."
        fish_ref: "app/(app)/partide/[id].tsx:529-543"
      - id: partide.partida.c10
        text: "The finish confirmation shows „Termină partida?”, venue · stand/anchor, three stats (Durată „{h}h {mm}m”, Capturi, „Cea mai mare” kg or „—”), „Partida va fi arhivată în partidele tale. Cronometrele active se vor opri.” and buttons „Termină partida” (red) / „Continuă”."
        fish_ref: "features/partide/components/FinishPartidaSheet.tsx:70-145"
      - id: partide.partida.c11
        text: "Finishing the device's live partidă stops all rod timers, POSTs finish, clears the active pointer and navigates back; finishing a non-live synced partidă calls finish, invalidates the mine list + detail and, after a 2 s purge grace, every community query; failure → „Ceva n-a mers. Încearcă din nou.”"
        fish_ref: "app/(app)/partide/[id].tsx:223-258"
      - id: partide.partida.c12
        text: "Finish is possible only for the owner of an active partidă with a synced membership documentId; otherwise „Partida nu s-a sincronizat încă.”"
        fish_ref: "app/(app)/partide/[id].tsx:224,238-241"
      - id: partide.partida.c13
        text: "When the owner's live partidă carries warnedAt (server auto-close sweep), a dialog „Încă pescuiești?” / „Se închide automat în {countdown}” opens with „Da, continui” (extends the session; failure → „Nu am putut prelungi partida. Încearcă din nou.”) and „Nu, închid partida” (finishes)."
        fish_ref: "app/(app)/partide/[id].tsx:278-303"
      - id: partide.partida.c14
        text: "Delete (owner with documentId only): dialog „Ștergi această partidă?” stating what is lost („Se șterg definitiv {n capturi} și {n fotografii}, împreună cu tot jurnalul partidei.” + teammate sentence + „Acțiunea nu poate fi anulată.”) and a hold-to-confirm „Ține apăsat pentru a șterge”; success toast „Partida a fost ștearsă.”, failure inline „Nu am putut șterge partida. Încearcă din nou.”"
        fish_ref: "features/partide/components/DeletePartidaSheet.tsx:30-104"
      - id: partide.partida.c15
        text: "Leave (non-owner member of a live partidă): dialog „Părăsești partida?” with the access-loss explanation and „Părăsește partida”; success „Ai părăsit partida.”, failure „Nu am putut părăsi partida. Încearcă din nou.”"
        fish_ref: "features/partide/components/SessionMembershipSheet.tsx:29-41"
      - id: partide.partida.c16
        text: "Kick (owner, not on the host): dialog „Elimini participantul?” naming the member, stating the code is rotated automatically, button „Elimină participantul”; success „Participant eliminat. Codul a fost schimbat.”, failure „Nu am putut elimina participantul. Încearcă din nou.”"
        fish_ref: "app/(app)/partide/[id].tsx:340-391"
      - id: partide.partida.c17
        text: "Rotate join code (owner, live): dialog „Schimbi codul de acces?” / „Codul și linkurile trimise anterior nu vor mai funcționa.” / „Schimbă codul”; success „Codul de acces a fost schimbat.”, failure inline „Codul nu a putut fi schimbat. Încearcă din nou.”"
        fish_ref: "features/partide/components/RotateJoinCodeSheet.tsx:52-70"
      - id: partide.partida.c18
        text: "Every membership/delete/rotate confirmation is single-flight: the confirm button shows pending and repeated activation is ignored until it settles."
        fish_ref: "app/(app)/partide/[id].tsx:315-330,367-375,408-412"
      - id: partide.partida.c19
        text: "„Ajustează poziția” opens a map point picker centred on the anchor (satellite, close zoom) or on Romania (standard, wide) when there is no anchor; confirming patches anchorLat/anchorLng."
        fish_ref: "app/(app)/partide/[id].tsx:683-696"
      - id: partide.partida.c20
        text: "If the viewer loses access while the live partidă is open (kicked → „Ai fost eliminat din partidă.”, deleted → „Partida a fost ștearsă.”), local live state is cleared and the page navigates away."
        fish_ref: "features/partide/domain/useLiveMount.ts:215-241"
      - id: partide.partida.c21
        text: "For a live partidă with ≥3 captures or ≥4 h elapsed, a feedback nudge row „Ceva de îmbunătățit?” / „Spune-ne ce nu merge sau ce ți-ar plăcea să existe.” appears under the tabs; its X („Ascunde”) records the answer and shows „Bine. O găsești oricând în Info › Raportează o problemă.” for 3.5 s."
        fish_ref: "features/partide/components/PartidaFeedbackBar.tsx:40-139"
      - id: partide.partida.c22
        text: "The feedback dialog „Spune-ne ce nu merge” offers categories „Problemă tehnică” / „Idee nouă”, a text field (max 1000) and „Trimite”; sends feedback with session metadata (clientId, documentId, captures, elapsed); toasts „Mulțumim! Mesajul a ajuns la echipă.” / „N-am putut trimite mesajul. Mai încearcă o dată.”"
        fish_ref: "features/partide/components/PartidaFeedbackSheet.tsx:23-225"
      - id: partide.partida.c23
        text: "The live partidă reads from the realtime projection (Firestore); a non-live partidă reads GET /feed/sessions/:documentId; the documentId is taken from the active pointer or the cached mine list."
        fish_ref: "features/partide/domain/hooks.ts:592-672"
    mobile_only: false
    status: todo

