        text: "Every rod card has three outcome buttons: „Fără trăsătură”, „Scăpat”, „Captură” (green, emphasised); Captură opens the capture flow for that rod."
        fish_ref: "features/partide/components/PartidaRodCard.tsx:385-401"
      - id: partide.partida-lansete.c5
        text: "„Scăpat” / „Fără trăsătură” on the same rod within 60 s of the previous identical outcome is refused with „Ai marcat deja «scăpat» pe lanseta asta acum {s}s. Un pește nu scapă de două ori într-un minut 🎣” / „Ai marcat deja «fără trăsătură» acum {s}s. Stai un pic până la următoarea aruncare 🎣”."
