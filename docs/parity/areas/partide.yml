      - features/partide/community/useOpenPartida.ts
      - features/partide/community/venuePartideHref.ts
      - features/partide/components/PartideSkeletons.tsx
      - services/queries/useVenueSearch.ts
    web_route: /partide/exploreaza
    template: T1
    milestone: M4
    roles: [guest, angler, organizer, referee, operator]
    core:
      - "core/partide communityActiveInfiniteQuery(venueKeys) (cursor, pageSize 10, staleTime 30s)"
      - "core/partide communityHistoryInfiniteQuery(venueKeys) (page, pageSize 10, staleTime 120s)"
      - "core/partide sessionFollowsQuery (signed in only), followedAnglerUidsQuery (all /following pages, pageSize 100)"
      - "core/partide/domain communityView (filterVenues, filterHistoryRows, endReachedTarget, shouldShowLiveHeader, lakeCardToVenue, publicWaterToVenue)"
      - "core/partide/domain historySelectors resolveOwnPartidaClientId (own vs spectator open)"
      - "core/lakes venueSearchLakesQuery + createHttpPublicWatersSource searchPublicWaters (components/partide/venue/useVenueSearch = fish useVenueSearch)"
    states:
      - loading (live page 1 in flight and never loaded before) → list skeleton
      - live section present / absent; live page filtered to zero with more pages (hint row)
      - finished section present / absent
      - LIVE-only mode („Vezi toate” / LIVE chip)
      - chip „Cu notificări” (followed sessions), chip „Prieteni” (followed anglers)
      - venue filter applied (single venue, lake or public water)
      - overall empty with no filters
      - empty for filters (prieteni / other) with „Șterge filtrele”
      - LIVE-only empty
      - history error with no rows
      - history first page in flight (no empty message)
      - "venue picker dialog: browse (recents + live venues) / search results / no results"
      - signed-out (Cu notificări and Prieteni match nothing)
