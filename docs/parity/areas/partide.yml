# Parity inventory — area: partide (personal fishing sessions + Partide community)
#
# fish sources: app/(app)/(tabs)/partide.tsx, app/(app)/partide/** (15 screens), app/(app)/timer/**,
# features/partide/**. Paths below are relative to fish/.
#
# Identity note (read before building any route here): fish has TWO ids for a partidă.
#   - clientId  — client-minted, the Firestore session id; the param of fish /partide/[id] (own/member view),
#                 of /partide/captura?sessionClientId= and of the PARTIDA_FINISHED / AUTO_CLOSE_WARN push.
#   - documentId — Strapi id; the param of fish /partide/comunitate/[id] (spectator view), of the share link
#                 and of every community DTO.
# The web keys every partidă page on the documentId (lib/routes.ts `partida(documentId)` = /partide/[id]) and
# renders the member view or the spectator view on the same URL depending on whether the viewer is a member
# (fish does the same switch: comunitate/[id] replaces itself with the own view for the live session, and
# useOpenPartida picks own vs spectator). A clientId arriving from a push/deep link is resolved to the
# documentId through the cached /feed/sessions/mine list (core/partide findMineListItem) — see behaviours.
#
# Live data note: the active partidă is a Firestore projection (core/realtime/partide) — rods, rod runtimes,
# catches and markers stream from Firestore, writes go through the CMS (/feed/sessions/*). Rod TIMERS and
# their alarms are device features (ROADMAP §3): the web shows a running countdown read-only but schedules
# no alarm, and the rod configuration screen (rod-config) is mobile only.
area: partide
screens:
  # ───────────────────────────────────────────────────────────────────────────────────────────────
  - id: partide.comunitate
    title: Partide — Comunitate
    fish:
      - "app/(app)/(tabs)/partide.tsx"
      - features/partide/components/PartideChrome.tsx
      - features/partide/domain/viewAtoms.ts
      - features/partide/scenes/AcasaScene.tsx
      - features/partide/components/community/NoActiveCta.tsx
      - features/partide/components/community/QuickNavRow.tsx
      - features/partide/components/community/LatestCatchesRail.tsx
      - features/partide/components/community/VenueGroup.tsx
      - features/partide/components/community/CommunityHistoryCard.tsx
      - features/partide/components/community/ExploreCta.tsx
      - features/partide/components/community/RecordsGrid.tsx
      - features/partide/components/community/PopularVenues.tsx
      - features/partide/components/community/AnglerAvatars.tsx
      - features/partide/components/card/PartidaCard.tsx
      - features/partide/components/card/CardHeader.tsx
      - features/partide/components/card/StatStrip.tsx
      - features/partide/components/card/PhotoStrip.tsx
      - features/partide/components/card/Duel.tsx
      - features/partide/components/card/Leaderboard.tsx
      - features/partide/components/card/CardFooter.tsx
      - features/partide/components/card/cardModel.ts
      - features/partide/components/ActivePartidaDock.tsx
      - features/partide/components/PartideSkeletons.tsx
      - features/partide/community/hooks.ts
      - features/partide/community/view.ts
      - features/partide/community/venuePartideHref.ts
      - features/partide/community/photoSources.ts
      - features/partide/hooks/useNowTick.ts
    web_route: /partide
    template: T5
    milestone: M4
    roles: [guest, angler, organizer, referee, operator]
    core:
      - "core/partide communityOverviewQuery (GET /feed/community/overview, staleTime 30s, refetchInterval 60s)"
      - "core/partide communityHistoryInfiniteQuery([]) (only page 0, only when overview has no live venue)"
      - "core/partide/domain communityView (buildDashboardPartideSection, buildRecordSlots, relativeRo, membersLabel)"
      - "core/partide/domain cardModel (liveCardShape, venueCountLabel, standLabel/standSuffix, barFraction, fmtSpan, fmtRange, agoRo, isDuelLeader)"
      - "core/partide/domain venuePartideHref, photoSources (gridSource, thumbSource)"
      - "core/partide/domain format (fmtKg, fmtDurationCompact)"
      - "core/realtime/partide (active partidă for the top CTA vs live dock)"
    states:
      - loading (overview in flight, or no live venue and history page 0 in flight) → dashboard skeleton
      - live — „În direct” with up to 5 live venue cards (solo / duel / leaderboard shapes)
      - finished fallback — „Ultimele partide” with up to 3 finished cards
      - empty — „Partide active” with the tutorial prose
      - Ultimele capturi rail hidden when overview.latestCatches is empty
      - Locuri populare hidden when overview.popularVenues is empty
      - record windows empty → invitation tiles
      - viewer has an active partidă (top CTA hidden, start pill hidden, live dock shown)
      - signed-out (browsable read-only; Pescari tile → sign-in)
      - overview error (retry false → renders as empty sections)
    criteria:
      - id: partide.comunitate.c1
        text: "The page header shows the title „Partide” and, only when the viewer has NO active partidă, an indigo „Începe” pill (plus icon) that opens /partide/incepe."
        fish_ref: "features/partide/components/PartideChrome.tsx:39-65"
      - id: partide.comunitate.c2
        text: "Under the title an underline tab row offers „Comunitate” (this page, default), „Explorează” and „Ale mele”; the active tab is indigo with a 2.5px underline; re-selecting the active tab scrolls the page back to the top."
        fish_ref: "features/partide/components/PartideChrome.tsx:12-16"
      - id: partide.comunitate.c3
        text: "The sub-tab choice is not persisted: opening Partide fresh always lands on „Comunitate”."
        fish_ref: "features/partide/domain/viewAtoms.ts:6-8"
      - id: partide.comunitate.c4
        text: "Without an active partidă the page opens with the indigo hero card „Ești la pescuit?” / „Capturi, lansete și cronometre — totul notat într-o singură partidă.” with a white „Începe o partidă” pill (→ /partide/incepe) and an underlined „Intră cu cod” link (→ /partide/intra)."
        fish_ref: "features/partide/components/community/NoActiveCta.tsx:72-111"
      - id: partide.comunitate.c5
        text: "With an active partidă the hero card is not rendered; the live partidă is shown in the ActivePartidaDock instead (no duplicate)."
        fish_ref: "app/(app)/(tabs)/partide.tsx:223-229"
      - id: partide.comunitate.c6
        text: "A quick-nav row of three tiles: „Statistici” (→ /partide/statistici), „Clasamente” (→ /partide/clasament), „Pescari” (→ /pescari when signed in, → sign-in when signed out)."
        fish_ref: "features/partide/scenes/AcasaScene.tsx:115-130"
      - id: partide.comunitate.c7
        text: "„Ultimele capturi” is a horizontal rail of overview.latestCatches, shown only when non-empty; each landscape 4:3 card shows the photo (lake placeholder fallback), a relative-time badge (relativeRo), the weight in kg (omitted when weightKg is null — never „0,0 kg”), species (fallback „Captură”), venue name with a pin icon and the angler avatars (+ extra members)."
        fish_ref: "features/partide/components/community/LatestCatchesRail.tsx:23-107"
      - id: partide.comunitate.c8
        text: "Activating a latest-catch card opens that catch's partidă (/partide/[sessionDocumentId]); rail keys are sessionDocumentId:clientId (clientId alone is not unique across sessions)."
        fish_ref: "features/partide/components/community/LatestCatchesRail.tsx:126-132"
      - id: partide.comunitate.c9
        text: "The middle section title is „În direct” when overview.activeVenues is non-empty (up to 5 venue cards), else „Ultimele partide” (first 3 rows of /feed/community/history page 1), else „Partide active” — live and finished cards never render together."
        fish_ref: "features/partide/scenes/AcasaScene.tsx:143-145"
      - id: partide.comunitate.c10
        text: "The community history request is made only after overview resolved with zero live venues; while it is pending the whole dashboard keeps its skeleton (no flash of the empty prose)."
        fish_ref: "features/partide/scenes/AcasaScene.tsx:76-86"
      - id: partide.comunitate.c11
        text: "Empty middle section shows two captions: „O partidă poate fi solo sau cu 2-3 pescari împreună.” and „Nicio partidă publică activă acum.”"
        fish_ref: "features/partide/scenes/AcasaScene.tsx:181-191"
      - id: partide.comunitate.c12
        text: "The middle section header has a „Vezi toate” link that switches to the „Explorează” tab; below the section the indigo banner „Vrei să vezi ce au prins alții?” / „Explorează capturile din comunitate” does the same."
        fish_ref: "features/partide/scenes/AcasaScene.tsx:160-195"
      - id: partide.comunitate.c13
        text: "A live venue with exactly 1 session renders the solo card: ribbon „Live”, members avatars + members label as title, venue name (+ stand suffix) as meta, stats (capturi count, „kg total” accent or „—”, duration „de pescuit”), photo strip, footer „Ultima captură {ago}” or „Începută {ago}” and link „Vezi partida”; the whole card opens that partidă."
        fish_ref: "features/partide/components/community/VenueGroup.tsx:38-72"
      - id: partide.comunitate.c14
        text: "A live venue with exactly 2 sessions renders the duel card: ribbon „Duel live”, venue image + name, meta „{localitate} · {N standuri în duel}”, two sides (members, stand, captures, kg, leader highlighted by isDuelLeader); each side opens its own partidă; the shell and the „Vezi duelul” link open the venue's partide page (venuePartideHref), falling back to side A's partidă."
        fish_ref: "features/partide/components/community/VenueGroup.tsx:75-131"
      - id: partide.comunitate.c15
        text: "A live venue with more than 2 sessions renders the leaderboard card: ribbon „Live”, venue header, one row per session (stand, members, kg, relative bar vs the leader; rows containing the viewer are marked „self”); each row opens its partidă; shell + „Vezi partidele ›” open the venue's partide page, else the lake page, else the leading partidă."
        fish_ref: "features/partide/components/community/VenueGroup.tsx:134-188"
      - id: partide.comunitate.c16
        text: "Venue partide page links: lake venue → /balti/[lakeId]/partide; publicWater venue → /ape-publice/[code]/partide (code from key „water:<code>”); manual pin → no page."
        fish_ref: "features/partide/community/venuePartideHref.ts:15-24"
      - id: partide.comunitate.c17
        text: "A finished card (fallback) shows ribbon „Încheiată”, members as title, venue + stand meta, stats (capturi, „kg total”, „durată”), photo strip, footer date range (fmtRange) and link „Vezi rezumatul”; it opens /partide/[documentId]."
        fish_ref: "features/partide/components/community/CommunityHistoryCard.tsx:11-42"
      - id: partide.comunitate.c18
        text: "„Recorduri” is always rendered as a 2×2 grid of equal tiles: slots AZI (amber), SĂPTĂMÂNA (teal), LUNA (deep indigo, trophy) and a 4th tile „Statistici comunitate” / „Vezi cifrele” (→ /partide/statistici)."
        fish_ref: "features/partide/components/community/RecordsGrid.tsx:30-34"
      - id: partide.comunitate.c19
        text: "A filled record tile shows the photo with the window badge, weight kg, species (fallback „Captură”), venue and angler avatars, and opens /partide/[sessionDocumentId] when the record has one (else not interactive)."
        fish_ref: "features/partide/components/community/RecordsGrid.tsx:42-128"
      - id: partide.comunitate.c20
        text: "An empty record window shows an invitation tile („Recordul de azi/săptămânii/lunii te așteaptă” + „Începe o partidă ›”) that opens /partide/incepe."
        fish_ref: "features/partide/components/community/RecordsGrid.tsx:36-40"
      - id: partide.comunitate.c21
        text: "„Locuri populare” (only when overview.popularVenues is non-empty) shows the top 2 venues side by side: image (placeholder fallback), rose „{n} live” badge when liveCount > 0, name, „{localitate} · {n} partidă/partide” (last 30 days); only venues with a lakeId are links (→ /balti/[lakeId])."
        fish_ref: "features/partide/components/community/PopularVenues.tsx:11-81"
      - id: partide.comunitate.c22
        text: "Relative times on the cards tick on a shared clock (useNowTick), not a per-card timer."
        fish_ref: "features/partide/scenes/AcasaScene.tsx:88-92"
      - id: partide.comunitate.c23
        text: "The overview is refetched every 60 s while the page is open (staleTime 30 s, no retry)."
        fish_ref: "features/partide/community/hooks.ts:65-73"
      - id: partide.comunitate.c24
        text: "Pull-to-refresh (web: a refresh action) refetches the own-sessions list and invalidates every community query (queryKeys.community.all)."
        fish_ref: "app/(app)/(tabs)/partide.tsx:113-120"
      - id: partide.comunitate.c25
        text: "While loading, the scene shows the dashboard skeleton (AcasaSceneSkeleton) instead of zero-filled sections."
        fish_ref: "features/partide/scenes/AcasaScene.tsx:132-134"
      - id: partide.comunitate.c26
        text: "With an active partidă a dock is pinned at the bottom: rose „ACTIVĂ” pill with pulsing dot, venue name, stats line „{n} captură/capturi · {n} scăpat/scăpate (if any) · {kg} kg max (if any)”, a green „Captură” button and one chip per running rod timer; activating the dock opens the partidă."
        fish_ref: "features/partide/components/ActivePartidaDock.tsx:67-153"
      - id: partide.comunitate.c27
        text: "Dock timer chips tick each second only while a rod is counting down, use the server-corrected clock, show the remaining time (fmtDurationCompact), „expirat” in rose when elapsed, and „sincronizare…” while the projection comes from cache or the server clock is unsampled."
        fish_ref: "features/partide/components/ActivePartidaDock.tsx:40-65,157-185"
      - id: partide.comunitate.c28
        text: "The dock's „Captură” is blocked offline with the toast „Fără conexiune. Reconectare…”; online it opens the capture flow for a free (no-rod) capture of the active partidă."
        fish_ref: "app/(app)/(tabs)/partide.tsx:125-132"
    mobile_only: false
    status: todo

  # ───────────────────────────────────────────────────────────────────────────────────────────────
  - id: partide.exploreaza
    title: Partide — Explorează
    fish:
      - "app/(app)/(tabs)/partide.tsx"
      - features/partide/scenes/CommunityScene.tsx
      - features/partide/components/community/VenueSearchScreen.tsx
      - features/partide/components/community/recentVenueSearches.ts
      - features/partide/components/community/VenueGroup.tsx
      - features/partide/components/community/CommunityHistoryCard.tsx
      - features/partide/components/community/NoActiveCta.tsx
      - features/partide/community/hooks.ts
      - features/partide/community/view.ts
      - features/partide/community/useOpenPartida.ts
      - features/partide/community/venuePartideHref.ts
      - features/partide/components/PartideSkeletons.tsx
      - services/queries/useVenueSearch.ts
    web_route: /partide/exploreaza
    template: T1
    milestone: M4
    roles: [guest, angler, organizer, referee, operator]
    core:
      - "core/partide communityActiveInfiniteQuery(venueKeys) (cursor, pageSize 10, staleTime 30s)"
      - "core/partide communityHistoryInfiniteQuery(venueKeys) (page, pageSize 10, staleTime 120s)"
      - "core/partide sessionFollowsQuery (signed in only), followedAnglerUidsQuery (all /following pages, pageSize 100)"
      - "core/partide/domain communityView (filterVenues, filterHistoryRows, endReachedTarget, shouldShowLiveHeader, lakeCardToVenue, publicWaterToVenue)"
      - "core/partide/domain historySelectors resolveOwnPartidaClientId (own vs spectator open)"
      - "core/lakes lakesIndexQuery + public-waters search (venue picker) — MISSING web equivalent of fish useVenueSearch (lakes + public waters by name)"
    states:
      - loading (live page 1 in flight and never loaded before) → list skeleton
      - live section present / absent; live page filtered to zero with more pages (hint row)
      - finished section present / absent
      - LIVE-only mode („Vezi toate” / LIVE chip)
      - chip „Cu notificări” (followed sessions), chip „Prieteni” (followed anglers)
      - venue filter applied (single venue, lake or public water)
      - overall empty with no filters
      - empty for filters (prieteni / other) with „Șterge filtrele”
      - LIVE-only empty
      - history error with no rows
      - history first page in flight (no empty message)
      - "venue picker dialog: browse (recents + live venues) / search results / no results"
      - signed-out (Cu notificări and Prieteni match nothing)
    criteria:
      - id: partide.exploreaza.c1
        text: "A horizontal filter row: a „LIVE” chip (red when active, toggles live-only mode), „Cu notificări”, „Prieteni” and a venue chip labelled „Toate bălțile” or the selected venue name (pin + chevron) that opens the venue picker."
        fish_ref: "features/partide/scenes/CommunityScene.tsx:416-447"
      - id: partide.exploreaza.c2
        text: "„Cu notificări” and „Prieteni” are mutually exclusive toggles; tapping the active one returns to the unfiltered state."
        fish_ref: "features/partide/scenes/CommunityScene.tsx:401-404"
      - id: partide.exploreaza.c3
        text: "„Cu notificări” keeps only sessions whose documentId the viewer follows (bell); „Prieteni” keeps only sessions with at least one member the viewer follows; a venue with no remaining session is dropped."
        fish_ref: "features/partide/community/view.ts:31-46"
      - id: partide.exploreaza.c4
        text: "Selecting a venue refetches both live and finished lists server-side for that venue key (lake:<documentId> or water:<linkCode>) — the query key changes with the selection."
        fish_ref: "features/partide/scenes/CommunityScene.tsx:170-176"
      - id: partide.exploreaza.c5
        text: "Section „ÎN DIRECT” renders when at least one live venue survives the filters OR the first live page has a next cursor; it carries a „Vezi toate” link (→ live-only mode) when there is a next page and live-only is off."
        fish_ref: "features/partide/scenes/CommunityScene.tsx:284-308"
      - id: partide.exploreaza.c6
        text: "When the live page filtered to zero but more pages exist, a hint row reads „Niciun rezultat pe această pagină cu acest filtru. Atinge „Vezi toate” pentru toate partidele live.”"
        fish_ref: "features/partide/scenes/CommunityScene.tsx:300-306"
      - id: partide.exploreaza.c7
        text: "Outside live-only mode the live section uses only live page 1; in live-only mode every loaded live page is shown (deduplicated by venue key) and the finished section is hidden."
        fish_ref: "features/partide/scenes/CommunityScene.tsx:203-216"
      - id: partide.exploreaza.c8
        text: "Section „ÎNCHEIATE” lists finished partide (card D: „Încheiată”, members, venue, capturi, kg total, durată, photos, date range, „Vezi rezumatul”), deduplicated by documentId and filtered by the active chip/venue."
        fish_ref: "features/partide/scenes/CommunityScene.tsx:258-312"
      - id: partide.exploreaza.c9
        text: "Live venue cards use the same solo / duel / leaderboard shapes as the Comunitate page (VenueGroup)."
        fish_ref: "features/partide/scenes/CommunityScene.tsx:504-513"
      - id: partide.exploreaza.c10
        text: "Scrolling to the end loads the next live page in live-only mode, otherwise the next finished page; after 3 consecutive fetches that add no visible row for the current filters, auto-loading stops until a filter changes."
        fish_ref: "features/partide/scenes/CommunityScene.tsx:328-372"
      - id: partide.exploreaza.c11
        text: "Opening a session goes to the viewer's own partidă view when it is the viewer's active partidă or appears in the viewer's own sessions list, otherwise to the spectator view (both /partide/[documentId] on web)."
        fish_ref: "features/partide/community/useOpenPartida.ts:28-43"
      - id: partide.exploreaza.c12
        text: "With no filters, no live venue, no finished row and history settled, the list shows „Nicio partidă publică activă acum.” and the NoActiveCta hero („Începe o partidă” / „Intră cu cod”)."
        fish_ref: "features/partide/scenes/CommunityScene.tsx:581-591"
      - id: partide.exploreaza.c13
        text: "Live-only empty: dead-fish illustration, „Nicio partidă live acum.” and a „Șterge filtrele” button that resets chip, venue and live-only."
        fish_ref: "features/partide/scenes/CommunityScene.tsx:547-601"
      - id: partide.exploreaza.c14
        text: "Filtered empty: dead-fish illustration and „Nu ești singur — pescuitul leagă prietenii. Urmărește profilul unui pescar și vei fi mereu la curent cu partidele lui.” for „Prieteni”, else „Nicio partidă încheiată pentru filtrele alese.”, plus „Șterge filtrele”."
        fish_ref: "features/partide/scenes/CommunityScene.tsx:602-613"
      - id: partide.exploreaza.c15
        text: "History error with no rows (not live-only): „Nu am putut încărca partidele încheiate.” / „Trage în jos pentru a reîncerca.” (web: a retry action)."
        fish_ref: "features/partide/scenes/CommunityScene.tsx:570-580"
      - id: partide.exploreaza.c16
        text: "While the first finished page is in flight no empty message is shown; the full skeleton shows only until live page 1 has loaded once (later refetches never blank the list)."
        fish_ref: "features/partide/scenes/CommunityScene.tsx:193-195,568-569"
      - id: partide.exploreaza.c17
        text: "The venue picker is titled „Filtrează după baltă” with a close control („Închide”) and a search field „Caută o baltă sau o apă publică”, focused on open."
        fish_ref: "features/partide/components/community/VenueSearchScreen.tsx:243-252"
      - id: partide.exploreaza.c18
        text: "With no search term the picker lists: „Toate bălțile” („Fără filtru — tot ce e public”, clears the filter), „Căutări recente” (up to 5 remembered picks, with „Șterge tot”) and „Cu partide acum” (venues present in the loaded live pages)."
        fish_ref: "features/partide/components/community/VenueSearchScreen.tsx:150-180"
      - id: partide.exploreaza.c19
        text: "Typing searches lakes and public waters by name; lakes render first, waters follow under „Ape publice” (waters without a linkCode are excluded); no match shows „Nu am găsit nicio baltă sau apă publică pentru căutarea ta.”"
        fish_ref: "features/partide/components/community/VenueSearchScreen.tsx:223-275"
      - id: partide.exploreaza.c20
        text: "Picking a venue applies it (single pick), closes the picker and remembers it in recents (key lake:/water:, name, helper, image); invalid persisted entries are ignored."
        fish_ref: "features/partide/components/community/VenueSearchScreen.tsx:118"
      - id: partide.exploreaza.c21
        text: "„Cu notificări” uses GET /feed/session-follows only when signed in; signed out the followed set is empty, so the chip shows the filtered-empty state."
        fish_ref: "features/partide/community/hooks.ts:319-338"
    mobile_only: false
    status: todo

  # ───────────────────────────────────────────────────────────────────────────────────────────────
  - id: partide.ale-mele
    title: Partide — Ale mele
    fish:
      - "app/(app)/(tabs)/partide.tsx"
      - features/partide/scenes/AleMeleScene.tsx
      - features/partide/components/MyCatchesRail.tsx
      - features/partide/components/MonthlyCatchesChart.tsx
      - features/partide/components/card/OwnPartidaCard.tsx
      - features/partide/components/ShareCatchSheet.tsx
      - features/partide/helpers/shareCatchHandoff.ts
      - features/partide/helpers/historyView.ts
      - features/partide/helpers/monthlyStats.ts
      - features/partide/domain/hooks.ts
      - services/queries/useMyCatches.ts
      - components/ImageLightbox.tsx
      - components/profile/CatchDetailFooter.tsx
    web_route: /partide/ale-mele
    template: T5
    milestone: M4
    roles: [angler, organizer, referee, operator]
    core:
      - "core/partide partideHistoryQuery (GET /feed/sessions/mine all pages, staleTime 5 min; enabled only on this tab)"
      - "core/partide myCatchesInfiniteQuery (GET /feed/sessions/mine/catches)"
      - "core/partide/domain historyView (computeHistoryStats, openHistoryEntries, aggForSession, sessionVenueName)"
      - "core/partide/domain monthlyStats, historyMappers (listItemToSummaryLocalSession), format (fmtKg, fmtKgStat)"
      - "core/partide/domain cardModel (fmtSpan, fmtRange, venueSubtitle)"
    states:
      - signed-out → sign-in wall
      - first load (nothing cached) → skeleton
      - refreshing („Se actualizează…”)
      - empty journal (no partidă, none active)
      - has active partidă (ÎN DESFĂȘURARE section)
      - no finished partidă yet
      - no catch photos (rail hidden)
      - lightbox open → share card
    criteria:
      - id: partide.ale-mele.c1
        text: "Signed out, the tab body is a wall: illustration, „Jurnalul tău de pescuit”, „Autentifică-te pentru a-ți vedea partidele, capturile și statisticile într-un singur loc.” and a green „Autentifică-te” button (→ sign-in); Comunitate and Explorează stay browsable."
        fish_ref: "app/(app)/(tabs)/partide.tsx:30-53"
      - id: partide.ale-mele.c2
