behaviours:
  - id: organizer.b.signed-out-gate
    text: "Every organizer route (/organizator, the wizard, /concursuri/[id]/sectoare|alocare|cantar…|penalizari…) requires a session; signed-out visitors are sent to /intra?next=<current path>. fish has no route guard (commented out) and relies on the screens only being reachable from signed-in UI."
    fish_ref: app/(app)/_layout.tsx:44-47
    status: passing
    web_note: "proxy.ts matchers (cookie-less → 307 /intra?next=<path+query>): /organizator/:path*, /concursuri/:id/editeaza/:path*, /sectoare, /alocare, /cantar/:path*, /penalizari/:path*; a dead cookie → requireViewer (via requireOrganizer). Unit tests/unit/proxy-matcher.test.ts, lib/server/require-organizer.test.ts; e2e organizator-panou.spec.ts «signed out: every M6 organizer route …»."
  - id: organizer.b.role-gate
    text: "Organizer data (dashboard, lists, stat details, recent lakes) is requested only when profile.role.name === 'Organizer'; the wizard, sectors and participants pages are only offered to the competition's author (userRole author). Web: non-organizers get no /organizator (redirect or 403 page) and non-authors no management pages; the CMS remains the authority."
