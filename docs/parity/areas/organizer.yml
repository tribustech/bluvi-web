# Parity inventory — area "organizer" (Panou organizator, create/edit competition wizard incl. rich text editor,
# ranking explanation and stand allocation, sector stands, participant allocation, scale (cântar) index / history /
# weighing / revisions, penalties hub / select stand / apply).
# Extracted from fish (read-only) on 2026-10-04. Line refs are fish file:line at that date.
#
# Route notes (lib/routes.ts conventions, Romanian segments):
# - The wizard lives at /organizator/concursuri/nou/<pas> (pas: detalii, configurare, clasament, lac-si-sectoare,
#   standuri, revizuire). A saved draft opens with ?ciorna=[draftId]; editing a published, not-started competition uses
#   /concursuri/[id]/editeaza/<pas> (fish: same screens with params.competitionId + returnTo).
# - organizer.wizard is not a fish screen file: it holds the criteria of create-competition/_layout.tsx +
#   contexts/CreateCompetitionContext.tsx (header, step bar, auto-save, exit/delete/risk/progress/publish sheets),
#   which every step inherits.
# - fish (app) has no route-level auth guard (app/(app)/_layout.tsx:44-47 is commented out); the web gates these
#   routes server-side (see organizer.b.signed-out-gate / organizer.b.role-gate).
# Core gaps found while mapping (needed by M6, not in core/ yet): ranking config (general ranking winner modes, grid rule,
# requiresMinFishNumber — fish helpers/rankingConfig.ts), ranking explanations (fish constants/rankingExplanations.ts,
# generalRankingModeExplanations.ts, gridRuleExplanation.ts), feeder legs (allocateFeederRound, currentLegOf,
# previousLegSeats), AI text formatting (POST /ai/format-text), stand label formatting (formatStandLabel /
# formatNationalStand), sector A..X names.
