    text: "No polling anywhere in the area (no refetchInterval): freshness comes from manual refresh, write invalidation and the calendar refetching availability whenever it regains focus. Web: offer an explicit refresh control and refetch on window focus."
    fish_ref: app/(app)/operator/[lakeId]/index.tsx:466-470; app/(app)/operator/[lakeId]/bookings.tsx:150-154; app/(app)/operator/[lakeId]/walk-in/index.tsx:23-32
