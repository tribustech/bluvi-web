      - id: operator.rezervari.c2
        text: "Tabs in order „De aprobat” (clock), „Confirmate” (calendar), „Nefinalizate” (x-circle), „Toate” (list), each with its icon."
        fish_ref: app/(app)/operator/[lakeId]/bookings.tsx:30-36,176-187; features/operator/bookingBuckets.ts:17-26
      - id: operator.rezervari.c3
        text: "„De aprobat” carries a count = meta.pendingCount of the FIRST page of the current list; the count is omitted at 0 (and during first load)."
        fish_ref: app/(app)/operator/[lakeId]/bookings.tsx:143-145,181-184; services/api/booking.ts:166-172
      - id: operator.rezervari.c4
        text: "Sub-filters appear only for Confirmate (Toate, Azi, Viitoare, Trecute, De evaluat) and Nefinalizate (Toate, Cereri neacceptate, Anulate, Neprezentări); „Toate” is the bucket's unfiltered view. Default sub: Confirmate → Azi, others → Toate."
