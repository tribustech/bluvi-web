  # ─────────────────────────────────────────────────────────────────────────────────────────
  - id: operator.detaliu-rezervare
    title: Detaliu rezervare (operator)
    fish:
      - features/operator/BookingDetailSheet.tsx
      - features/operator/OperatorBookingSheet.tsx
      - features/operator/AnglerRatingBadge.tsx
      - features/operator/cancelNotes.ts
      - features/bookings/ui/statusModel.ts
      - services/queries/useBooking.ts
      - services/queries/useUserReputation.ts
    web_route: "dialog on /operator/[lakeId], /operator/[lakeId]/rezervari and /operator/[lakeId]/calendar (?rezervare=[bookingId])"
    template: none
    milestone: M7
    roles: [operator]
    core:
      - booking.bookingQuery (GET /feed/bookings/:id — when opened from the panel or calendar)
      - booking.domain.bookingCard (bookingName, bookingPeriod, bookingHours, bookingActionGates, PAYMENT, formatLei)
      - booking.domain.statusModel (statusAppearance)
      - booking.domain.cancelNotes
      - social.userReputationQuery
    states:
      - loading (skeleton) when opened from the panel on an id
      - stale booking from a previous open (never shown)
      - with / without price basis
      - fully paid / partly paid / unpaid
      - with note / cancel reason / reject reason / meaningful no-show note
      - angler with account (profile link) / walk-in without account
      - pending / cancellable / rateable / none (action row variants)
      - not found / not this lake's (4xx, or a booking of another lake or the viewer's own angler booking) → «Rezervarea nu mai există sau nu e a acestei bălți.» + «Închide»
      - read failed (5xx / network) → inline error «Nu am putut încărca rezervarea.» + «Încearcă din nou»
