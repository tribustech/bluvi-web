        fish_ref: app/(app)/operator/[lakeId]/index.tsx:459-460,494-516
      - id: operator.panou.c2
        text: "Data is GET /feed/lakes/{lakeId}/operator-stats?window={week|month|year}; the window starts at „week” and is the only parameter — every figure above the trend card is anchored to now/today."
        fish_ref: app/(app)/operator/[lakeId]/index.tsx:449-452,462-464; services/api/operatorStats.ts:15-22
      - id: operator.panou.c3
