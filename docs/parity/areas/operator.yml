        fish_ref: app/(app)/operator/[lakeId]/bookings.tsx:66-73; features/operator/bookingBuckets.ts:63-75
      - id: operator.rezervari.c7
        text: "Changing tab or sub-filter scrolls the list back to the top and brings the header back."
