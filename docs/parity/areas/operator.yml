# Parity inventory — area "operator" (Administrare lacuri: alege balta → panoul bălții → rezervări,
# blocaje, calendar/walk-in, evaluează pescarul).
# Extracted from fish (read-only) on 2026-10-04. Line refs are fish file:line at that date.
# The walk-in grid / extras / review steps share BookingFlowProvider, useBookingGridFlow, AvailabilityGrid,
# ExtrasStep and BookingReview with the angler flow inventoried in booking.yml (booking.rezerva-*); the
# criteria here list the operator-specific behaviour and point at the shared booking criteria.
# The home "Balta mea / Bălțile mele" card (components/OwnedLakesCard.tsx) is inventoried in home.yml;
# its links INTO this area are listed under operator.b.entry-points.
# The booking detail sheet and the accept / reject / cancel / no-show sheets have no route in fish; they
# are listed as their own entries (web: dialogs) because three screens open them.
area: operator
screens:
  # ─────────────────────────────────────────────────────────────────────────────────────────
  - id: operator.alege-balta
    title: Administrare lacuri
    fish:
      - app/(app)/operator/index.tsx
      - components/OwnedLakeCard.tsx
      - services/queries/useOwnedLakes.ts
      - services/api/booking.ts
      - components/ErrorScreen.tsx
    web_route: /operator
    template: T1
    milestone: M7
    roles: [operator]
    core:
      - booking.ownedLakesQuery (GET /feed/owned-lakes; private, per user)
    states:
      - signed-out (redirect to /intra and back)
      - loading (full-area loader)
      - error (shared error screen with retry; sign-out only for a dead session)
      - empty — the user administers no lake („Nu administrezi niciun lac.”)
      - exactly one lake → replaced by that lake's panel
      - several lakes → list of lake cards
      - lake without cover image (fallback photo)
    criteria:
