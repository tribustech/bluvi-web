behaviours:
  - id: operator.b.role-gating
    text: "Being an operator = the owned-lakes list (GET /feed/owned-lakes) is non-empty; there is no client role check on /operator/[lakeId]/* — the CMS owner-gates every operator endpoint and a refusal lands in the page's error state. Web: all /operator routes require sign-in (redirect to /intra and back); a non-owner sees an error/403 state; the top bar's „Administrare” menu shows the operator entry only when owned lakes exist (ROADMAP §4)."
    fish_ref: components/OwnedLakesCard.tsx:58-64; app/(app)/operator/[lakeId]/index.tsx:519-529
    status: partial
    web_note: "proxy.ts { source: '/operator/:path*' } (cookie-less → 307 /intra?next=<path+query>; unit lib/routes-operator.test.ts) + _shared/gate.tsx OperatorGate (requireViewer: a dead cookie → /intra, session unknown → the route's error.tsx). No client role check: the picker's 403 reads «Nu ai acces» (OperatorErrorState). e2e operator-alege-balta.spec.ts «operator.b.role-gating …» (signed out, 403). Left: the /operator/[lakeId]/* screens' own non-owner states (their batches)."
  - id: operator.b.entry-points
    text: "Entry points into the area: Acasă operator card (whole card → panel; „Vezi” pending → rezervari?status=pending; „Vezi ziua” → panel or „Vezi grila” → calendar; drop-outs „Vezi” → ?status=cancelled; reviews „Vezi” → ?status=toreview; quick actions Panou / Calendar / Rezervări with pending badge). With one lake each link targets /operator/[lakeId]{suffix}, with several they all open the picker /operator."
    fish_ref: components/OwnedLakesCard.tsx:77-79,88,132,168,204,239,250-276
    status: partial
    web_note: "Hrefs verified against the real local CMS (QA user, one lake): Acasă «Balta mea» card and the top bar's Administrare item → /operator/{chita}; /operator (the several-lakes target) is a real page now (200, not the catch-all). lib/routes.ts carries every M7 target (operator, operatorCalendar, operatorBookings with status pending|cancelled|rejected|toreview|all + focus, operatorBlocks, operatorBlockNew, operatorCalendarExtras/Review, operatorRateAngler, withBookingDetail). e2e operator-alege-balta.spec.ts «operator.b.entry-points …». Left: /operator/[lakeId], /calendar, /rezervari land on real pages once their M7 batches ship."
  - id: operator.b.notification-routes
    text: "Notifications: BOOKING_NEW_REQUEST_OPERATOR and BOOKING_PENDING_NUDGE_OPERATOR → /operator/{lakeId}/rezervari?status=pending; BOOKING_AUTO_REJECTED_OPERATOR → ?status=rejected; BOOKING_CANCELLED_OPERATOR → ?status=cancelled; no route without lakeId."
    fish_ref: helpers/getRedirectLocationForNotification.ts:146-157
  - id: operator.b.status-param
    text: "The inbox's ?status= is the single deep-link vocabulary (pending, cancelled, rejected, toreview, all) used by the panel, Acasă and notifications; it maps to bucket + sub-filter via bucketFromLegacyStatus and must keep working for links shipped by older apps."
    fish_ref: features/operator/bookingBuckets.ts:54-75
  - id: operator.b.focus-param
    text: "?focus={bookingId} on the inbox brings one booking into view once it is loaded (no fish caller passes it today; pair it with status=all, the only bucket guaranteed to hold it)."
    fish_ref: app/(app)/operator/[lakeId]/bookings.tsx:66-72,112-142; features/operator/bookingBuckets.ts:71-73
  - id: operator.b.write-invalidation
    text: "Every booking write (accept, reject, operator cancel, no-show, block create/delete) invalidates both ['bookings'] and ['operator-stats'] roots; walk-in also invalidates the owned-lakes stats and per-lake stats; an angler review invalidates reputation, bookings and operator-stats. These endpoints are private (no CDN), so client cache is the only stale copy."
    fish_ref: services/mutations/invalidateOperatorSurfaces.ts:4-21; services/mutations/useCreateWalkInBooking.ts:10-16; services/mutations/useCreateAnglerReview.ts:9-20
    web_note: "M7-B1 (operator.actiuni-rezervare): accept, reject, operator cancel and no-show proven in e2e — the booking re-reads, operator-stats is re-requested, no-show re-requests reputation (tests/e2e/operator-actiuni-rezervare.spec.ts). Block create/delete, walk-in and the angler review are proven by their own screens' specs; status stays todo until they are."
