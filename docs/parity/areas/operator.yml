  # ─────────────────────────────────────────────────────────────────────────────────────────
  - id: operator.rezervari
    title: Administrare rezervări
    fish:
      - app/(app)/operator/[lakeId]/bookings.tsx
      - features/operator/bookingBuckets.ts
      - features/operator/OperatorBookingRow.tsx
      - features/operator/AnglerRatingBadge.tsx
      - features/operator/bookingAge.ts
      - features/operator/cancelNotes.ts
      - features/operator/todayCounts.ts
      - features/operator/BookingDetailSheet.tsx
      - features/operator/useOperatorBookingActions.tsx
      - features/bookings/ui/SegmentedTabs.tsx
      - features/bookings/ui/SubFilterRow.tsx
      - features/bookings/ui/InlineErrorState.tsx
      - features/bookings/ui/BookingListSkeleton.tsx
      - features/bookings/ui/statusModel.ts
      - contexts/CollapsibleHeaderContext.tsx
      - services/queries/useLakeBookings.ts
      - services/queries/useUserReputation.ts
      - services/api/booking.ts
    web_route: /operator/[lakeId]/rezervari?status=pending|cancelled|rejected|toreview|all
    template: T1
    milestone: M7
    roles: [operator]
    core:
      - booking.lakeBookingsInfiniteQuery (GET /feed/bookings/lake/:lakeId?bucket&sub&page&pageSize=20; meta.pendingCount)
      - booking.domain.operatorBookingBuckets (BUCKETS, BUCKET_LABELS, SUB_LABELS, subsFor, defaultSub, bucketFromLegacyStatus, emptyCopy)
      - booking.domain.bookingCard (bookingName, bookingPeriod, bookingHours, bookingActionGates, PAYMENT, formatLei)
      - booking.domain.statusModel (statusAppearance, viewer operator)
      - booking.domain.bookingAge (bookingAgeLabel, isRequestStale)
      - booking.domain.cancelNotes (stripAppendedCancelReason, meaningfulNoShowNote)
      - booking.domain.todayCounts (todayMoment for turnover cards)
      - social.userReputationQuery (rating badge + no-show pill per row)
    states:
      - signed-out (redirect to /intra and back)
      - first load of a tab (skeleton, not the previous tab's rows)
      - first-page error (inline error with retry, no sign-out)
      - empty per bucket/sub (dedicated copy)
      - loaded; next page loading (footer spinner); next page failed (inline footer retry)
      - Confirmate · Azi with turnover stands (grouped card)
      - De aprobat with requests (Acceptă / Refuză on cards), stale request (age in red)
      - De evaluat (Evaluează pescarul on cards)
      - cancelled / rejected / no-show rows (quiet card + reason)
      - opened with ?status= from a notification, the panel or Acasă
    criteria:
