# Parity inventory — area "operator" (Administrare lacuri: alege balta → panoul bălții → rezervări,
# blocaje, calendar/walk-in, evaluează pescarul).
# Extracted from fish (read-only) on 2026-10-04. Line refs are fish file:line at that date.
# The walk-in grid / extras / review steps share BookingFlowProvider, useBookingGridFlow, AvailabilityGrid,
# ExtrasStep and BookingReview with the angler flow inventoried in booking.yml (booking.rezerva-*); the
# criteria here list the operator-specific behaviour and point at the shared booking criteria.
# The home "Balta mea / Bălțile mele" card (components/OwnedLakesCard.tsx) is inventoried in home.yml;
# its links INTO this area are listed under operator.b.entry-points.
# The booking detail sheet and the accept / reject / cancel / no-show sheets have no route in fish; they
# are listed as their own entries (web: dialogs) because three screens open them.
area: operator
screens:
  # ─────────────────────────────────────────────────────────────────────────────────────────
  - id: operator.alege-balta
    title: Administrare lacuri
    fish:
      - app/(app)/operator/index.tsx
      - components/OwnedLakeCard.tsx
      - services/queries/useOwnedLakes.ts
      - services/api/booking.ts
      - components/ErrorScreen.tsx
    web_route: /operator
    template: T1
    milestone: M7
    roles: [operator]
    core:
      - booking.ownedLakesQuery (GET /feed/owned-lakes; private, per user)
    states:
      - signed-out (redirect to /intra and back)
      - loading (full-area loader)
      - error (shared error screen with retry; sign-out only for a dead session)
      - empty — the user administers no lake („Nu administrezi niciun lac.”)
      - exactly one lake → replaced by that lake's panel
      - several lakes → list of lake cards
      - lake without cover image (fallback photo)
    criteria:
      - id: operator.alege-balta.c1
        text: "Header: back button + title „Administrare lacuri”. Back goes to the previous page when there is one, otherwise to Acasă (/)."
        fish_ref: app/(app)/operator/index.tsx:40-45
        status: passing
        web_note: "e2e tests/e2e/operator-alege-balta.spec.ts «c1 c2 c6 c7 c8 c9 …» (header) and «c1: Back goes to the previous page, else to Acasă»."
      - id: operator.alege-balta.c2
        text: "The list is the signed-in user's owned lakes from GET /feed/owned-lakes; while it loads a full-area loader is shown."
        fish_ref: app/(app)/operator/index.tsx:18,47-48; services/api/booking.ts:231-237
        status: passing
        web_note: "e2e tests/e2e/operator-alege-balta.spec.ts «c1 c2 c6 c7 c8 c9 …» (a delayed mock: the loader, then the cards)."
      - id: operator.alege-balta.c3
        text: "A failed load shows the shared error screen with „Încearcă din nou” (refetch); a dead session additionally offers „Deconectează-te”."
        fish_ref: app/(app)/operator/index.tsx:49-50; components/ErrorScreen.tsx:42-57
        status: passing
        web_note: "e2e tests/e2e/operator-alege-balta.spec.ts «c3: a failed read …» (500 → retry refetches) and «c3: a refused session (401) …» (Deconectează-te only)."
      - id: operator.alege-balta.c4
        text: "When the user owns exactly one lake the picker is skipped: the route is REPLACED (not pushed) by /operator/[lakeId], so Back does not bounce through the picker."
        fish_ref: app/(app)/operator/index.tsx:20-26
        status: passing
        web_note: "e2e tests/e2e/operator-alege-balta.spec.ts «c4 operator.b.single-lake …» against the REAL local CMS (QA user owns only Chita): replace, no card ever painted, Back leaves /operator."
      - id: operator.alege-balta.c5
        text: "With no owned lake the list shows the centred empty text „Nu administrezi niciun lac.”"
        fish_ref: app/(app)/operator/index.tsx:58-64
        status: passing
        web_note: "e2e tests/e2e/operator-alege-balta.spec.ts «c5: no owned lake …»."
      - id: operator.alege-balta.c6
        text: "One card per lake, in server order; activating a card opens that lake's panel /operator/[lakeId] (push)."
        fish_ref: app/(app)/operator/index.tsx:28-33,52-57
        status: passing
        web_note: "e2e tests/e2e/operator-alege-balta.spec.ts «c1 c2 c6 …» (server order, push: Back returns to the picker)."
      - id: operator.alege-balta.c7
        text: "Card: lake cover photo as background (bundled lake photo when coverImageUrl is missing) under a dark scrim, the lake name (one line, truncated) and a right chevron."
        fish_ref: components/OwnedLakeCard.tsx:31,46-62
        status: passing
        web_note: "e2e tests/e2e/operator-alege-balta.spec.ts «c1 c2 c6 c7 …» (cover / bundled fallback, one truncated line) and «c7: a cover that fails to load …»."
      - id: operator.alege-balta.c8
        text: "Card stats row, three tiles: amber dot + pending count „În așteptare”; teal dot + active count „Active”; cashToCollect formatted ro-RO „De încasat azi (lei)”. Missing values read 0."
        fish_ref: components/OwnedLakeCard.tsx:65-72
        status: passing
        web_note: "e2e tests/e2e/operator-alege-balta.spec.ts «c1 c2 c6 c7 c8 …» (3 / 12 / 12.500 lei, 450,5, missing → 0, amber + teal dots)."
      - id: operator.alege-balta.c9
        text: "The whole card is one control (keyboard-focusable on web, named by the lake)."
        fish_ref: components/OwnedLakeCard.tsx:34-45
        status: passing
        web_note: "e2e tests/e2e/operator-alege-balta.spec.ts «c1 … c9» (one link per card named by the lake, the tiles hit the card) and «c9 keyboard …»."
    mobile_only: false
    status: passing
    e2e: tests/e2e/operator-alege-balta.spec.ts
    web_note: "M7-B1: app/(site)/operator (page, loading, error, _picker/{PickerScreen,PickerFallback,OwnedLakeCard,model + model.test.ts}), on the area's shared frame app/(site)/operator/_shared (OperatorGate/operatorMetadata, OperatorFrame/OperatorHeader, OperatorErrorState/OperatorRouteError, useOperatorTransport, useOwnedLakeName). T1 frame: back + h1, cards in ListGrid min lg (one column on a phone, auto-fill from 768). Per owner: proxy.ts /operator/:path* + requireViewer, GET /feed/owned-lakes through /api/cms (never cached, noindex). Web differences: the loader is the cards' skeleton; the cash tile shows «12.500 lei» (unit its own smaller element, owner rule 10) over «De încasat azi» instead of fish's «De încasat azi (lei)»; the empty state adds one caption line; a 403 reads «Nu ai acces». Screenshots of every state at 375/1280/1440/1920 in .shots/operator-alege-balta; axe 0 at 375/1280/1920 (list, empty, error)."

  # ─────────────────────────────────────────────────────────────────────────────────────────
  - id: operator.panou
    title: Panoul bălții
    fish:
      - app/(app)/operator/[lakeId]/index.tsx
      - features/operator/OperatorQuickAction.tsx
      - features/operator/todayCounts.ts
      - features/operator/dashboard/LakeTrendCard.tsx
      - features/operator/dashboard/trendLabels.ts
      - features/operator/OperatorBookingSheet.tsx
      - features/bookings/ui/AlertCard.tsx
      - features/bookings/ui/StatTile.tsx
      - features/partide/components/ActivityLineChart.tsx
      - helpers/formatBookingPeriod.ts
      - services/queries/useLakeOperatorStats.ts
      - services/queries/useOwnedLakes.ts
      - services/api/operatorStats.ts
      - models/operatorStats.type.ts
    web_route: /operator/[lakeId]
    template: T5
    milestone: M7
    roles: [operator]
    core:
      - lakes.lakeOperatorStatsQuery (GET /feed/lakes/:id/operator-stats?window=; placeholder = previous)
      - booking.ownedLakesQuery (lake name for the header)
      - booking.domain.todayCounts (todayPhase, todayMoment, todayMomentBand, todayListRows, groupTodayByStand, stayProgress, cashDueToday)
      - booking.domain.trendLabels (trendAxisLabels, trendDetailLabel, trendScrubOccupancy, trendSummary)
      - booking.domain.bookingCard (formatLei)
      - formatBookingPeriod — not in core yet (fish helpers/formatBookingPeriod.ts)
    states:
      - signed-out (redirect to /intra and back)
      - not the owner of this lake (server refuses → error state)
      - first load (header + spinner, no quick actions)
      - error with no data (header + shared error screen)
      - loaded, no pending requests (request card hidden)
      - loaded, 1 / N pending requests, with / without oldestPending (older CMS)
      - today empty / empty except a competition („Nicio rezervare în afara concursului.”)
      - today with plain stands, turnover stands, more than 5 stands („Vezi toate”)
      - booking live (progress bar), done / no-show (dimmed), next
      - cancellations in last 24h and/or stays to review (card shown) / neither (card hidden)
      - occupancyNow present vs absent (label „acum” vs „azi”)
      - cash tile with 7-day figure / no arrivals today / all paid / none of these
      - trend window switching (chart dimmed, rest of the page unchanged)
      - trend card hidden when the window has no points
      - scrubbing a chart point (header shows the day's numbers)
      - booking detail dialog open (see operator.detaliu-rezervare)
